<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelling Master</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#182033;text-align:center}
#app{max-width:700px;margin:auto;padding:20px}.card{background:white;border-radius:20px;padding:25px;margin-top:20px;box-shadow:0 4px 15px #0001}
h1{color:#4f46e5}.word{font-size:38px;font-weight:bold;margin:20px 0}.translation{font-size:22px;color:#059669;font-weight:bold}
.definition{font-size:18px;line-height:1.5;margin:15px 0}.sentence{font-size:22px;line-height:1.6;margin:25px 0}
button,.option{border:0;border-radius:12px;padding:14px 18px;margin:7px;font-size:17px;cursor:pointer;background:#4f46e5;color:white}
button:hover,.option:hover{opacity:.9}.option{display:block;width:100%;background:#eef2ff;color:#182033}.listen-btn{background:#7c3aed}
.correct{background:#16a34a!important;color:white!important}.wrong{background:#dc2626!important;color:white!important}
.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.modules button{margin:0}
.progress{height:10px;background:#ddd;border-radius:10px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#4f46e5;width:0}
.hangman-word{font-size:32px;letter-spacing:9px;margin:25px}.letters{display:flex;flex-wrap:wrap;justify-content:center}
.letters button{padding:10px 13px;margin:4px}.score{font-size:20px;font-weight:bold;color:#4f46e5}
.small{color:#666;font-size:14px}
@media(max-width:500px){.word{font-size:30px}.modules{grid-template-columns:repeat(3,1fr)}button,.option{font-size:15px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const words=[
["abbreviation","abreviación","A short form of a word or phrase.","Dr. is an _______ for Doctor."],
["abroad","en el extranjero","In another country.","My aunt lives _______."],
["access","acceso","The ability to enter, use, or reach something.","I need _______ to the computer."],
["accord","acuerdo","An agreement between people or groups.","They made an _______."],
["adequate","suficiente","Enough for what is needed.","We have _______ food for everyone."],
["advancements","avances","Improvements or new developments.","New _______ help sick people."],
["aeronautics","aeronáutica","The study of flying and aircraft.","He studies _______ and planes."],
["affectionate","cariñoso","Showing love or care.","The _______ dog likes to hug."],
["affliction","aflicción","A problem, illness, or source of pain.","The illness was a painful _______."],
["aggregate","total","A total made by adding things together.","The _______ score was 20."],
["agony","agonía","Very strong physical or emotional pain.","He cried in _______."],
["aide","ayudante","A person who helps another person.","The teacher's _______ helped me."],
["aisle","pasillo","A space between rows of seats or shelves.","Walk down the _______ to your seat."],
["alibi","coartada","A claim that someone was somewhere else.","He had an _______ for that night."],
["allegiance","lealtad","Strong loyalty to a person, group, or country.","The soldier showed _______ to his country."],
["ambient","ambiental","The surrounding atmosphere or sound.","We heard soft _______ music."],
["amnesty","amnistía","Official forgiveness for certain people.","The leader gave _______ to the prisoners."],
["anatomy","anatomía","The study of the parts of a body.","We studied human _______ in class."],
["animosity","enemistad","Strong dislike between people or groups.","There was _______ between the two teams."],
["apathy","apatía","A lack of interest or care.","His _______ showed that he did not care."],
["approach","enfoque","A way of dealing with something.","We tried a new _______ to the problem."],
["archaic","arcaico","Very old and no longer commonly used.","That old word is _______ now."],
["arrogant","arrogante","Thinking you are better than others.","The _______ boy thought he was better than everyone."],
["assignment","tarea","A piece of work given to do.","I finished my _______ after school."],
["audacity","audacia","Boldness or courage to do something.","She had the _______ to speak up."],
["auspicious","auspicioso","Showing that something may go well.","It was an _______ start to the year."],
["baffle","desconcertar","To confuse someone.","The hard question may _______ me."],
["banish","desterrar","To send someone away.","The king chose to _______ the man."],
["banquet","banquete","A large formal meal.","We ate at a big _______."],
["barricade","barricada","A barrier used to block a place.","The police put up a _______."],
["bashful","tímido","Shy or easily embarrassed.","The _______ girl hid her face."],
["battalion","batallón","A large group of soldiers.","The _______ walked across the field."],
["because","porque","For the reason that.","I stayed home _______ I was sick."],
["belated","atrasado","Coming later than expected.","She sent a _______ birthday card."],
["beloved","amado","Loved very much.","The dog was _______ by the family."],
["benevolent","benevolente","Kind and willing to help others.","The _______ man helped the poor."],
["bibliography","bibliografía","A list of sources used in a report.","I added a _______ to my report."],
["bilingual","bilingüe","Able to use two languages.","My friend is _______ in English and Spanish."],
["bizarre","extraño","Very strange or unusual.","The story had a _______ ending."],
["blockade","bloqueo","Something that blocks a place or path.","The ships made a _______."],
["boarder","interno","A person who lives at a school or home.","The _______ lived at the school."],
["boisterous","bullicioso","Very noisy and energetic.","The _______ kids were very loud."],
["border","frontera","The line between two countries or areas.","We crossed the _______ into another country."],
["bracelet","pulsera","A piece of jewelry worn around the wrist.","She wore a blue _______."],
["breathe","respirar","To take air into your lungs.","Take a deep breath and _______."],
["bridge","puente","A structure that lets people cross over something.","We walked over the _______."],
["brilliant","brillante","Very smart or excellent.","She had a _______ idea."],
["bruise","moretón","A dark mark caused by an injury.","I have a _______ on my leg."],
["bulletin","boletín","A short public notice.","The school posted a _______."],
["bungalow","bungaló","A small house, usually with one floor.","We stayed in a small _______."],
["calligraphy","caligrafía","Beautiful or decorative handwriting.","Her _______ is very neat."],
["callous","insensible","Not caring about other people's feelings.","His _______ words hurt her."],
["camouflage","camuflaje","Colors or clothes used to hide.","The soldier wore _______ clothes."],
["candid","sincero","Honest and direct.","She gave me a _______ answer."],
["carnivorous","carnívoro","Eating meat.","A lion is a _______ animal."],
["casserole","cazuela","A dish cooked and served in one container.","Mom made a chicken _______."],
["catastrophe","catástrofe","A very bad disaster.","The storm was a huge _______."],
["cauldron","caldero","A large pot used for cooking.","The witch stirred the soup in a _______."],
["celestial","celestial","Related to the sky or stars.","We saw a _______ object in the sky."],
["characterize","caracterizar","To describe the qualities of someone or something.","The details _______ the main character."],
["chimpanzee","chimpancé","An animal related to apes and humans.","The _______ climbed the tree."],
["choreography","coreografía","The planned movements of a dance.","The dancers learned the _______."],
["circumstance","circunstancia","A condition or situation.","Under the _______ , we should leave."],
["clandestine","clandestino","Kept secret or hidden.","They had a _______ meeting."],
["Clemency","clemencia","Mercy shown to someone.","The prisoner asked for _______."],
["clientele","clientela","The customers of a business.","The store has many regular _______."],
["cohesive","cohesivo","Working well together as one group.","The team was _______ and worked well together."],
["coincidence","coincidencia","A surprising event that happens by chance.","It was a strange _______."],
["colleague","colega","A person you work with.","My _______ helped me at work."],
["colloquial","coloquial","Used in casual everyday speech.","That word is common in _______ English."],
["compensation","compensación","Money or something given for work or loss.","She got _______ for her work."],
["compulsory","obligatorio","Required or must be done.","School is _______ for children."],
["condolence","condolencia","An expression of sympathy after a loss.","We sent our _______ to the family."],
["configuration","configuración","The way something is arranged or set up.","The computer has a new _______."],
["constellation","constelación","A group of stars forming a pattern.","Orion is a _______."],
["courageous","valiente","Showing courage.","The _______ firefighter saved the child."],
["creation","creación","Something made or created.","This painting is her new _______."],
["credentials","credenciales","Proof of qualifications or identity.","He showed his _______ to the boss."],
["criticism","crítica","An opinion about what could be improved.","He listened to the teacher's _______."],
["cuisine","cocina","A style of cooking.","I love Puerto Rican _______."],
["culminate","culminar","To end with an important final event.","The show will _______ with a song."],
["customary","habitual","Usual or traditional.","It is _______ to say hello."],
["dandelion","diente de león","A yellow flower that makes white seeds.","The child blew on the _______."],
["dangerous","peligroso","Able to cause harm.","That road is _______ at night."],
["debatable","discutible","Open to different opinions.","The answer is _______."],
["December","diciembre","The twelfth month of the year.","Christmas is in _______."],
["effective","efectivo","Working well or producing a result.","This study plan is very _______."],
["eligible","elegible","Allowed or qualified to do something.","She is _______ to play."]
];

const modules=[];
modules.push(words.slice(0,8));
for(let i=8;i<words.length;i+=10)modules.push(words.slice(i,i+10));

let mod=[],stage="",index=0,score=0,failed=[],spellingAnswered=0,sentenceAnswered=0,hangmanPoints=0;
const app=document.getElementById("app");

function speak(w){
 if("speechSynthesis"in window){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.7;
  speechSynthesis.speak(u);
 }
}
function autoSpeak(w){setTimeout(()=>speak(w),300)}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function progress(){
 let pct=Math.round(index/mod.length*100);
 return `<div class="progress"><div class="bar" style="width:${pct}%"></div></div>`;
}
function home(){
 app.innerHTML=`<div class="card"><h1>📚 Spelling Master</h1><p>Choose a module</p><div class="modules">
 ${modules.map((_,i)=>`<button onclick="start(${i})">Module ${i+1}</button>`).join("")}</div></div>`;
}
function start(n){
 mod=modules[n];index=0;score=0;failed=[];spellingAnswered=0;sentenceAnswered=0;hangmanPoints=0;
 stage="learn";show();
}
function show(){stage=="learn"?learn():stage=="listen"?listen():stage=="spell"?spell():stage=="sentence"?sentence():stage=="hangman"?hangman():review()}
function nav(next){
 index++;
 if(index>=mod.length){index=0;stage=next;show()}else show();
}
function learn(){
 let w=mod[index];
 app.innerHTML=`<div class="card"><h1>📖 Learn</h1>${progress()}<div class="word">${w[0]}</div>
 <div class="translation">${w[1]}</div><div class="definition">${w[2]}</div>
 <button class="listen-btn" onclick="speak('${w[0]}')">🔊 Repeat Word</button>
 <p class="small">The word will be said automatically.</p>
 <button onclick="nav('listen')">Next ➜</button></div>`;
 autoSpeak(w[0]);
}
function listen(){
 let w=mod[index],choices=shuffle([w,...shuffle(mod.filter(x=>x[0]!=w[0])).slice(0,3)]);
 app.innerHTML=`<div class="card"><h1>👂 Listen & Choose</h1>${progress()}
 <p>Listen and choose the word you hear.</p><button class="listen-btn" onclick="speak('${w[0]}')">🔊 Repeat Word</button>
 <div>${choices.map(x=>`<button class="option" onclick="answerListen(this,'${x[0]}','${w[0]}')">${x[0]}</button>`).join("")}</div></div>`;
 autoSpeak(w[0]);
}
function answerListen(btn,a,c){
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(a==c){btn.classList.add("correct");score+=10}
 else{btn.classList.add("wrong");failed.push(c);document.querySelectorAll(".option").forEach(b=>{if(b.innerText==c)b.classList.add("correct")})}
 setTimeout(()=>nav("spell"),700);
}
function misspellings(w){
 let a=[];
 if(w.length>4)a.push(w.slice(0,-1),w[0]+w,w.slice(0,2)+w[3]+w[2]+w.slice(4));
 let i=Math.floor(Math.random()*w.length);
 a.push(w.slice(0,i)+w[i+1]+w.slice(i+1));
 a=a.filter(x=>x&&x!=w&&!a.includes(x));
 while(a.length<3){
  let j=Math.floor(Math.random()*w.length);
  let x=w.slice(0,j)+String.fromCharCode(97+Math.floor(Math.random()*26))+w.slice(j+1);
  if(x!=w&&!a.includes(x))a.push(x);
 }
 return shuffle([w,...a.slice(0,3)]);
}
function spell(){
 let w=mod[index],c=misspellings(w[0]);
 app.innerHTML=`<div class="card"><h1>✏️ Spelling Practice</h1>${progress()}
 <div class="translation">${w[1]}</div><div class="definition">${w[2]}</div><h2>Which spelling is correct?</h2>
 ${c.map(x=>`<button class="option" onclick="answerSpell(this,'${x}','${w[0]}')">${x}</button>`).join("")}</div>`;
}
function answerSpell(btn,a,c){
 spellingAnswered++;
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(a==c){btn.classList.add("correct");score+=20}else{btn.classList.add("wrong");failed.push(c);document.querySelectorAll(".option").forEach(b=>{if(b.innerText==c)b.classList.add("correct")})}
 setTimeout(()=>nav("sentence"),700);
}
function sentence(){
 let w=mod[index],c=shuffle([w,...shuffle(mod.filter(x=>x[0]!=w[0])).slice(0,3)]);
 app.innerHTML=`<div class="card"><h1>📝 Sentence Practice</h1>${progress()}<div class="sentence">${w[3]}</div>
 ${c.map(x=>`<button class="option" onclick="answerSentence(this,'${x[0]}','${w[0]}')">${x[0]}</button>`).join("")}</div>`;
}
function answerSentence(btn,a,c){
 sentenceAnswered++;
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(a==c){btn.classList.add("correct");score+=20}else{btn.classList.add("wrong");failed.push(c);document.querySelectorAll(".option").forEach(b=>{if(b.innerText==c)b.classList.add("correct")})}
 setTimeout(()=>nav("hangman"),700);
}
let hw="",guessed=[],tries=6;
function hangman(){
 let w=mod[index];hw=w[0];guessed=[];tries=6;
 drawHangman(w);
}
function drawHangman(w){
 let display=hw.split("").map(x=>guessed.includes(x)?x:"_").join(" ");
 let letters=[..."abcdefghijklmnopqrstuvwxyz"];
 app.innerHTML=`<div class="card"><h1>🎯 Hangman</h1>${progress()}
 <div class="translation">${w[1]}</div><div class="definition">${w[2]}</div>
 <div class="hangman-word">${display}</div><p>Attempts left: ${tries}</p>
 <div class="letters">${letters.map(l=>`<button ${guessed.includes(l)?"disabled":""} onclick="guess('${l}')">${l}</button>`).join("")}</div></div>`;
}
function guess(l){
 if(guessed.includes(l))return;guessed.push(l);
 if(hw.includes(l))hangmanPoints+=10,score+=10;else tries--;
 if(hw.split("").every(x=>guessed.includes(x))){
  score+=50;hangmanPoints+=50;setTimeout(()=>nav("review"),500);return;
 }
 if(tries<=0){failed.push(hw);setTimeout(()=>nav("review"),500);return}
 drawHangman(mod[index]);
}
function review(){
 let bad=[...new Set(failed)];
 if(!bad.length){final();return}
 let w=bad[0];failed=bad.slice(1);mod=[w];index=0;
 stage="spell";spell();
}
function final(){
 let total=spellingAnswered+sentenceAnswered;
 let acc=total?Math.round((spellingAnswered+sentenceAnswered-failed.length)/total*100):100;
 app.innerHTML=`<div class="card"><h1>🏆 Final Score</h1>
 <div class="score">Total Points: ${score}</div><p>Spelling questions: ${spellingAnswered}</p>
 <p>Sentence questions: ${sentenceAnswered}</p><p>Hangman points: ${hangmanPoints}</p>
 <p>Accuracy: ${acc}%</p><button onclick="home()">🏠 Home</button></div>`;
}
home();
</script>
</body>
</html>
