<title>Spelling Master</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: white;
  padding: 15px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 900px;
  margin: auto;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.score {
  font-weight: bold;
}

.progress-container {
  max-width: 900px;
  margin: 12px auto 0;
  height: 9px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width .3s;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
  text-align: center;
}

h1 {
  margin-top: 0;
}

.word {
  font-size: 42px;
  font-weight: bold;
  margin: 20px 0 10px;
  word-break: break-word;
}

.translation {
  font-size: 20px;
  color: #555;
  margin-bottom: 20px;
}

.definition {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 650px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px 22px;
  font-size: 16px;
  cursor: pointer;
  margin: 7px;
  background: #2563eb;
  color: white;
  transition: .2s;
}

button:hover {
  transform: translateY(-1px);
  opacity: .92;
}

button:disabled {
  cursor: not-allowed;
}

.audio-btn {
  background: #111827;
}

.option {
  display: block;
  width: min(600px, 100%);
  margin: 12px auto;
  background: #eef2ff;
  color: #111827;
  border: 2px solid transparent;
}

.option:hover {
  border-color: #2563eb;
}

.feedback {
  min-height: 30px;
  margin: 15px;
  font-weight: bold;
}

.correct {
  color: #15803d;
}

.incorrect {
  color: #dc2626;
}

.sentence {
  font-size: 28px;
  margin: 30px auto;
  max-width: 700px;
  line-height: 1.5;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-top: 25px;
}

.module-card {
  background: #f8fafc;
  border: 2px solid #e5e7eb;
  border-radius: 16px;
  padding: 20px;
}

.module-card h3 {
  margin-top: 0;
}

.module-card button {
  width: 100%;
}

.word-counter {
  color: #64748b;
  font-weight: bold;
}

.hangman-word {
  font-size: clamp(22px, 6vw, 48px);
  letter-spacing: clamp(3px, 1vw, 10px);
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  margin: 25px auto;
}

.attempts {
  font-weight: bold;
  margin: 10px;
}

.keyboard {
  max-width: 700px;
  margin: 25px auto;
}

.keyboard-row {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin: 5px 0;
}

.letter-btn {
  width: 48px;
  height: 48px;
  padding: 0;
  margin: 0;
  font-weight: bold;
}

.letter-btn.used {
  background: #cbd5e1;
  color: #64748b;
  opacity: .6;
}

.result {
  font-size: 28px;
  font-weight: bold;
  margin: 25px 0;
}

.review-title {
  color: #7c3aed;
  font-weight: bold;
}

@media(max-width:600px) {
  .card {
    padding: 20px 15px;
  }

  .word {
    font-size: 32px;
  }

  .sentence {
    font-size: 22px;
  }

  .letter-btn {
    width: 31px;
    height: 42px;
    font-size: 13px;
  }

  .keyboard-row {
    gap: 3px;
  }
}
</style>
</head>

      definition: "Something that happens as a result of an action.",
      sentence: "Every choice has a ________.",
      spellingOptions: ["consequence","consequense","consecuence","consequance"]
    },
    {

      definition: "To show how something works or how to do something.",

    {

    },
    {
      word: "responsibility",
      spanish: "responsabilidad",
      definition: "Something that you are expected to take care of.",
      sentence: "Taking care of the dog is my ________.",
      spellingOptions: ["responsability","responsibility","responsibilty","responcibility"]
    },
    {
      word: "understanding",
      spanish: "comprensión",
      definition: "Knowledge of what something means.",
      sentence: "Reading helps our ________.",
      spellingOptions: ["understading","understanding","understaning","understending"]
    }
  ]
}
];

let currentModule = 0;
let words = [];
let currentIndex = 0;
let score = 0;
let failedWords = [];

let hangmanWord = "";
let guessedLetters = [];
let attempts = 6;
let hangmanPoints = 0;
let hangmanMode = "main";

const qwertyRows = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["z","x","c","v","b","n","m"]
];

const content = document.getElementById("content");

function showHome() {

  content.innerHTML = `
    <h1>📘 Spelling Master</h1>
    <p>Choose a module to begin.</p>

    <div class="module-grid">
      ${modules.map((module, index) => `
        <div class="module-card">
          <h3>${module.name}</h3>
          <p>${module.words.length} words</p>
          <button onclick="startModule(${index})">
            Start ${module.words.length} Words
          </button>
        </div>
      `).join("")}
    </div>
  `;

  updateProgress(0);
}

function startModule(index) {

  currentModule = index;
  words = modules[index].words;

  currentIndex = 0;
  score = 0;
  failedWords = [];

  document.getElementById("score").textContent = score;

  startLearn();
}

function updateProgress(value) {
  document.getElementById("progress").style.width = value + "%";
}

function updateStageProgress(stage, index) {

  const total = words.length * 5;
  const completed = stage * words.length + index;

  updateProgress((completed / total) * 100);
}

function speak(word) {

  if ("speechSynthesis" in window) {

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(word);

    utterance.lang = "en-US";
    utterance.rate = 0.75;

    speechSynthesis.speak(utterance);
  }
}

function startLearn() {

  currentIndex = 0;
  showLearn();
}

function showLearn() {

  const item = words[currentIndex];

  updateStageProgress(0, currentIndex);

  content.innerHTML = `

    <div class="word-counter">
      Learn • ${currentIndex + 1} / ${words.length}
    </div>

    <div class="word">${item.word}</div>

    <div class="translation">
      ${item.spanish}
    </div>

    <div class="definition">
      ${item.definition}
    </div>

    <button class="audio-btn" onclick="speak('${item.word}')">
      🔊 Hear Word
    </button>

    <br>

    <button onclick="nextLearn()">
      Continue →
    </button>
  `;

  setTimeout(() => speak(item.word), 300);
}

function nextLearn() {

  currentIndex++;

  if (currentIndex >= words.length) {
    startListen();
  } else {
    showLearn();
  }
}

function startListen() {

  currentIndex = 0;
  showListen();
}

function showListen() {

  const item = words[currentIndex];

  updateStageProgress(1, currentIndex);

  let options = [...words]
    .filter(w => w.word !== item.word)
    .sort(() => Math.random() - .5)
    .slice(0, 3)
    .map(w => w.word);

  options.push(item.word);

  options.sort(() => Math.random() - .5);

  content.innerHTML = `

    <div class="word-counter">
      Listen & Choose • ${currentIndex + 1} / ${words.length}
    </div>

    <h2>👂 Which word did you hear?</h2>

    <button class="audio-btn" onclick="speak('${item.word}')">
      🔊 Hear Again
    </button>

    <div id="feedback" class="feedback"></div>

    ${options.map(option => `
      <button class="option"
        onclick="checkListen('${option.replace(/'/g, "\\'")}')">
        ${option}
      </button>
    `).join("")}
  `;

  setTimeout(() => speak(item.word), 400);
}

function checkListen(answer) {

  const item = words[currentIndex];
  const feedback = document.getElementById("feedback");

  if (answer === item.word) {

    score += 10;

    document.getElementById("score").textContent = score;

    feedback.innerHTML = `<span class="correct">✅ Correct!</span>`;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= words.length) {
        startSpelling();
      } else {
        showListen();
      }

    }, 700);

  } else {

    feedback.innerHTML =
      `<span class="incorrect">❌ Try again.</span>`;
  }
}

function startSpelling() {

  currentIndex = 0;
  showSpelling();
}

function showSpelling() {

  const item = words[currentIndex];

  updateStageProgress(2, currentIndex);

  let options = [...item.spellingOptions]
    .sort(() => Math.random() - .5);

  content.innerHTML = `

    <div class="word-counter">
      Spelling • ${currentIndex + 1} / ${words.length}
    </div>

    <h2>✏️ Choose the correct spelling</h2>

    <button class="audio-btn" onclick="speak('${item.word}')">
      🔊 Hear Word
    </button>

    <div id="feedback" class="feedback"></div>

    ${options.map(option => `
      <button class="option"
        onclick="checkSpelling('${option.replace(/'/g, "\\'")}')">
        ${option}
      </button>
    `).join("")}
  `;

  setTimeout(() => speak(item.word), 400);
}

function checkSpelling(answer) {

  const item = words[currentIndex];
  const feedback = document.getElementById("feedback");

  if (answer === item.word) {

    score += 10;

    document.getElementById("score").textContent = score;

    feedback.innerHTML =
      `<span class="correct">✅ Correct spelling!</span>`;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= words.length) {
        startSentence();
      } else {
        showSpelling();
      }

    }, 700);

  } else {

    feedback.innerHTML =
      `<span class="incorrect">❌ Try again.</span>`;
  }
}

function startSentence() {

  currentIndex = 0;
  showSentence();
}

function showSentence() {

  const item = words[currentIndex];

  updateStageProgress(3, currentIndex);

  let options = [...words]
    .filter(w => w.word !== item.word)
    .sort(() => Math.random() - .5)
    .slice(0, 3)
    .map(w => w.word);

  options.push(item.word);

  options.sort(() => Math.random() - .5);

  content.innerHTML = `

    <div class="word-counter">
      Sentence • ${currentIndex + 1} / ${words.length}
    </div>

    <h2>📝 Complete the sentence</h2>

    <div class="sentence">
      ${item.sentence}
    </div>

    <div id="feedback" class="feedback"></div>

    ${options.map(option => `
      <button class="option"
        onclick="checkSentence('${option.replace(/'/g, "\\'")}')">
        ${option}
      </button>
    `).join("")}
  `;
}

function checkSentence(answer) {

  const item = words[currentIndex];
  const feedback = document.getElementById("feedback");

  if (answer === item.word) {

    score += 10;

    document.getElementById("score").textContent = score;

    feedback.innerHTML =
      `<span class="correct">✅ Correct!</span>`;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= words.length) {
        startHangman();
      } else {
        showSentence();
      }

    }, 700);

  } else {

    feedback.innerHTML =
      `<span class="incorrect">❌ Try again.</span>`;
  }
}


/* =========================================================
   HANGMAN
========================================================= */

function startHangman() {

  currentIndex = 0;
  hangmanMode = "main";

  showHangman();
}

function showHangman() {

  const item = words[currentIndex];

  hangmanWord = item.word;
  guessedLetters = [];
  attempts = 6;
  hangmanPoints = 0;

  updateStageProgress(4, currentIndex);

  renderHangman();

  setTimeout(() => speak(item.word), 400);
}

function renderHangman() {

  const display = hangmanWord
    .split("")
    .map(letter =>
      guessedLetters.includes(letter.toLowerCase())
        ? letter
        : "_"
    )
    .join(" ");

  content.innerHTML = `

    <div class="word-counter">
      Hangman • ${currentIndex + 1} / ${words.length}
    </div>

    <h2>🎯 Hangman</h2>

    <div class="translation">
      🇪🇸 ${words[currentIndex].spanish}
    </div>

    <div class="definition">
      ${words[currentIndex].definition}
    </div>

    <div class="hangman-word">
      ${display}
    </div>

    <div class="attempts">
      ❤️ Attempts: ${attempts}
    </div>

    <div id="hangmanFeedback" class="feedback"></div>

    <div class="keyboard">

      ${qwertyRows.map(row => `
        <div class="keyboard-row">

          ${row.map(letter => `

            <button
              class="letter-btn ${guessedLetters.includes(letter) ? "used" : ""}"
              ${guessedLetters.includes(letter) ? "disabled" : ""}
              onclick="guessLetter('${letter}')">
              ${letter.toUpperCase()}
            </button>

          `).join("")}

        </div>
      `).join("")}

    </div>
  `;
}

function guessLetter(letter) {

  if (guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if (!hangmanWord.toLowerCase().includes(letter)) {

    attempts--;
  } else {

    hangmanPoints += 10;
  }

  renderHangman();

  checkHangmanEnd();
}

function checkHangmanEnd() {

  const complete = hangmanWord
    .toLowerCase()
    .split("")
    .every(letter => guessedLetters.includes(letter));

  if (complete) {

    score += 50 + hangmanPoints;

    document.getElementById("score").textContent = score;

    content.innerHTML += `
      <div class="feedback correct">
        🎉 Great job!
      </div>
    `;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= words.length) {

        if (failedWords.length > 0) {
          startFinalReview();
        } else {
          finishModule();
        }

      } else {

        showHangman();
      }

    }, 1000);

    return;
  }

  if (attempts <= 0) {

    const item = words[currentIndex];

    if (!failedWords.some(w => w.word === item.word)) {
      failedWords.push(item);
    }

    content.innerHTML += `
      <div class="feedback incorrect">
        ❌ The word was <strong>${item.word}</strong>
      </div>
    `;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= words.length) {

        if (failedWords.length > 0) {
          startFinalReview();
        } else {
          finishModule();
        }

      } else {

        showHangman();
      }

    }, 1400);
  }
}


/* =========================================================
   FINAL REVIEW
========================================================= */

function startFinalReview() {

  currentIndex = 0;

  startReviewSpelling();
}

function startReviewSpelling() {

  currentIndex = 0;
  showReviewSpelling();
}

function showReviewSpelling() {

  const item = failedWords[currentIndex];

  let options = [...item.spellingOptions]
    .sort(() => Math.random() - .5);

  content.innerHTML = `

    <div class="review-title">
      🔄 FINAL REVIEW
    </div>

    <div class="word-counter">
      Spelling Review • ${currentIndex + 1} / ${failedWords.length}
    </div>

    <h2>✏️ Choose the correct spelling</h2>

    <button class="audio-btn" onclick="speak('${item.word}')">
      🔊 Hear Word
    </button>

    <div id="feedback" class="feedback"></div>

    ${options.map(option => `
      <button class="option"
        onclick="checkReviewSpelling('${option.replace(/'/g, "\\'")}')">
        ${option}
      </button>
    `).join("")}
  `;

  setTimeout(() => speak(item.word), 400);
}

function checkReviewSpelling(answer) {

  const item = failedWords[currentIndex];
  const feedback = document.getElementById("feedback");

  if (answer === item.word) {

    feedback.innerHTML =
      `<span class="correct">✅ Correct!</span>`;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= failedWords.length) {
        startReviewSentence();
      } else {
        showReviewSpelling();
      }

    }, 700);

  } else {

    feedback.innerHTML =
      `<span class="incorrect">❌ Try again.</span>`;
  }
}

function startReviewSentence() {

  currentIndex = 0;
  showReviewSentence();
}

function showReviewSentence() {

  const item = failedWords[currentIndex];

  let options = [...failedWords]
    .filter(w => w.word !== item.word)
    .sort(() => Math.random() - .5)
    .slice(0, 3)
    .map(w => w.word);

  options.push(item.word);

  options.sort(() => Math.random() - .5);

  content.innerHTML = `

    <div class="review-title">
      🔄 FINAL REVIEW
    </div>

    <div class="word-counter">
      Sentence Review • ${currentIndex + 1} / ${failedWords.length}
    </div>

    <h2>📝 Complete the sentence</h2>

    <div class="sentence">
      ${item.sentence}
    </div>

    <div id="feedback" class="feedback"></div>

    ${options.map(option => `
      <button class="option"
        onclick="checkReviewSentence('${option.replace(/'/g, "\\'")}')">
        ${option}
      </button>
    `).join("")}
  `;
}

function checkReviewSentence(answer) {

  const item = failedWords[currentIndex];
  const feedback = document.getElementById("feedback");

  if (answer === item.word) {

    feedback.innerHTML =
      `<span class="correct">✅ Correct!</span>`;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= failedWords.length) {
        startReviewHangman();
      } else {
        showReviewSentence();
      }

    }, 700);

  } else {

    feedback.innerHTML =
      `<span class="incorrect">❌ Try again.</span>`;
  }
}


/* =========================================================
   REVIEW HANGMAN
========================================================= */

function startReviewHangman() {

  currentIndex = 0;
  hangmanMode = "review";

  showReviewHangman();
}

function showReviewHangman() {

  const item = failedWords[currentIndex];

  hangmanWord = item.word;
  guessedLetters = [];
  attempts = 6;
  hangmanPoints = 0;

  renderReviewHangman();

  setTimeout(() => speak(item.word), 400);
}

function renderReviewHangman() {

  const display = hangmanWord
    .split("")
    .map(letter =>
      guessedLetters.includes(letter.toLowerCase())
        ? letter
        : "_"
    )
    .join(" ");

  content.innerHTML = `

    <div class="review-title">
      🔄 FINAL REVIEW
    </div>

    <div class="word-counter">
      Hangman Review • ${currentIndex + 1} / ${failedWords.length}
    </div>

    <h2>🎯 Hangman</h2>

    <div class="translation">
      🇪🇸 ${failedWords[currentIndex].spanish}
    </div>

    <div class="definition">
      ${failedWords[currentIndex].definition}
    </div>

    <div class="hangman-word">
      ${display}
    </div>

    <div class="attempts">
      ❤️ Attempts: ${attempts}
    </div>

    <div id="hangmanFeedback" class="feedback"></div>

    <div class="keyboard">

      ${qwertyRows.map(row => `
        <div class="keyboard-row">

          ${row.map(letter => `

            <button
              class="letter-btn ${guessedLetters.includes(letter) ? "used" : ""}"
              ${guessedLetters.includes(letter) ? "disabled" : ""}
              onclick="guessReviewLetter('${letter}')">
              ${letter.toUpperCase()}
            </button>

          `).join("")}

        </div>
      `).join("")}

    </div>
  `;
}

function guessReviewLetter(letter) {

  if (guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if (!hangmanWord.toLowerCase().includes(letter)) {
    attempts--;
  } else {
    hangmanPoints += 10;
  }

  renderReviewHangman();

  checkReviewHangmanEnd();
}

function checkReviewHangmanEnd() {

  const complete = hangmanWord
    .toLowerCase()
    .split("")
    .every(letter => guessedLetters.includes(letter));

  if (complete) {

    score += hangmanPoints;

    document.getElementById("score").textContent = score;

    content.innerHTML += `
      <div class="feedback correct">
        🎉 Great job!
      </div>
    `;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= failedWords.length) {
        finishModule();
      } else {
        showReviewHangman();
      }

    }, 1000);

    return;
  }

  if (attempts <= 0) {

    content.innerHTML += `
      <div class="feedback incorrect">
        ❌ The word was <strong>${hangmanWord}</strong>
      </div>
    `;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex >= failedWords.length) {
        finishModule();
      } else {
        showReviewHangman();
      }

    }, 1400);
  }
}


/* =========================================================
   FINISH
========================================================= */

function finishModule() {

  updateProgress(100);

  const totalWords = words.length;

  content.innerHTML = `

    <h1>🏆 Module Complete!</h1>

    <div class="result">
      ⭐ ${score} points
    </div>

    <p>
      You completed <strong>${totalWords} words</strong>.
    </p>

    ${
      failedWords.length > 0
      ? `<p>
          🔄 You reviewed
          <strong>${failedWords.length}</strong>
          word${failedWords.length === 1 ? "" : "s"}.
         </p>`
      : `<p class="correct">
          🎉 Perfect! You did not miss any words!
         </p>`
    }

    <button onclick="showHome()">
      📚 Choose Another Module
    </button>
  `;
}

showHome();

</script>
