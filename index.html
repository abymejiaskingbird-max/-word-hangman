<head>

<style>

.definition{background:#f1f5f9;border-radius:12px;padding:15px;line-height:1.5;margin-bottom:20px}

.secondary{background:#64748b}
.success{background:#16a34a!important}
.danger{background:#dc2626!important}
.option{background:#eef2ff;color:#172033;border:2px solid transparent}
.option.correct{background:#dcfce7;border-color:#16a34a}
.option.wrong{background:#fee2e2;border-color:#dc2626}
.progress{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-bottom:15px}
.progress-bar{height:100%;background:#2563eb;width:0%;transition:width .3s}
.score{text-align:center;font-weight:bold;font-size:18px;margin-bottom:15px}
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.module-btn{background:#1d4ed8;min-height:75px}
.hidden{display:none}
.feedback{text-align:center;font-size:18px;font-weight:bold;margin:15px 0}
.listen-btn{background:#7c3aed}
.hangman-word{text-align:center;font-size:30px;letter-spacing:8px;font-weight:bold;margin:25px 0}
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.letter-btn{padding:11px 4px;margin:0;font-size:15px;background:#475569}
.letter-btn.used{opacity:.35}
.final-score{text-align:center;font-size:25px;font-weight:bold;margin:20px 0}
.stat{display:flex;justify-content:space-between;padding:12px;background:#f8fafc;border-radius:10px;margin:7px 0}
.small{color:#64748b;font-size:14px}
@media(max-width:500px){
.container{padding:12px}
.word{font-size:27px}
.letters{grid-template-columns:repeat(6,1fr)}
button{font-size:16px}
}
</style>
</head>

<body>

<div id="home">
<h1>📚 Spelling Master</h1>
<div class="subtitle">Choose a module to begin</div>
<div class="card">
<h2>Choose Your Module</h2>
<div class="module-grid" id="moduleButtons"></div>
</div>
</div>

<div id="game" class="hidden">
<div class="score">⭐ Score: <span id="score">0</span></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="card">
<div id="stageTitle"></div>
<div id="content"></div>
</div>
</div>

<div id="final" class="hidden">
<div class="card">
<h1>🏆 Module Complete!</h1>
<div class="final-score"><span id="finalScore">0</span> points</div>

<div class="stat"><span>Spelling Correct</span><strong id="spellingCorrect">0</strong></div>
<div class="stat"><span>Sentence Correct</span><strong id="sentenceCorrect">0</strong></div>
<div class="stat"><span>Hangman Points</span><strong id="hangmanPoints">0</strong></div>
<div class="stat"><span>Total Questions</span><strong id="totalQuestions">0</strong></div>
<div class="stat"><span>Accuracy</span><strong id="accuracy">0%</strong></div>

<button onclick="goHome()">🏠 Back to Modules</button>
</div>
</div>

</div>

/* MODULES: 8 + 10 + 10 + 10 + 10 + 10 + 10 + 10 + 10 = 88 */

const modules=[];
modules.push(words.slice(0,8));

for(let i=8;i<words.length;i+=10){
  modules.push(words.slice(i,i+10));
}


/* VARIABLES */

let currentModule=[];
let currentModuleNumber=0;
let stage="";
let currentIndex=0;
let score=0;
let spellingCorrect=0;
let sentenceCorrect=0;
let spellingAnswered=0;
let sentenceAnswered=0;
let hangmanScore=0;
let failedWords=[];
let reviewWords=[];
let reviewIndex=0;
let hangmanWord="";
let guessedLetters=[];
let attemptsLeft=6;
let hangmanCurrent=null;


/* HOME */

const moduleButtons=document.getElementById("moduleButtons");

modules.forEach((module,index)=>{
  const button=document.createElement("button");
  button.className="module-btn";
  button.innerHTML=`Module ${index+1}<br><span class="small">${module.length} words</span>`;
  button.onclick=()=>startModule(index);
  moduleButtons.appendChild(button);
});


/* START */

function startModule(index){

  currentModuleNumber=index;
  currentModule=modules[index];
  currentIndex=0;
  score=0;
  spellingCorrect=0;
  sentenceCorrect=0;
  spellingAnswered=0;
  sentenceAnswered=0;
  hangmanScore=0;
  failedWords=[];
  reviewWords=[];

  document.getElementById("home").classList.add("hidden");
  document.getElementById("final").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  updateScore();
  startLearn();
}


/* LEARN */

function startLearn(){
  stage="learn";
  currentIndex=0;
  showLearn();
}

function showLearn(){

  const w=currentModule[currentIndex];

  document.getElementById("stageTitle").innerHTML=
    `<h2>📖 Learn</h2>
     <div class="small">Word ${currentIndex+1} of ${currentModule.length}</div>`;

  document.getElementById("content").innerHTML=`

    <div class="word">${w.word}</div>

    <div class="translation">
      🇪🇸 ${w.translation}
    </div>

    <div class="definition">
      <strong>Definition:</strong><br>
      ${w.definition}
    </div>

    <button class="listen-btn" onclick="speakWord('${w.word}')">
      🔊 Listen
    </button>

    <button onclick="nextLearn()">
      Continue →
    </button>
  `;

  updateProgress(currentIndex,currentModule.length);

  /* AUTOMATIC PRONUNCIATION */
  speakWord(w.word);
}


function nextLearn(){

  currentIndex++;

  if(currentIndex<currentModule.length){
    showLearn();
  }else{
    startListen();
  }
}


/* SPEECH */

function speakWord(word){

  if(!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(word);

  utterance.lang="en-US";
  utterance.rate=0.7;
  utterance.pitch=1;

  window.speechSynthesis.speak(utterance);
}


/* LISTEN */

function startListen(){

  stage="listen";
  currentIndex=0;
  showListen();
}

function showListen(){

  const correct=currentModule[currentIndex];

  let choices=[correct];
  let pool=currentModule.filter(w=>w.word!==correct.word);

  pool=shuffle(pool);
  choices.push(...pool.slice(0,3));
  choices=shuffle(choices);

  document.getElementById("stageTitle").innerHTML=
    `<h2>🔊 Listen & Choose</h2>
     <div class="small">Word ${currentIndex+1} of ${currentModule.length}</div>`;

  document.getElementById("content").innerHTML=`

    <div class="translation">
      Listen carefully.
    </div>

    <button class="listen-btn" onclick="speakWord('${correct.word}')">
      🔊 Play Word
    </button>

    <div id="listenOptions"></div>
  `;

  const box=document.getElementById("listenOptions");

  choices.forEach(choice=>{

    const btn=document.createElement("button");

    btn.className="option";
    btn.textContent=choice.word;

    btn.onclick=()=>{

      const all=box.querySelectorAll("button");
      all.forEach(b=>b.disabled=true);

      if(choice.word===correct.word){

        btn.classList.add("correct");
        score+=10;

      }else{

        btn.classList.add("wrong");

        all.forEach(b=>{
          if(b.textContent===correct.word){
            b.classList.add("correct");
          }
        });

        if(!failedWords.includes(correct)){
          failedWords.push(correct);
        }
      }

      updateScore();

      setTimeout(()=>{

        currentIndex++;

        if(currentIndex<currentModule.length){
          showListen();
        }else{
          startSpelling();
        }

      },700);
    };

    box.appendChild(btn);
  });

  updateProgress(currentIndex,currentModule.length);
}

  currentIndex=0;
  showSpelling();
}

        btn.classList.add("correct");

        btn.classList.add("wrong");

    };

    box.appendChild(btn);

/* MISSPELLINGS */

function makeMisspellings(word){

  const results=[];

  if(word.length>5){

    const pos=Math.floor(word.length/2);

    results.push(
      word.slice(0,pos)+word.slice(pos+1)
    );
  }

  const duplicatePos=Math.min(2,word.length-1);

  results.push(
    word.slice(0,duplicatePos)+
    word[duplicatePos]+
    word.slice(duplicatePos)
  );

  if(word.length>4){

    const pos=Math.min(2,word.length-2);

    let arr=word.split("");
    let temp=arr[pos];

    arr[pos]=arr[pos+1];
    arr[pos+1]=temp;

    results.push(arr.join(""));
  }

  while(results.length<3){

    let arr=word.split("");
    let pos=Math.floor(Math.random()*arr.length);
    const letters="abcdefghijklmnopqrstuvwxyz";

    let newLetter=letters[
      Math.floor(Math.random()*letters.length)
    ];

    if(newLetter===arr[pos]){
      newLetter="x";
    }

    arr[pos]=newLetter;

    const candidate=arr.join("");

    if(candidate!==word&&!results.includes(candidate)){
      results.push(candidate);
    }
  }

  return [...new Set(results)].slice(0,3);
}


/* SENTENCE */

function startSentence(){

  stage="sentence";
  currentIndex=0;
  showSentence();
}

function showSentence(){

  const correct=currentModule[currentIndex];

  let choices=[correct];

  let pool=currentModule.filter(
    w=>w.word!==correct.word
  );

  pool=shuffle(pool);

  choices.push(...pool.slice(0,3));

  document.getElementById("stageTitle").innerHTML=
    `<h2>📝 Sentence Practice</h2>
     <div class="small">Word ${currentIndex+1} of ${currentModule.length}</div>`;

  document.getElementById("content").innerHTML=`

    <div class="definition">
      ${correct.sentence}
    </div>

    <h3 style="text-align:center">
      Which word completes the sentence?
    </h3>

    <div id="sentenceOptions"></div>
  `;

  const box=document.getElementById("sentenceOptions");

  choices.forEach(choice=>{

    const btn=document.createElement("button");

    btn.className="option";
    btn.textContent=choice.word;

    btn.onclick=()=>{

      const all=box.querySelectorAll("button");
      all.forEach(b=>b.disabled=true);

      sentenceAnswered++;

      if(choice.word===correct.word){

        btn.classList.add("correct");
        score+=20;
        sentenceCorrect++;

      }else{

        btn.classList.add("wrong");

        all.forEach(b=>{
          if(b.textContent===correct.word){
            b.classList.add("correct");
          }
        });

          failedWords.push(correct);

    };

    box.appendChild(btn);
  });

  updateProgress(currentIndex,currentModule.length);
}


/* HANGMAN */

function startHangman(){

  stage="hangman";
  currentIndex=0;
  showHangman();
}

function showHangman(){

  hangmanCurrent=currentModule[currentIndex];
  hangmanWord=hangmanCurrent.word.toLowerCase();
  guessedLetters=[];
  attemptsLeft=6;

  renderHangman();
}

function renderHangman(){

  const w=hangmanCurrent;

  let display="";

  for(const letter of hangmanWord){

    if(letter===" "){
      display+="  ";
    }
    else if(guessedLetters.includes(letter)){
      display+=letter.toUpperCase()+" ";
    }
    else{
      display+="_ ";
    }
  }

  document.getElementById("stageTitle").innerHTML=
    `<h2>🎮 Hangman</h2>
     <div class="small">Word ${currentIndex+1} of ${currentModule.length}</div>`;

  document.getElementById("content").innerHTML=`

    <div class="translation">
      🇪🇸 ${w.translation}
    </div>

    <div class="definition">
      <strong>Definition:</strong><br>
      ${w.definition}
    </div>

    <div style="text-align:center">
      ❤️ Attempts left: ${attemptsLeft}
    </div>

    <div class="hangman-word">
      ${display}
    </div>

    <div class="letters" id="letters"></div>
  `;

  const lettersBox=document.getElementById("letters");
  const alphabet="abcdefghijklmnopqrstuvwxyz";

  for(const letter of alphabet){

    const btn=document.createElement("button");

    btn.className="letter-btn";
    btn.textContent=letter.toUpperCase();

    if(guessedLetters.includes(letter)){
      btn.disabled=true;
      btn.classList.add("used");
    }

    btn.onclick=()=>guessLetter(letter);

    lettersBox.appendChild(btn);
  }

  updateProgress(currentIndex,currentModule.length);
}


function guessLetter(letter){

  if(guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if(hangmanWord.includes(letter)){

    score+=10;
    hangmanScore+=10;

  }else{

    attemptsLeft--;
  }

  updateScore();

  const complete=
    [...new Set(hangmanWord.replace(/ /g,""))]
    .every(letter=>guessedLetters.includes(letter));

  if(complete){

    score+=50;
    hangmanScore+=50;

    updateScore();

    document.getElementById("content").innerHTML=`

      <div class="feedback">
        🎉 Correct!
      </div>

      <div class="word">
        ${wSafe(hangmanWord)}
      </div>

      <div class="feedback success">
        +50 completion bonus!
      </div>

      <button onclick="nextHangman()">
        Continue →
      </button>
    `;

    return;
  }

  if(attemptsLeft<=0){

    if(!failedWords.includes(hangmanCurrent)){
      failedWords.push(hangmanCurrent);
    }

    document.getElementById("content").innerHTML=`

      <div class="feedback danger">
        Not quite!
      </div>

      <div class="word">
        ${hangmanCurrent.word}
      </div>

      <div class="definition">
        The correct spelling is:
        <strong>${hangmanCurrent.word}</strong>
      </div>

      <button onclick="nextHangman()">
        Continue →
      </button>
    `;

    return;
  }

  renderHangman();
}


function nextHangman(){

  currentIndex++;

  if(currentIndex<currentModule.length){
    showHangman();
  }else{
    startReview();
  }
}


/* REVIEW */

function startReview(){

  reviewWords=[
    ...new Map(
      failedWords.map(w=>[w.word,w])
    ).values()
  ];

  reviewIndex=0;

  if(reviewWords.length===0){
    showFinal();
  }else{
    showReviewIntro();
  }
}


function showReviewIntro(){

  document.getElementById("stageTitle").innerHTML=
    `<h2>🔥 Final Review</h2>`;

  document.getElementById("content").innerHTML=`

    <div class="feedback">
      You missed ${reviewWords.length}
      ${reviewWords.length===1?"word":"words"}.
    </div>

    <div class="definition">
      Let's practice the words that need more work.
    </div>

    <button onclick="reviewSpelling()">
      Start Review →
    </button>
  `;
}


/* REVIEW SPELLING */

function reviewSpelling(){

  if(reviewIndex>=reviewWords.length){

    reviewIndex=0;
    reviewSentence();
    return;
  }

  const correct=reviewWords[reviewIndex];

  let choices=makeMisspellings(correct.word);
  choices=shuffle([correct.word,...choices]);

  document.getElementById("stageTitle").innerHTML=
    `<h2>🔥 Review Spelling</h2>
     <div class="small">${reviewIndex+1} of ${reviewWords.length}</div>`;

  document.getElementById("content").innerHTML=`

    <div class="translation">
      🇪🇸 ${correct.translation}
    </div>

    <div class="definition">
      ${correct.definition}
    </div>

    <h3 style="text-align:center">
      Which spelling is correct?
    </h3>

    <div id="reviewOptions"></div>
  `;

  const box=document.getElementById("reviewOptions");

  choices.forEach(choice=>{

    const btn=document.createElement("button");

    btn.className="option";
    btn.textContent=choice;

    btn.onclick=()=>{

      const all=box.querySelectorAll("button");
      all.forEach(b=>b.disabled=true);

      if(choice===correct.word){

        btn.classList.add("correct");
        score+=20;

      }else{

        btn.classList.add("wrong");

        all.forEach(b=>{
          if(b.textContent===correct.word){
            b.classList.add("correct");
          }
        });
      }

      updateScore();

      setTimeout(()=>{

        reviewIndex++;
        reviewSpelling();

      },700);
    };

    box.appendChild(btn);
  });
}


/* REVIEW SENTENCE */

function reviewSentence(){

  if(reviewIndex>=reviewWords.length){

    reviewIndex=0;
    reviewHangman();
    return;
  }

  const correct=reviewWords[reviewIndex];

  let choices=[correct];

  let pool=currentModule.filter(
    w=>w.word!==correct.word
  );

  choices.push(...shuffle(pool).slice(0,3));
  choices=shuffle(choices);

  document.getElementById("stageTitle").innerHTML=
    `<h2>🔥 Review Sentence</h2>
     <div class="small">${reviewIndex+1} of ${reviewWords.length}</div>`;

  document.getElementById("content").innerHTML=`

    <div class="definition">
      ${correct.sentence}
    </div>

    <h3 style="text-align:center">
      Choose the correct word.
    </h3>

    <div id="reviewSentenceOptions"></div>
  `;

  const box=document.getElementById(
    "reviewSentenceOptions"
  );

  choices.forEach(choice=>{

    const btn=document.createElement("button");

    btn.className="option";
    btn.textContent=choice.word;

    btn.onclick=()=>{

      const all=box.querySelectorAll("button");
      all.forEach(b=>b.disabled=true);

      if(choice.word===correct.word){

        btn.classList.add("correct");
        score+=20;

      }else{

        btn.classList.add("wrong");

        all.forEach(b=>{
          if(b.textContent===correct.word){
            b.classList.add("correct");
          }
        });
      }

      updateScore();

      setTimeout(()=>{

        reviewIndex++;
        reviewSentence();

      },700);
    };

    box.appendChild(btn);
  });
}


/* REVIEW HANGMAN */

function reviewHangman(){

  if(reviewIndex>=reviewWords.length){
    showFinal();
    return;
  }

  hangmanCurrent=reviewWords[reviewIndex];
  hangmanWord=hangmanCurrent.word.toLowerCase();
  guessedLetters=[];
  attemptsLeft=6;

  renderReviewHangman();
}


function renderReviewHangman(){

  let display="";

  for(const letter of hangmanWord){

    if(guessedLetters.includes(letter)){
      display+=letter.toUpperCase()+" ";
    }else{
      display+="_ ";
    }
  }

  document.getElementById("stageTitle").innerHTML=
    `<h2>🔥 Review Hangman</h2>
     <div class="small">${reviewIndex+1} of ${reviewWords.length}</div>`;

  document.getElementById("content").innerHTML=`

    <div class="translation">
      🇪🇸 ${hangmanCurrent.translation}
    </div>

    <div class="definition">
      ${hangmanCurrent.definition}
    </div>

    <div style="text-align:center">
      ❤️ Attempts left: ${attemptsLeft}
    </div>

    <div class="hangman-word">
      ${display}
    </div>

    <div class="letters" id="reviewLetters"></div>
  `;

  const box=document.getElementById("reviewLetters");
  const alphabet="abcdefghijklmnopqrstuvwxyz";

  for(const letter of alphabet){

    const btn=document.createElement("button");

    btn.className="letter-btn";
    btn.textContent=letter.toUpperCase();

    if(guessedLetters.includes(letter)){
      btn.disabled=true;
      btn.classList.add("used");
    }

    btn.onclick=()=>reviewGuess(letter);

    box.appendChild(btn);
  }
}


function reviewGuess(letter){

  if(guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if(hangmanWord.includes(letter)){
    score+=10;
  }else{
    attemptsLeft--;
  }

  updateScore();

  const complete=
    [...new Set(hangmanWord)]
    .every(letter=>guessedLetters.includes(letter));

  if(complete){

    score+=50;

    updateScore();

    document.getElementById("content").innerHTML=`

      <div class="feedback">
        🎉 You got it!
      </div>

      <div class="word">
        ${hangmanCurrent.word}
      </div>

      <button onclick="nextReviewHangman()">
        Continue →
      </button>
    `;

    return;
  }

  if(attemptsLeft<=0){

    document.getElementById("content").innerHTML=`

      <div class="feedback danger">
        Keep practicing!
      </div>

      <div class="word">
        ${hangmanCurrent.word}
      </div>

      <button onclick="nextReviewHangman()">
        Continue →
      </button>
    `;

    return;
  }

  renderReviewHangman();
}


function nextReviewHangman(){

  reviewIndex++;
  reviewHangman();
}


/* FINAL */

function showFinal(){

  document.getElementById("game").classList.add("hidden");
  document.getElementById("final").classList.remove("hidden");

  document.getElementById("finalScore").textContent=score;

  document.getElementById("spellingCorrect").textContent=
    `${spellingCorrect} / ${currentModule.length}`;

  document.getElementById("sentenceCorrect").textContent=
    `${sentenceCorrect} / ${currentModule.length}`;

  document.getElementById("hangmanPoints").textContent=
    hangmanScore;

  const totalQuestions=
    spellingAnswered+sentenceAnswered;

  document.getElementById("totalQuestions").textContent=
    totalQuestions;

  let accuracy=0;

  if(totalQuestions>0){

    accuracy=Math.round(
      ((spellingCorrect+sentenceCorrect)/
      totalQuestions)*100
    );
  }

  document.getElementById("accuracy").textContent=
    accuracy+"%";

  let message="";

  if(accuracy>=90){
    message="🌟 Excellent! You really know these words!";
  }
  else if(accuracy>=80){
    message="👏 Great job! Keep practicing the tricky words.";
  }
  else if(accuracy>=70){
    message="💪 Good effort! A little more practice will help.";
  }
  else{
    message="📚 Keep practicing. You can master these words!";
  }

  document.getElementById("finalMessage").textContent=
    message;
}


/* HELPERS */

function shuffle(array){

  return array
    .map(value=>({value,sort:Math.random()}))
    .sort((a,b)=>a.sort-b.sort)
    .map(({value})=>value);
}


function updateScore(){
  document.getElementById("score").textContent=score;
}


function updateProgress(index,total){

  const percent=(index/total)*100;

  document.getElementById("progressBar").style.width=
    percent+"%";
}


function wSafe(word){

  return word.charAt(0).toUpperCase()+
         word.slice(1);
}


function goHome(){

  document.getElementById("final").classList.add("hidden");
  document.getElementById("game").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

</script>
