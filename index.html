<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Master</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

.container {
  max-width: 720px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

h2 {
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 25px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

.word {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
  white-space: nowrap;
}

.translation {
  text-align: center;
  font-size: 19px;
  color: #526071;
  margin-bottom: 15px;
}

.definition {
  background: #f1f5f9;
  border-radius: 12px;
  padding: 15px;
  line-height: 1.5;
  margin-bottom: 20px;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  margin: 7px 0;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button:hover {
  opacity: .92;
}

button:disabled {
  cursor: default;
}

.secondary {
  background: #64748b;
}

.success {
  background: #16a34a !important;
}

.danger {
  background: #dc2626 !important;
}

.option {
  background: #eef2ff;
  color: #172033;
  border: 2px solid transparent;
}

.option.correct {
  background: #dcfce7;
  border-color: #16a34a;
}

.option.wrong {
  background: #fee2e2;
  border-color: #dc2626;
}

.progress {
  height: 12px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-bar {
  height: 100%;
  background: #2563eb;
  width: 0%;
  transition: width .3s;
}

.score {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.module-btn {
  background: #1d4ed8;
  min-height: 75px;
}

.hidden {
  display: none;
}

.feedback {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 15px 0;
}

.listen-btn {
  background: #7c3aed;
}

/* =========================
   HANGMAN
========================= */

.hangman-word {
  width: 100%;
  text-align: center;
  font-size: clamp(20px, 7vw, 42px);
  letter-spacing: clamp(2px, 1.5vw, 8px);
  font-weight: bold;
  margin: 25px 0;
  white-space: nowrap;
  overflow: hidden;
  line-height: 1.2;
}

.letters {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
  max-width: 600px;
  margin: auto;
}

.letter-btn {
  padding: 12px 4px;
  margin: 0;
  font-size: 16px;
  background: #475569;
  transition: .2s;
}

/* Letra ya utilizada */
.letter-btn.used {
  background: #cbd5e1 !important;
  color: #94a3b8 !important;
  opacity: .55;
  cursor: not-allowed;
  transform: none;
}

.hangman-score {
  text-align: center;
  background: #eff6ff;
  border-radius: 14px;
  padding: 14px;
  margin: 15px 0;
  font-size: 20px;
  font-weight: bold;
}

.hangman-score strong {
  display: block;
  font-size: 28px;
  margin-top: 4px;
}

.final-score {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  margin: 20px 0;
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  background: #f8fafc;
  border-radius: 10px;
  margin: 7px 0;
}

.small {
  color: #64748b;
  font-size: 14px;
}

@media (max-width: 500px) {

  .container {
    padding: 12px;
  }

  .word {
    font-size: 27px;
  }

  .hangman-word {
    font-size: clamp(18px, 6.5vw, 34px);
    letter-spacing: 2px;
  }

  .letters {
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
  }

  .letter-btn {
    padding: 11px 2px;
    font-size: 13px;
    border-radius: 9px;
  }

  button {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HOME -->
  <div id="home">

    <h1>📚 Spelling Master</h1>

    <div class="subtitle">
      Choose a module to begin
    </div>

    <div class="card">

      <h2>Choose Your Module</h2>

      <div class="module-grid">

        <button class="module-btn" onclick="startModule()">
          📘 Module 1
          <br>
          <span class="small" style="color:white;">
            8 Words
          </span>
        </button>

      </div>

    </div>

  </div>


  <!-- GAME -->
  <div id="game" class="hidden">

    <div class="score">
      ⭐ Score: <span id="score">0</span>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="card">

      <div id="stageTitle"></div>

      <div id="content"></div>

    </div>

  </div>


  <!-- FINAL -->
  <div id="final" class="hidden">

    <div class="card">

      <h1>🏆 Module Complete!</h1>

      <div class="final-score">
        <span id="finalScore">0</span> points
      </div>

      <div class="stat">
        <span>Spelling Correct</span>
        <strong id="spellingCorrect">0</strong>
      </div>

      <div class="stat">
        <span>Sentence Correct</span>
        <strong id="sentenceCorrect">0</strong>
      </div>

      <div class="stat">
        <span>Hangman Points</span>
        <strong id="hangmanPoints">0</strong>
      </div>

      <div class="stat">
        <span>Total Questions</span>
        <strong id="totalQuestions">0</strong>
      </div>

      <div class="stat">
        <span>Accuracy</span>
        <strong id="accuracy">0%</strong>
      </div>

      <div id="finalMessage" class="feedback"></div>

      <button onclick="goHome()">
        🏠 Back to Modules
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   MODULE 1 — FIRST 8 WORDS
========================= */

const words = [

  {
    word:"abbreviation",
    translation:"abreviatura",
    definition:"A shortened form of a word or phrase.",
    sentence:"Dr. is an abbreviation."
  },

  {
    word:"abroad",
    translation:"en el extranjero",
    definition:"In or to a foreign country.",
    sentence:"We went abroad."
  },

  {
    word:"access",
    translation:"acceso",
    definition:"The ability or opportunity to enter, use, or reach something.",
    sentence:"I have access."
  },

  {
    word:"accord",
    translation:"acuerdo",
    definition:"An agreement between people or groups.",
    sentence:"They reached an accord."
  },

  {
    word:"adequate",
    translation:"adecuado / suficiente",
    definition:"Good enough or sufficient for a purpose.",
    sentence:"We have adequate time."
  },

  {
    word:"advancements",
    translation:"avances",
    definition:"Improvements or developments that make something better.",
    sentence:"Advancements help people."
  },

  {
    word:"aeronautics",
    translation:"aeronáutica",
    definition:"The science and technology of aircraft and flight.",
    sentence:"He studies aeronautics."
  },

  {
    word:"affectionate",
    translation:"cariñoso",
    definition:"Showing love, care, or fondness.",
    sentence:"The dog is affectionate."
  }

];


let currentModule = words;
let currentIndex = 0;
let score = 0;
let spellingCorrect = 0;
let sentenceCorrect = 0;
let spellingAnswered = 0;
let sentenceAnswered = 0;
let hangmanPoints = 0;
let failedWords = [];
let hangmanWord = "";
let guessedLetters = [];
let attemptsLeft = 6;
let currentHangman = null;


/* =========================
   HOME
========================= */

function startModule(){

  currentIndex = 0;
  score = 0;
  spellingCorrect = 0;
  sentenceCorrect = 0;
  spellingAnswered = 0;
  sentenceAnswered = 0;
  hangmanPoints = 0;
  failedWords = [];

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("final")
    .classList.add("hidden");

  document.getElementById("game")
    .classList.remove("hidden");

  updateScore();

  showLearn();
}


function goHome(){

  document.getElementById("game")
    .classList.add("hidden");

  document.getElementById("final")
    .classList.add("hidden");

  document.getElementById("home")
    .classList.remove("hidden");
}


/* =========================
   SPEECH
========================= */

function speakWord(word){

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(word);

    utterance.lang = "en-US";
    utterance.rate = 0.75;

    window.speechSynthesis.speak(utterance);
  }
}


/* =========================
   LEARN
========================= */

function showLearn(){

  const w = currentModule[currentIndex];

  document.getElementById("stageTitle").innerHTML =

    `<h2>📖 Learn</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="word">
      ${w.word}
    </div>

    <div class="translation">
      🇪🇸 ${w.translation}
    </div>

    <div class="definition">
      <strong>Definition:</strong><br>
      ${w.definition}
    </div>

    <button class="listen-btn"
      onclick="speakWord('${w.word}')">
      🔊 Listen
    </button>

    <button onclick="nextLearn()">
      Continue →
    </button>

  `;

  updateProgress(
    currentIndex,
    currentModule.length
  );

  speakWord(w.word);
}


function nextLearn(){

  currentIndex++;

  if(currentIndex < currentModule.length){

    showLearn();

  }else{

    startListen();

  }
}


/* =========================
   LISTEN
========================= */

function startListen(){

  currentIndex = 0;

  showListen();
}


function showListen(){

  const correct =
    currentModule[currentIndex];

  let choices = [correct];

  let pool =
    currentModule.filter(
      w => w.word !== correct.word
    );

  pool = shuffle(pool);

  choices.push(...pool.slice(0,3));

  choices = shuffle(choices);

  document.getElementById("stageTitle").innerHTML =

    `<h2>🔊 Listen & Choose</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="translation">
      👂 Listen to the word.
    </div>

    <button class="listen-btn"
      onclick="speakWord('${correct.word}')">
      🔊 Repeat Word
    </button>

    <div id="listenOptions"></div>

  `;

  const box =
    document.getElementById("listenOptions");

  choices.forEach(choice => {

    const btn =
      document.createElement("button");

    btn.className = "option";
    btn.textContent = choice.word;

    btn.onclick = () => {

      const all =
        box.querySelectorAll("button");

      all.forEach(
        b => b.disabled = true
      );

      if(choice.word === correct.word){

        btn.classList.add("correct");
        score += 10;

      }else{

        btn.classList.add("wrong");

        all.forEach(b => {

          if(b.textContent === correct.word){

            b.classList.add("correct");

          }

        });

        addFailed(correct);
      }

      updateScore();

      setTimeout(() => {

        currentIndex++;

        if(currentIndex < currentModule.length){

          showListen();

        }else{

          startSpelling();

        }

      },700);

    };

    box.appendChild(btn);

  });

  updateProgress(
    currentIndex,
    currentModule.length
  );

  speakWord(correct.word);
}


/* =========================
   SPELLING
========================= */

function startSpelling(){

  currentIndex = 0;

  showSpelling();
}


function showSpelling(){

  const correct =
    currentModule[currentIndex];

  let choices =
    makeMisspellings(correct.word);

  choices =
    shuffle([
      correct.word,
      ...choices
    ]);

  document.getElementById("stageTitle").innerHTML =

    `<h2>✏️ Spelling Practice</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="translation">
      🇪🇸 ${correct.translation}
    </div>

    <div class="definition">
      <strong>Definition:</strong><br>
      ${correct.definition}
    </div>

    <button class="listen-btn"
      onclick="speakWord('${correct.word}')">
      🔊 Listen to Word
    </button>

    <h3 style="text-align:center">
      Which spelling is correct?
    </h3>

    <div id="spellingOptions"></div>

  `;

  const box =
    document.getElementById("spellingOptions");

  choices.forEach(choice => {

    const btn =
      document.createElement("button");

    btn.className = "option";
    btn.textContent = choice;

    btn.onclick = () => {

      const all =
        box.querySelectorAll("button");

      all.forEach(
        b => b.disabled = true
      );

      spellingAnswered++;

      if(choice === correct.word){

        btn.classList.add("correct");
        score += 20;
        spellingCorrect++;

      }else{

        btn.classList.add("wrong");

        all.forEach(b => {

          if(b.textContent === correct.word){

            b.classList.add("correct");

          }

        });

        addFailed(correct);
      }

      updateScore();

      setTimeout(() => {

        currentIndex++;

        if(currentIndex < currentModule.length){

          showSpelling();

        }else{

          startSentence();

        }

      },700);

    };

    box.appendChild(btn);

  });

  updateProgress(
    currentIndex,
    currentModule.length
  );

  /* Automatic pronunciation */
  speakWord(correct.word);
}


/* =========================
   SENTENCE
========================= */

function startSentence(){

  currentIndex = 0;

  showSentence();
}


function showSentence(){

  const correct =
    currentModule[currentIndex];

  let choices = [correct];

  let pool =
    currentModule.filter(
      w => w.word !== correct.word
    );

  pool = shuffle(pool);

  choices.push(...pool.slice(0,3));

  choices = shuffle(choices);

  document.getElementById("stageTitle").innerHTML =

    `<h2>📝 Sentence Practice</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="definition">
      ${correct.sentence}
    </div>

    <h3 style="text-align:center">
      Which word completes the sentence?
    </h3>

    <div id="sentenceOptions"></div>

  `;

  const box =
    document.getElementById("sentenceOptions");

  choices.forEach(choice => {

    const btn =
      document.createElement("button");

    btn.className = "option";
    btn.textContent = choice.word;

    btn.onclick = () => {

      const all =
        box.querySelectorAll("button");

      all.forEach(
        b => b.disabled = true
      );

      sentenceAnswered++;

      if(choice.word === correct.word){

        btn.classList.add("correct");
        score += 20;
        sentenceCorrect++;

      }else{

        btn.classList.add("wrong");

        all.forEach(b => {

          if(b.textContent === correct.word){

            b.classList.add("correct");

          }

        });

        addFailed(correct);
      }

      updateScore();

      setTimeout(() => {

        currentIndex++;

        if(currentIndex < currentModule.length){

          showSentence();

        }else{

          startHangman();

        }

      },700);

    };

    box.appendChild(btn);

  });

  updateProgress(
    currentIndex,
    currentModule.length
  );

  speakWord(correct.word);
}


/* =========================
   HANGMAN
========================= */

function startHangman(){

  currentIndex = 0;

  showHangman();
}


function showHangman(){

  currentHangman =
    currentModule[currentIndex];

  hangmanWord =
    currentHangman.word.toLowerCase();

  guessedLetters = [];

  attemptsLeft = 6;

  renderHangman();
}


/*
  QWERTY keyboard
*/
const qwertyRows = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["z","x","c","v","b","n","m"]
];


function renderHangman(){

  let display = "";

  for(const letter of hangmanWord){

    if(guessedLetters.includes(letter)){

      display += letter.toUpperCase() + " ";

    }else{

      display += "_ ";

    }
  }

  document.getElementById("stageTitle").innerHTML =

    `<h2>🎮 Hangman</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="translation">
      🇪🇸 ${currentHangman.translation}
    </div>

    <div class="definition">
      <strong>Definition:</strong><br>
      ${currentHangman.definition}
    </div>

    <div style="text-align:center">
      ❤️ Attempts left: ${attemptsLeft}
    </div>

    <div class="hangman-word">
      ${display}
    </div>

    <div class="letters" id="letters"></div>
  `;

  const box =
    document.getElementById("letters");

  qwertyRows.forEach(row => {

    const rowDiv =
      document.createElement("div");

    rowDiv.style.display = "contents";

    row.forEach(letter => {

      const btn =
        document.createElement("button");

      btn.className = "letter-btn";
      btn.textContent = letter.toUpperCase();

      if(guessedLetters.includes(letter)){

        btn.classList.add("used");
        btn.disabled = true;

      }else{

        btn.onclick = () =>
          guessLetter(letter);

      }

      box.appendChild(btn);

    });

  });

  updateProgress(
    currentIndex,
    currentModule.length
  );
}


function guessLetter(letter){

  if(guessedLetters.includes(letter)){

    return;
  }

  guessedLetters.push(letter);

  if(hangmanWord.includes(letter)){

    score += 10;
    hangmanPoints += 10;

  }else{

    attemptsLeft--;

  }

  updateScore();

  const complete =
    [...new Set(hangmanWord)]
      .every(
        letter =>
          guessedLetters.includes(letter)
      );

  if(complete){

    score += 50;
    hangmanPoints += 50;

    updateScore();

    showHangmanResult(true);

    return;
  }

  if(attemptsLeft <= 0){

    addFailed(currentHangman);

    showHangmanResult(false);

    return;
  }

  renderHangman();
}


/*
  Resultado dentro de la misma ventana.
  No hay botón Continue.
*/
function showHangmanResult(won){

  const points =
    won ? 50 : 0;

  document.getElementById("content").innerHTML = `

    <div class="feedback ${won ? "success" : "danger"}">

      ${won ? "🎉 Correct!" : "😔 Keep practicing!"}

    </div>

    <div class="hangman-word">
      ${currentHangman.word}
    </div>

    <div class="hangman-score">

      ${won ? "⭐ Hangman Points" : "📚 Correct Spelling"}

      <strong>
        ${won ? "+" + points + " + letter points" : currentHangman.word}
      </strong>

    </div>

    <div class="feedback">
      Total Score: ${score}
    </div>
  `;

  /*
    Pasa automáticamente a la próxima palabra.
  */
  setTimeout(() => {

    nextHangman();

  },1200);
}


function nextHangman(){

  currentIndex++;

  if(currentIndex < currentModule.length){

    showHangman();

  }else{

    startReview();

  }
}


/* =========================
   REVIEW
========================= */

function startReview(){

  const reviewWords =
    [...new Map(
      failedWords.map(
        w => [w.word,w]
      )
    ).values()];

  if(reviewWords.length === 0){

    showFinal();

    return;
  }

  window.reviewWords =
    reviewWords;

  window.reviewIndex = 0;

  document.getElementById("stageTitle").innerHTML =
    `<h2>🔥 Final Review</h2>`;

  document.getElementById("content").innerHTML = `

    <div class="feedback">
      You missed
      ${reviewWords.length}
      ${reviewWords.length === 1 ? "word" : "words"}.
    </div>

    <div class="definition">
      Let's practice the words that need more work.
    </div>

    <button onclick="startReviewSpelling()">
      Start Review →
    </button>
  `;
}


function startReviewSpelling(){

  reviewIndex = 0;

  reviewSpelling();
}


function reviewSpelling(){

  if(reviewIndex >= reviewWords.length){

    reviewIndex = 0;

    reviewSentence();

    return;
  }

  const correct =
    reviewWords[reviewIndex];

  let choices =
    makeMisspellings(correct.word);

  choices =
    shuffle([
      correct.word,
      ...choices
    ]);

  document.getElementById("stageTitle").innerHTML =

    `<h2>🔥 Review Spelling</h2>
     <div class="small">
     ${reviewIndex + 1} of ${reviewWords.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="translation">
      🇪🇸 ${correct.translation}
    </div>

    <div class="definition">
      ${correct.definition}
    </div>

    <button class="listen-btn"
      onclick="speakWord('${correct.word}')">
      🔊 Listen
    </button>

    <h3 style="text-align:center">
      Which spelling is correct?
    </h3>

    <div id="reviewOptions"></div>
  `;

  const box =
    document.getElementById("reviewOptions");

  choices.forEach(choice => {

    const btn =
      document.createElement("button");

    btn.className = "option";
    btn.textContent = choice;

    btn.onclick = () => {

      const all =
        box.querySelectorAll("button");

      all.forEach(
        b => b.disabled = true
      );

      if(choice === correct.word){

        btn.classList.add("correct");
        score += 20;

      }else{

        btn.classList.add("wrong");

        all.forEach(b => {

          if(b.textContent === correct.word){

            b.classList.add("correct");

          }

        });
      }

      updateScore();

      setTimeout(() => {

        reviewIndex++;

        reviewSpelling();

      },700);
    };

    box.appendChild(btn);

  });

  speakWord(correct.word);
}


function reviewSentence(){

  if(reviewIndex >= reviewWords.length){

    reviewIndex = 0;

    reviewHangman();

    return;
  }

  const correct =
    reviewWords[reviewIndex];

  let choices = [correct];

  let pool =
    currentModule.filter(
      w => w.word !== correct.word
    );

  choices.push(
    ...shuffle(pool).slice(0,3)
  );

  choices =
    shuffle(choices);

  document.getElementById("stageTitle").innerHTML =

    `<h2>🔥 Review Sentence</h2>
     <div class="small">
     ${reviewIndex + 1} of ${reviewWords.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="definition">
      ${correct.sentence}
    </div>

    <h3 style="text-align:center">
      Choose the correct word.
    </h3>

    <div id="reviewSentenceOptions"></div>
  `;

  const box =
    document.getElementById(
      "reviewSentenceOptions"
    );

  choices.forEach(choice => {

    const btn =
      document.createElement("button");

    btn.className = "option";
    btn.textContent = choice.word;

    btn.onclick = () => {

      const all =
        box.querySelectorAll("button");

      all.forEach(
        b => b.disabled = true
      );

      if(choice.word === correct.word){

        btn.classList.add("correct");
        score += 20;

      }else{

        btn.classList.add("wrong");

        all.forEach(b => {

          if(b.textContent === correct.word){

            b.classList.add("correct");

          }

        });
      }

      updateScore();

      setTimeout(() => {

        reviewIndex++;

        reviewSentence();

      },700);

    };

    box.appendChild(btn);

  });

  speakWord(correct.word);
}


/* =========================
   REVIEW HANGMAN
========================= */

function reviewHangman(){

  if(reviewIndex >= reviewWords.length){

    showFinal();

    return;
  }

  currentHangman =
    reviewWords[reviewIndex];

  hangmanWord =
    currentHangman.word.toLowerCase();

  guessedLetters = [];

  attemptsLeft = 6;

  renderReviewHangman();
}


function renderReviewHangman(){

  let display = "";

  for(const letter of hangmanWord){

    if(guessedLetters.includes(letter)){

      display += letter.toUpperCase() + " ";

    }else{

      display += "_ ";

    }
  }

  document.getElementById("stageTitle").innerHTML =

    `<h2>🔥 Review Hangman</h2>
     <div class="small">
     ${reviewIndex + 1} of ${reviewWords.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="translation">
      🇪🇸 ${currentHangman.translation}
    </div>

    <div class="definition">
      ${currentHangman.definition}
    </div>

    <div style="text-align:center">
      ❤️ Attempts left: ${attemptsLeft}
    </div>

    <div class="hangman-word">
      ${display}
    </div>

    <div class="letters"
      id="reviewLetters">
    </div>
  `;

  const box =
    document.getElementById("reviewLetters");

  qwertyRows.forEach(row => {

    row.forEach(letter => {

      const btn =
        document.createElement("button");

      btn.className = "letter-btn";
      btn.textContent = letter.toUpperCase();

      if(guessedLetters.includes(letter)){

        btn.classList.add("used");
        btn.disabled = true;

      }else{

        btn.onclick = () =>
          reviewGuess(letter);

      }

      box.appendChild(btn);

    });

  });
}


function reviewGuess(letter){

  if(guessedLetters.includes(letter)){

    return;
  }

  guessedLetters.push(letter);

  if(hangmanWord.includes(letter)){

    score += 10;

  }else{

    attemptsLeft--;

  }

  updateScore();

  const complete =
    [...new Set(hangmanWord)]
      .every(
        letter =>
          guessedLetters.includes(letter)
      );

  if(complete){

    score += 50;

    updateScore();

    showReviewHangmanResult(true);

    return;
  }

  if(attemptsLeft <= 0){

    showReviewHangmanResult(false);

    return;
  }

  renderReviewHangman();
}


function showReviewHangmanResult(won){

  document.getElementById("content").innerHTML = `

    <div class="feedback ${won ? "success" : "danger"}">

      ${won ? "🎉 You got it!" : "📚 Keep practicing!"}

    </div>

    <div class="hangman-word">
      ${currentHangman.word}
    </div>

    <div class="hangman-score">

      ${won ? "⭐ Great job!" : "Correct spelling"}

      <strong>
        ${won ? "+50 points" : currentHangman.word}
      </strong>

    </div>

    <div class="feedback">
      Total Score: ${score}
    </div>
  `;

  setTimeout(() => {

    nextReviewHangman();

  },1200);
}


function nextReviewHangman(){

  reviewIndex++;

  reviewHangman();
}


/* =========================
   FINAL
========================= */

function showFinal(){

  document.getElementById("game")
    .classList.add("hidden");

  document.getElementById("final")
    .classList.remove("hidden");

  document.getElementById("finalScore")
    .textContent = score;

  document.getElementById("spellingCorrect")
    .textContent =
    `${spellingCorrect} / ${currentModule.length}`;

  document.getElementById("sentenceCorrect")
    .textContent =
    `${sentenceCorrect} / ${currentModule.length}`;

  document.getElementById("hangmanPoints")
    .textContent =
    hangmanPoints;

  const totalQuestions =
    spellingAnswered +
    sentenceAnswered;

  document.getElementById("totalQuestions")
    .textContent =
    totalQuestions;

  let accuracy = 0;

  if(totalQuestions > 0){

    accuracy =
      Math.round(
        (
          (spellingCorrect +
           sentenceCorrect)
          /
          totalQuestions
        ) * 100
      );
  }

  document.getElementById("accuracy")
    .textContent =
    accuracy + "%";

  if(accuracy >= 90){

    document.getElementById("finalMessage")
      .textContent =
      "🌟 Excellent! You really know these words!";

  }else if(accuracy >= 80){

    document.getElementById("finalMessage")
      .textContent =
      "👏 Great job! Keep practicing the tricky words.";

  }else if(accuracy >= 70){

    document.getElementById("finalMessage")
      .textContent =
      "💪 Good effort! A little more practice will help.";

  }else{

    document.getElementById("finalMessage")
      .textContent =
      "📚 Keep practicing. You can master these words!";
  }
}


/* =========================
   HELPERS
========================= */

function addFailed(word){

  if(!failedWords.includes(word)){

    failedWords.push(word);
  }
}


function makeMisspellings(word){

  let results = [];

  if(word.length > 5){

    let pos =
      Math.floor(word.length / 2);

    results.push(
      word.slice(0,pos) +
      word.slice(pos + 1)
    );
  }

  let duplicatePos =
    Math.min(2,word.length - 1);

  results.push(

    word.slice(0,duplicatePos) +
    word[duplicatePos] +
    word.slice(duplicatePos)

  );

  if(word.length > 4){

    let pos =
      Math.min(2,word.length - 2);

    let arr =
      word.split("");

    let temp =
      arr[pos];

    arr[pos] =
      arr[pos + 1];

    arr[pos + 1] =
      temp;

    results.push(
      arr.join("")
    );
  }

  while(results.length < 3){

    let arr =
      word.split("");

    let pos =
      Math.floor(
        Math.random() *
        arr.length
      );

    let letters =
      "abcdefghijklmnopqrstuvwxyz";

    let newLetter =
      letters[
        Math.floor(
          Math.random() *
          letters.length
        )
      ];

    arr[pos] =
      newLetter;

    let candidate =
      arr.join("");

    if(
      candidate !== word &&
      !results.includes(candidate)
    ){

      results.push(candidate);
    }
  }

  return [
    ...new Set(results)
  ].slice(0,3);
}


function shuffle(array){

  return array
    .map(value => ({
      value:value,
      sort:Math.random()
    }))
    .sort(
      (a,b) => a.sort - b.sort
    )
    .map(
      ({value}) => value
    );
}


function updateScore(){

  document.getElementById("score")
    .textContent = score;
}


function updateProgress(index,total){

  const percent =
    ((index + 1) / total) * 100;

  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";
}
