<title>Spelling Practice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #1f2937;
    min-height: 100vh;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 28px 22px;
    margin-top: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

h2 {
    font-size: 25px;
    margin-bottom: 18px;
}

h3 {
    margin-bottom: 8px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 15px;
    margin: 7px 0;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.group-button {
    background: #3b82f6;
}

.secondary {
    background: #64748b;
}

.success {
    background: #16a34a;
}

.danger {
    background: #dc2626;
}

.word {
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 20px 0;
    color: #1d4ed8;
}

.translation {
    font-size: 21px;
    font-weight: bold;
    margin: 12px 0;
}

.definition {
    font-size: 18px;
    line-height: 1.5;
    background: #f1f5f9;
    padding: 15px;
    border-radius: 15px;
    margin: 15px 0;
}

.progress {
    font-weight: bold;
    color: #64748b;
    margin-bottom: 15px;
}

.score {
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.choice {
    background: #f8fafc;
    color: #111827;
    border: 2px solid #cbd5e1;
}

.choice.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #166534;
}

.choice.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #991b1b;
}

.feedback {
    font-size: 19px;
    font-weight: bold;
    min-height: 30px;
    margin: 12px 0;
}

.hangman-word {
    font-size: 32px;
    letter-spacing: 8px;
    margin: 25px 0;
    font-weight: bold;
}

.keyboard {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 20px;
}

.key {
    padding: 12px 3px;
    margin: 0;
    font-size: 15px;
    border-radius: 10px;
    background: #e2e8f0;
    color: #111827;
}

.key:disabled {
    opacity: 0.4;
}

.hidden {
    display: none;
}

.final-score {
    font-size: 42px;
    font-weight: bold;
    color: #2563eb;
    margin: 20px;
}

.stat {
    background: #f1f5f9;
    padding: 15px;
    border-radius: 15px;
    margin: 10px 0;
    font-size: 18px;
}

.small {
    font-size: 14px;
    color: #64748b;
}

@media (max-width: 450px) {
    .container {
        padding: 12px;
    }

    .card {
        padding: 22px 15px;
    }

    h1 {
        font-size: 28px;
    }

    .word {

    .keyboard {

    .key {

    </div>

        <button class="secondary" onclick="goHome()">

</div>

/* =========================================================
   SCREEN CONTROL
========================================================= */

function showScreen(screenId) {

    document.getElementById("home").classList.add("hidden");
    document.getElementById("learn").classList.add("hidden");
    document.getElementById("practice").classList.add("hidden");
    document.getElementById("hangman").classList.add("hidden");
    document.getElementById("final").classList.add("hidden");

    document.getElementById(screenId).classList.remove("hidden");
}


/* =========================================================
   CREATE GROUP BUTTONS
========================================================= */

function createGroupButtons() {

    const container = document.getElementById("groupButtons");

    container.innerHTML = "";

    groups.forEach((group, index) => {

        const button = document.createElement("button");

        button.className = "group-button";

        button.textContent =
            "📘 " + group.name + " (" + group.words.length + " words)";

        button.onclick = function() {
            startGroup(index);
        };

        container.appendChild(button);
    });
}


/* =========================================================
   START GROUP
========================================================= */

function startGroup(groupIndex) {

    selectedGroup = groupIndex;

    words = groups[groupIndex].words;

    currentIndex = 0;

    practiceScore = 0;
    hangmanScore = 0;
    practiceCorrect = 0;

    document.getElementById("practiceScore").textContent = 0;
    document.getElementById("hangmanScore").textContent = 0;

    showScreen("learn");

    showLearnWord();
}


/* =========================================================
   LEARN
========================================================= */

function showLearnWord() {

    const word = words[currentIndex];

    document.getElementById("learnProgress").textContent =
        `${currentIndex + 1} of ${words.length}`;

    document.getElementById("learnWord").textContent =
        word.word;

    document.getElementById("learnTranslation").textContent =
        "🇪🇸 " + word.translation;

    document.getElementById("learnDefinition").textContent =
        "🇺🇸 " + word.definition;
}


function speakWord() {

    const word = words[currentIndex].word;

    const speech = new SpeechSynthesisUtterance(word);

    speech.lang = "en-US";
    speech.rate = 0.82;

    speechSynthesis.cancel();
    speechSynthesis.speak(speech);
}


function nextLearn() {

    currentIndex++;

    if (currentIndex >= words.length) {

        currentIndex = 0;

        startPractice();

        return;
    }

    showLearnWord();
}


/* =========================================================
   PRACTICE
========================================================= */

function startPractice() {

    currentIndex = 0;

    showScreen("practice");

    showPracticeQuestion();
}


function showPracticeQuestion() {

    const word = words[currentIndex];

    document.getElementById("practiceProgress").textContent =
        `${currentIndex + 1} of ${words.length}`;

    document.getElementById("practiceScore").textContent =
        practiceScore;

    document.getElementById("practiceTranslation").textContent =
        "🇪🇸 " + word.translation;

    document.getElementById("practiceDefinition").textContent =
        "🇺🇸 " + word.definition;

    document.getElementById("practiceFeedback").textContent = "";

    createChoices(word);
}


function createChoices(correctWord) {

    const choicesContainer = document.getElementById("choices");

    choicesContainer.innerHTML = "";

    let choices = [correctWord.word];

    // Add 3 other words from the same group
    let otherWords = words
        .filter(w => w.word !== correctWord.word)
        .map(w => w.word);

    otherWords.sort(() => Math.random() - 0.5);

    choices.push(...otherWords.slice(0, 3));

    // Shuffle choices
    choices.sort(() => Math.random() - 0.5);

    choices.forEach(choice => {

        const button = document.createElement("button");

        button.className = "choice";

        button.textContent = choice;

        button.onclick = function() {
            checkPracticeAnswer(choice, correctWord.word, button);
        };

        choicesContainer.appendChild(button);
    });
}


function checkPracticeAnswer(selected, correct, button) {

    const buttons = document.querySelectorAll("#choices button");

    buttons.forEach(btn => {
        btn.disabled = true;
    });

    const feedback = document.getElementById("practiceFeedback");

    if (selected === correct) {

        button.classList.add("correct");

        practiceScore += 20;

        practiceCorrect++;

        feedback.textContent = "✅ Correct! +20 points";
        feedback.style.color = "#16a34a";

    } else {

        button.classList.add("wrong");

        buttons.forEach(btn => {

            if (btn.textContent === correct) {
                btn.classList.add("correct");
            }

        });

        feedback.textContent =
            "❌ Not quite. Correct spelling: " + correct;

        feedback.style.color = "#dc2626";
    }

    document.getElementById("practiceScore").textContent =
        practiceScore;

    setTimeout(() => {

        currentIndex++;

        if (currentIndex >= words.length) {

            startHangman();

        } else {

            showPracticeQuestion();

        }

    }, 1300);
}


/* =========================================================
   HANGMAN
========================================================= */

function startHangman() {

    currentIndex = 0;

    hangmanScore = 0;

    document.getElementById("hangmanScore").textContent = 0;

    showScreen("hangman");

    setupHangman();
}


function setupHangman() {

    const word = words[currentIndex];

    currentHangmanWord = word.word;

    guessedLetters = [];

    attempts = 6;

    document.getElementById("hangmanProgress").textContent =
        `${currentIndex + 1} of ${words.length}`;

    document.getElementById("hangmanTranslation").textContent =
        "🇪🇸 " + word.translation;

    document.getElementById("hangmanDefinition").textContent =
        "🇺🇸 " + word.definition;

    document.getElementById("attemptsLeft").textContent =
        attempts;

    document.getElementById("hangmanFeedback").textContent = "";

    updateHangmanWord();

    createKeyboard();
}


function updateHangmanWord() {

    let display = "";

    for (let letter of currentHangmanWord) {

        if (guessedLetters.includes(letter)) {

            display += letter + " ";

        } else {

            display += "_ ";
        }
    }

    document.getElementById("hangmanWord").textContent =
        display.trim();
}


function createKeyboard() {

    const keyboard = document.getElementById("keyboard");

    keyboard.innerHTML = "";

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    for (let letter of alphabet) {

        const button = document.createElement("button");

        button.className = "key";

        button.textContent = letter;

        button.onclick = function() {
            guessLetter(letter, button);
        };

        keyboard.appendChild(button);
    }
}


function guessLetter(letter, button) {

    button.disabled = true;

    if (currentHangmanWord.includes(letter)) {

        guessedLetters.push(letter);

        let occurrences = 0;

        for (let char of currentHangmanWord) {

            if (char === letter) {
                occurrences++;
            }
        }

        hangmanScore += occurrences * 10;

        document.getElementById("hangmanScore").textContent =
            hangmanScore;

        document.getElementById("hangmanFeedback").textContent =
            "✅ Good! +" + (occurrences * 10) + " points";

        document.getElementById("hangmanFeedback").style.color =
            "#16a34a";

        updateHangmanWord();

        checkHangmanComplete();

    } else {

        attempts--;

        document.getElementById("attemptsLeft").textContent =
            attempts;

        document.getElementById("hangmanFeedback").textContent =
            "❌ Try again!";

        document.getElementById("hangmanFeedback").style.color =
            "#dc2626";

        if (attempts <= 0) {

            endHangmanWord();
        }
    }
}


function checkHangmanComplete() {

    let complete = true;

    for (let letter of currentHangmanWord) {

        if (!guessedLetters.includes(letter)) {

            complete = false;
            break;
        }
    }

    if (complete) {

        hangmanScore += 50;

        document.getElementById("hangmanScore").textContent =
            hangmanScore;

        document.getElementById("hangmanFeedback").textContent =
            "🎉 Word completed! +50 bonus!";

        document.getElementById("hangmanFeedback").style.color =
            "#16a34a";

        disableKeyboard();

        setTimeout(nextHangmanWord, 1400);
    }
}


function endHangmanWord() {

    disableKeyboard();

    document.getElementById("hangmanWord").textContent =
        currentHangmanWord;

    document.getElementById("hangmanFeedback").textContent =
        "The word was: " + currentHangmanWord;

    setTimeout(nextHangmanWord, 1800);
}


function disableKeyboard() {

    const buttons =
        document.querySelectorAll("#keyboard button");

    buttons.forEach(button => {
        button.disabled = true;
    });
}


function nextHangmanWord() {

    currentIndex++;

    if (currentIndex >= words.length) {

        showFinal();

    } else {

        setupHangman();
    }
}


/* =========================================================
   FINAL SCORE
========================================================= */

function showFinal() {

    showScreen("final");

    const total =
        practiceScore + hangmanScore;

    const accuracy =
        Math.round((practiceCorrect / words.length) * 100);

    document.getElementById("finalGroup").textContent =
        groups[selectedGroup].name;

    document.getElementById("totalScore").textContent =
        total;

    document.getElementById("finalPracticeScore").textContent =
        practiceScore;

    document.getElementById("finalHangmanScore").textContent =
        hangmanScore;

    document.getElementById("correctCount").textContent =
        practiceCorrect;

    document.getElementById("accuracy").textContent =
        accuracy + "%";
}


/* =========================================================
   RESTART / HOME
========================================================= */

function restartGroup() {

    startGroup(selectedGroup);
}


function goHome() {

    showScreen("home");
}


/* =========================================================
   START
========================================================= */

createGroupButtons();

showScreen("home");

</script>
