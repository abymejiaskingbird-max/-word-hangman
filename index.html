<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3157d5">
<title>Spelling Master</title>
<style>
:root{--blue:#3157d5;--bg:#f3f6fc;--ink:#172033;--muted:#68738a;--green:#17834b;--red:#c33b45;--line:#e4e9f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,#3157d5,#6a52d8);color:white;padding:17px 14px;text-align:center}
header h1{font-size:clamp(23px,5vw,30px);margin:0}
header p{margin:6px 0 0;font-size:14px}
.container{width:min(900px,100%);margin:auto;padding:15px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #1720330d;margin-bottom:14px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.center{text-align:center}
.title{font-size:clamp(22px,5vw,28px);margin:5px 0 8px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:15px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--blue);color:#fff}
.secondary{background:#e8edfa;color:#26345f}
.modulegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.module{border:2px solid var(--line);border-radius:15px;padding:16px;text-align:left;background:#fff;color:var(--ink);width:100%}
.module strong{display:block;font-size:17px;margin-bottom:5px}
.module span{color:var(--muted);font-size:13px;font-weight:400}
.steps{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px}
.step{border-radius:30px;background:#e8ecf5;color:#68738a;padding:8px 11px;font-size:12px;font-weight:700}
.step.active{background:var(--blue);color:#fff}
.progress{height:9px;background:#e8edf6;border-radius:20px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:linear-gradient(90deg,#3157d5,#8a5de8);width:0;transition:width .2s}
.word{font-size:clamp(30px,8vw,43px);font-weight:800;letter-spacing:1px;overflow-wrap:anywhere;margin:17px 0}
.translation{font-size:22px;font-weight:700;color:#3157d5}
.definition{background:#f4f6fc;border-radius:13px;padding:13px;margin:12px 0;line-height:1.45}
.sentence{line-height:1.55;font-size:17px;background:#f8f9fd;padding:12px;border-radius:12px}
.feedback{min-height:25px;text-align:center;font-weight:700;margin:12px 0}
.good{color:var(--green)}.bad{color:var(--red)}
input[type=text]{width:100%;padding:14px;border:2px solid #d9e0ef;border-radius:12px;font-size:20px;text-align:center;outline:none}
input:focus{border-color:var(--blue)}
.keyboard{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:16px auto;max-width:520px}
.key{padding:11px 0;min-width:0;background:#e9edf7;color:#1e2c51}
.key.used{opacity:.35}
.hangword{font-size:28px;letter-spacing:5px;font-weight:800;margin:20px 0;overflow-wrap:anywhere}
.attempts{font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f1f4fc;padding:12px;border-radius:12px;text-align:center}
.stat b{display:block;font-size:23px;color:var(--blue)}
.small{font-size:13px}
.footer{font-size:12px;color:var(--muted);text-align:center;padding:8px}
.notice{background:#fff5d9;border-radius:12px;padding:12px;line-height:1.45}
@media(max-width:480px){
.container{padding:10px}.card{padding:16px}.modulegrid{gap:8px}
.module{padding:12px}.keyboard{gap:4px}.key{padding:10px 0;font-size:13px}
.btnrow button{flex:1}.word{margin:12px 0}
}
</style>
</head>
<body>
<header>
  <h1>📚 Spelling Master</h1>
  <p>Aprende, practica y domina tus palabras</p>
</header>
<main class="container">
  <section id="home" class="card">
    <h2 class="title center">¡Vamos a aprender!</h2>
    <p class="muted center">Escoge un módulo de 22 palabras. Cada módulo tiene tres sesiones.</p>
    <div class="statgrid">
      <div class="stat"><b>88</b><span class="small">palabras</span></div>
      <div class="stat"><b>4</b><span class="small">módulos</span></div>
      <div class="stat"><b>3</b><span class="small">sesiones</span></div>
    </div>
    <div id="modules" class="modulegrid" style="margin-top:16px"></div>
    <div class="btnrow"><button class="secondary" onclick="resetProgress()">Reiniciar progreso</button></div>
  </section>

  <section id="game" class="card hidden">
    <div class="btnrow" style="margin-top:0;justify-content:space-between">
      <button class="secondary" onclick="goHome()">← Módulos</button>
      <span id="moduleLabel" class="muted"></span>
    </div>
    <div class="steps">
      <span id="stepLearn" class="step">1 · Aprender</span>
      <span id="stepHang" class="step">2 · Hangman</span>
      <span id="stepWrite" class="step">3 · Escribir</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="gameContent"></div>
  </section>
  <div class="footer">El progreso se guarda en este dispositivo.</div>
</main>
<script>
const VOCAB =

tayed home _____ I was sick."},"belated":{"translation":"Tardío","definition":"Arriving or happening late.","meaning":"Que llega tarde","sentence":"The card was _____; it arrived late."},"beloved":{"translation":"Querido","definition":"Loved very much.","meaning":"Muy querido","sentence":"Our _____ dog is loved by everyone."},"benevolent":{"translation":"Bondadoso","definition":"Kind and willing to help.","meaning":"Amable y dispuesto a ayudar","sentence":"The _____ woman kindly helps others."},"bibliography":{"translation":"Bibliografía","definition":"A list of books or sources used in a project.","meaning":"Lista de libros usados para un trabajo","sentence":"The _____ lists the books I used."},"bilingual":{"translation":"Bilingüe","definition":"Able to speak two languages.","meaning":"Que habla dos idiomas","sentence":"She is _____; she speaks two languages."},"bizarre":{"translation":"Extraño","definition":"Very strange or unusual.","meaning":"Muy extraño","sentence":"A purple cow is a _____ sight."},"blockade":{"translation":"Bloqueo","definition":"An action that stops people or goods from entering or leaving.","meaning":"Acción de impedir la entrada o salida de un lugar","sentence":"The ships formed a _____ to stop other ships."},"boarder":{"translation":"Huésped con alojamiento y comida","definition":"A person who pays for a room and meals in a home.","meaning":"Persona que paga por vivir y comer en una casa ajena","sentence":"The _____ pays to live and eat in our home."},"boisterous":{"translation":"Bullicioso","definition":"Noisy and full of energy.","meaning":"Muy ruidoso y lleno de energía","sentence":"The _____ children laugh and shout loudly."},"border":{"translation":"Frontera","definition":"The line that separates two places or countries.","meaning":"Límite entre dos países o lugares","sentence":"The _____ separates the two countries."},"bracelet":{"translation":"Pulsera","definition":"Jewelry worn around the wrist.","meaning":"Joya que se usa en la muñeca","sentence":"She wears a _____ on her wrist."},"breathe":{"translation":"Respirar","definition":"To take air into and out of your lungs.","meaning":"Respirar","sentence":"We _____ air in and out."},"bridge":{"translation":"Puente","definition":"A structure that lets you cross a river or road.","meaning":"Estructura para cruzar un río o camino","sentence":"The _____ lets us cross the river."},"brilliant":{"translation":"Brillante","definition":"Very smart or excellent.","meaning":"Muy inteligente o excelente","sentence":"Her _____ idea solved the problem."},"bruise":{"translation":"Moretón","definition":"A mark on the skin caused by a bump or hit.","meaning":"Marca en la piel causada por un golpe","sentence":"The bump left a purple _____ on my arm."},"bulletin":{"translation":"Boletín","definition":"A short notice with news or information.","meaning":"Aviso con noticias o información","sentence":"The _____ has our school news."},"bungalow":{"translation":"Casa de una planta","definition":"A small house with one floor.","meaning":"Casa pequeña de una sola planta","sentence":"They live in a _____ with one floor."},"calligraphy":{"translation":"Caligrafía","definition":"The art of making beautiful letters by hand.","meaning":"Arte de escribir letras bonitas","sentence":"She uses _____ to make fancy letters."},"callous":{"translation":"Insensible","definition":"Not caring about another person's pain.","meaning":"Que no se preocupa por el dolor de otros","sentence":"His _____ words showed he did not care about her pain."},"camouflage":{"translation":"Camuflaje","definition":"Colors or patterns that help something blend in and hide.","meaning":"Colores o formas que ayudan a esconderse en el entorno","sentence":"The green _____ helps him hide in the trees."},"candid":{"translation":"Sincero","definition":"Honest and direct.","meaning":"Honesto y directo","sentence":"Her _____ answer was honest and direct."},"carnivorous":{"translation":"Carnívoro","definition":"Eating meat.","meaning":"Que come carne","sentence":"A lion is _____; it eats meat."},"casserole":{"translation":"Guiso al horno","definition":"A meal baked in a deep dish.","meaning":"Comida que se hornea en un recipiente hondo","sentence":"Mom baked a chicken _____ in a deep dish."},"catastrophe":{"translation":"Catástrofe","definition":"A very serious disaster.","meaning":"Desastre muy grave","sentence":"The flood was a _____; it ruined many homes."},"cauldron":{"translation":"Caldero","definition":"A large metal pot.","meaning":"Olla grande de metal","sentence":"The witch stirred a large iron _____."},"celestial":{"translation":"Celestial","definition":"Related to the sky or outer space.","meaning":"Relacionado con el cielo o el espacio","sentence":"Stars are _____ objects in the sky."},"characterize":{"translation":"Caracterizar","definition":"To describe the qualities that make someone or something distinct.","meaning":"Describir los rasgos que distinguen a alguien","sentence":"Kindness and honesty _____ her personality."},"chimpanzee":{"translation":"Chimpancé","definition":"An intelligent ape that can use tools.","meaning":"Tipo de simio inteligente","sentence":"The _____ is an ape that uses tools."},"choreography":{"translation":"Coreografía","definition":"The planned steps in a dance.","meaning":"Pasos planeados para un baile","sentence":"The _____ tells dancers which steps to do."},"circumstance":{"translation":"Circunstancia","definition":"A fact or condition that affects a situation.","meaning":"Hecho o condición que afecta una situación","sentence":"A flat tire was the _____ that made us late."},"clandestine":{"translation":"Clandestino","definition":"Done in secret.","meaning":"Secreto u oculto","sentence":"They held a _____ meeting in secret."},"clemency":{"translation":"Clemencia","definition":"Mercy shown by reducing a punishment.","meaning":"Misericordia al reducir un castigo","sentence":"The judge showed _____ by reducing the punishment."},"clientele":{"translation":"Clientela","definition":"The regular customers of a business.","meaning":"Clientes habituales de un negocio","sentence":"The shop’s _____ are its regular customers."},"cohesive":{"translation":"Unido","definition":"United and working well together.","meaning":"Unido y que trabaja bien como grupo","sentence":"Our _____ team works well together."},"coincidence":{"translation":"Coincidencia","definition":"Things happening together by chance.","meaning":"Algo que ocurre por casualidad","sentence":"Having the same birthday was a _____."},"colleague":{"translation":"Compañero de trabajo","definition":"A person you work with.","meaning":"Persona que trabaja contigo","sentence":"My _____ works with me."},"colloquial":{"translation":"Coloquial","definition":"Used in casual, everyday conversation.","meaning":"Usado en una conversación informal","sentence":"“Wanna” is _____; we use it in casual talk."},"compensation":{"translation":"Compensación","definition":"Payment for work or a loss.","meaning":"Pago por un trabajo","sentence":"She got _____, or payment, for her work."},"compulsory":{"translation":"Obligatorio","definition":"Required; something you must do.","meaning":"Obligatorio","sentence":"School is _____; children must attend."},"condolence":{"translation":"Condolencia","definition":"An expression of sympathy after someone dies.","meaning":"Expresión de apoyo cuando alguien muere","sentence":"I sent a message of _____ after his mother died."},"configuration":{"translation":"Configuración","definition":"The way parts are arranged.","meaning":"Forma de organizar las partes de algo","sentence":"The desk _____ has all desks in a circle."},"constellation":{"translation":"Constelación","definition":"A group of stars that forms a pattern.","meaning":"Grupo de estrellas que forma una figura","sentence":"A _____ is a group of stars in a pattern."},"courageous":{"translation":"Valiente","definition":"Brave, even when afraid.","meaning":"Valiente","sentence":"The _____ child was brave."},"creation":{"translation":"Creación","definition":"Something that someone has made.","meaning":"Algo que alguien ha hecho o creado","sentence":"This painting is my _____; I made it."},"credentials":{"translation":"Credenciales","definition":"Documents that show a person's skills or qualifications.","meaning":"Documentos que muestran preparación o capacidad","sentence":"Her _____ show that she can teach."},"criticism":{"translation":"Crítica","definition":"Comments about what is good or what needs improvement.","meaning":"Comentario sobre lo que está bien o se puede mejorar","sentence":"Helpful _____ tells me how to improve."},"cuisine":{"translation":"Cocina de un lugar","definition":"The style of food from a place.","meaning":"Comida típica de un lugar","sentence":"Italian _____ includes pasta and pizza."},"culminate":{"translation":"Culminar","definition":"To end with an important event.","meaning":"Terminar con un evento importante","sentence":"The show will _____ with the final song."},"customary":{"translation":"Habitual","definition":"Usual or done as a tradition.","meaning":"Habitual o según la costumbre","sentence":"It is _____ for us to sing on birthdays."},"dandelion":{"translation":"Diente de león","definition":"A plant with yellow flowers and seeds that blow away.","meaning":"Planta de flor amarilla y semillas que vuelan","sentence":"The _____ is a yellow flower with seeds that blow away."},"dangerous":{"translation":"Peligroso","definition":"Able to cause harm.","meaning":"Que puede causar daño","sentence":"Fire is _____; it can hurt you."},"debatable":{"translation":"Discutible","definition":"Open to different opinions.","meaning":"Sobre lo que hay distintas opiniones","sentence":"The best game is _____; we do not all agree."},"December":{"translation":"Diciembre","definition":"The last month of the year.","meaning":"Diciembre","sentence":"_____ is the last month of the year."},"effective":{"translation":"Eficaz","definition":"Working well and giving the wanted result.","meaning":"Que funciona y da el resultado esperado","sentence":"The _____ medicine stopped my cough."},"eligible":{"translation":"Elegible","definition":"Meeting the requirements to take part.","meaning":"Que cumple los requisitos para participar","sentence":"You are _____ to play if you meet the age rule."}};
const WORDS = Object.keys(VOCAB);
const MODULES = Array.from({length:4}, (_,i) => WORDS.slice(i*22,(i+1)*22));
const STORE = 'spellingMasterProgress_v3';

let saved = loadSaved();
let moduleIndex = 0, mode = 'learn', list = [], index = 0;
let wrongLetters = new Set(), hangErrors = 0, usedLetters = new Set();
let answered = false, writeAttempts = 0;

function loadSaved(){
  try {
    return JSON.parse(localStorage.getItem(STORE)) || {modules:{},misses:{}};
  } catch(e) {
    return {modules:{},misses:{}};
  }
}
function persist(){
  localStorage.setItem(STORE,JSON.stringify(saved));
}
function moduleState(i){
  return saved.modules[i] || (saved.modules[i]={learned:false,hangman:false,write:false});
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function renderHome(){
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('game').classList.add('hidden');
  let html='';
  MODULES.forEach((arr,i)=>{
    let st=moduleState(i);
    html+=`<button class="module" onclick="openModule(${i})">
      <strong>📘 Módulo ${i+1}</strong>
      <span>Palabras ${i*22+1}–${i*22+22}</span>
      <div style="margin-top:10px;font-size:12px">
        ${st.learned?'✅ Aprender':'○ Aprender'} ·
        ${st.hangman?'✅ Hangman':'○ Hangman'} ·
        ${st.write?'✅ Escribir':'○ Escribir'}
      </div>
    </button>`;
  });
  document.getElementById('modules').innerHTML=html;
}
function goHome(){
  renderHome();
}
function resetProgress(){
  if(confirm('¿Seguro que quieres borrar todo el progreso y empezar desde cero?')){
    saved={modules:{},misses:{}};
    persist();
    renderHome();
  }
}
function openModule(i){
  moduleIndex=i;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('moduleLabel').textContent='Módulo '+(i+1)+' · 22 palabras';
  let st=moduleState(i);
  if(!st.learned) startMode('learn');
  else if(!st.hangman) startMode('hangman');
  else startMode('write');
}
function setSteps(){
  document.getElementById('stepLearn').classList.toggle('active',mode==='learn');
  document.getElementById('stepHang').classList.toggle('active',mode==='hangman');
  document.getElementById('stepWrite').classList.toggle('active',mode==='write');
  document.getElementById('bar').style.width=
    ((index+1)/Math.max(1,list.length)*100)+'%';
}
function startMode(m){
  mode=m;
  index=0;
  list=mode==='write' ? getReviewWords() : MODULES[moduleIndex].slice();

  if(mode==='write' && !list.length){
    document.getElementById('gameContent').innerHTML=`
      <div class="center">
        <h2>¡Buen trabajo!</h2>
        <p>No hay palabras pendientes con dos o más letras incorrectas.</p>
        <p>Puedes volver a jugar Hangman para seguir practicando.</p>
        <div class="btnrow">
          <button class="primary" onclick="startMode('hangman')">Jugar Hangman</button>
          <button class="secondary" onclick="goHome()">Volver a módulos</button>
        </div>
      </div>`;
    setSteps();
    return;
  }
  setSteps();
  renderCurrent();
}
function getReviewWords(){
  return MODULES[moduleIndex].filter(w=>
    (saved.misses[w]?.letters?.length || 0)>=2
  );
}
function current(){
  return list[index];
}
function renderCurrent(){
  if(index>=list.length){
    finishMode();
    return;
  }
  answered=false;
  wrongLetters=new Set();
  hangErrors=0;
  usedLetters=new Set();
  writeAttempts=0;
  setSteps();

  if(mode==='learn') renderLearn();
  else if(mode==='hangman') renderHangman();
  else renderWrite();
}

/* SESIÓN 1: APRENDER */
function renderLearn(){
  let w=current(), d=VOCAB[w];
  document.getElementById('gameContent').innerHTML=`
    <div class="center">
      <p class="muted">APRENDE LA PALABRA · ${index+1} DE ${list.length}</p>
      <div class="word">${escapeHtml(w)}</div>
      <div class="translation">${escapeHtml(d.translation)}</div>
      <div class="definition">
        <b>English definition:</b><br>${escapeHtml(d.definition)}
        <hr style="border:0;border-top:1px solid #e1e6f0">
        <b>En español:</b><br>${escapeHtml(d.meaning)}
      </div>
      <p class="sentence"><b>Example:</b><br>${escapeHtml(d.sentence)}</p>
      <div class="btnrow">
        <button class="secondary" onclick="speakCurrent()">🔊 Escuchar pronunciación</button>
        <button class="primary" onclick="learnNext()">
          ${index===list.length-1?'Terminé de aprender':'Ya la aprendí →'}
        </button>
      </div>
      <p class="muted small">
        Tómate tu tiempo. Mira la palabra, escúchala y léela antes de continuar.
      </p>
    </div>`;
}
function speakCurrent(){
  let w=current();
  if(!w) return;
  if(!('speechSynthesis' in window)){
    alert('Este navegador no tiene audio de pronunciación disponible.');
    return;
  }
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(w);
  u.lang='en-US';
  u.rate=.72;
  speechSynthesis.speak(u);
}
function learnNext(){
  if(index<list.length-1){
    index++;
    renderCurrent();
  } else {
    finishMode();
  }
}

/* SESIÓN 2: HANGMAN */
function renderHangman(){
  let w=current(), d=VOCAB[w];
  document.getElementById('gameContent').innerHTML=`
    <div class="center">
      <p class="muted">HANGMAN · ${index+1} DE ${list.length}</p>
      <div class="translation">${escapeHtml(d.translation)}</div>
      <div class="definition">
        <b>English definition:</b> ${escapeHtml(d.definition)}<br>
        <b>En español:</b> ${escapeHtml(d.meaning)}
      </div>
      <button class="secondary" onclick="speakCurrent()">🔊 Escuchar palabra</button>
      <div class="hangword" id="hangWord">
        ${w.split('').map(c=>c===' '?' ':'_').join(' ')}
      </div>
      <p class="attempts">Errores: <span id="errCount">0</span> de 6</p>
      <div id="hangFeedback" class="feedback" aria-live="polite"></div>
      <div class="keyboard" id="keyboard">
        ${'abcdefghijklmnopqrstuvwxyz'.split('').map(c=>
          `<button class="key" id="key-${c}" onclick="guessLetter('${c}')">${c}</button>`
        ).join('')}
      </div>
      <div class="btnrow">
        <button class="primary hidden" id="hangContinue" onclick="nextWord()">
          Siguiente palabra →
        </button>
      </div>
    </div>`;
}
function guessLetter(c){
  if(answered || usedLetters.has(c)) return;

  usedLetters.add(c);
  let key=document.getElementById('key-'+c);
  if(key) key.classList.add('used');

  let w=current();
  let feedback=document.getElementById('hangFeedback');

  if(w.toLowerCase().includes(c)){
    feedback.textContent='¡Bien! Esa letra está en la palabra.';
    feedback.className='feedback good';
  } else {
    wrongLetters.add(c);
    hangErrors++;
    document.getElementById('errCount').textContent=hangErrors;
    feedback.textContent='Esa letra no está. ¡Sigue intentando!';
    feedback.className='feedback bad';
  }

  let shown=w.split('').map(ch=>
    ch===' '?' ':usedLetters.has(ch.toLowerCase())?ch:'_'
  ).join(' ');

  document.getElementById('hangWord').textContent=shown;

  if(!shown.includes('_')){
    answered=true;
    feedback.textContent='¡Correcto! Adivinaste la palabra.';
    feedback.className='feedback good';
    saveMisses(w,wrongLetters);
    document.getElementById('hangContinue').classList.remove('hidden');
  } else if(hangErrors>=6){
    answered=true;
    saveMisses(w,wrongLetters);
    document.getElementById('hangWord').textContent=w;
    feedback.textContent='La palabra era “'+w+'”. Practícala en la sesión de escritura.';
    feedback.className='feedback bad';
    document.getElementById('hangContinue').classList.remove('hidden');
  }
}

/* Guarda las letras diferentes que Ángel falló */
function saveMisses(w,set){
  let rec=saved.misses[w] || {letters:[],hangmanMisses:0,writeMisses:0};
  rec.letters=[...new Set([...(rec.letters||[]),...set])];
  if(set.size) rec.hangmanMisses=(rec.hangmanMisses||0)+1;
  saved.misses[w]=rec;
  persist();
}

/* SESIÓN 3: ESCRIBIR LA PALABRA COMPLETA */
function renderWrite(){
  let w=current(), d=VOCAB[w];
  document.getElementById('gameContent').innerHTML=`
    <div class="center">
      <p class="muted">ESCRIBE LA PALABRA COMPLETA · ${index+1} DE ${list.length}</p>
      <div class="translation">${escapeHtml(d.translation)}</div>
      <div class="definition">
        <b>English definition:</b><br>${escapeHtml(d.definition)}<br>
        <b>En español:</b><br>${escapeHtml(d.meaning)}
      </div>
      <p class="sentence">
        <b>Completa la palabra que corresponde a esta oración:</b><br>
        ${escapeHtml(d.sentence)}
      </p>
      <button class="secondary" onclick="speakCurrent()">🔊 Escuchar pronunciación</button>
      <form onsubmit="checkWrite(event)" style="margin-top:15px">
        <input id="writeAnswer" type="text" autocomplete="off" autocapitalize="none"
          spellcheck="false" placeholder="Escribe la palabra en inglés"
          aria-label="Escribe la palabra completa" required>
        <div class="btnrow">
          <button class="primary" type="submit">Comprobar</button>
        </div>
      </form>
      <div id="writeFeedback" class="feedback" aria-live="polite"></div>
      <div id="writeRetry" class="hidden">
        <p class="notice">
          Lee la palabra y vuelve a escribirla para practicar.
          Escucha la pronunciación si lo necesitas.
        </p>
        <div class="word">${escapeHtml(w)}</div>
        <div class="btnrow">
          <button class="secondary" onclick="speakCurrent()">🔊 Escuchar</button>
          <button class="primary" onclick="practiceCorrect()">Practicar la palabra</button>
        </div>
      </div>
      <button id="writeContinue" class="primary hidden" onclick="nextWord()">
        Siguiente palabra →
      </button>
    </div>`;
  document.getElementById('writeAnswer').focus();
}
function checkWrite(e){
  e.preventDefault();
  if(answered) return;

  let w=current();
  let v=document.getElementById('writeAnswer').value.trim();
  let feedback=document.getElementById('writeFeedback');

  if(v.toLowerCase()===w.toLowerCase()){
    answered=true;
    feedback.textContent='¡Excelente! Escribiste la palabra correctamente.';
    feedback.className='feedback good';
    document.getElementById('writeContinue').classList.remove('hidden');
    saveMisses(w,wrongLetters);
  } else {
    writeAttempts++;
    let diff=[];

    for(let i=0;i<Math.max(w.length,v.length);i++){
      let a=(v[i]||'').toLowerCase();
      let b=(w[i]||'').toLowerCase();
      if(a!==b && b.match(/[a-z]/) && !diff.includes(b)) diff.push(b);
    }

    diff.forEach(c=>wrongLetters.add(c));
    saveMisses(w,wrongLetters);

    feedback.textContent=
      `No es correcto todavía. Intento ${writeAttempts} de 3. Revisa las letras y vuelve a intentarlo.`;
    feedback.className='feedback bad';

    if(writeAttempts>=3){
      document.getElementById('writeRetry').classList.remove('hidden');
      feedback.textContent=
        'Has tenido 3 intentos. Mira la palabra, escúchala y practícala antes de continuar.';
      document.getElementById('writeAnswer').value='';
      document.getElementById('writeAnswer').focus();
    }
  }
}
function practiceCorrect(){
  let input=document.getElementById('writeAnswer');
  input.value='';
  input.placeholder='Escribe la palabra que acabas de estudiar';
  input.focus();
  document.getElementById('writeFeedback').textContent=
    'Escríbela completa en el espacio de arriba. No se marcará dominada automáticamente.';
  document.getElementById('writeFeedback').className='feedback';
}
function nextWord(){
  index++;
  renderCurrent();
}

/* FINAL DE CADA SESIÓN */
function finishMode(){
  let st=moduleState(moduleIndex);

  if(mode==='learn'){
    st.learned=true;
    persist();
    document.getElementById('gameContent').innerHTML=`
      <div class="center">
        <h2>🎉 ¡Terminaste de aprender!</h2>
        <p>Has estudiado las 22 palabras del módulo ${moduleIndex+1}.</p>
        <p>Ahora juega Hangman con las mismas palabras.</p>
        <div class="btnrow">
          <button class="primary" onclick="startMode('hangman')">Comenzar Hangman →</button>
          <button class="secondary" onclick="goHome()">Volver a módulos</button>
        </div>
      </div>`;
  } else if(mode==='hangman'){
    st.hangman=true;
    persist();
    document.getElementById('gameContent').innerHTML=`
      <div class="center">
        <h2>🎯 ¡Terminaste Hangman!</h2>
        <p>Completaste las 22 palabras. En la próxima sesión podrás practicar escribiendo las palabras que más se te hicieron difíciles.</p>
        <div class="btnrow">
          <button class="primary" onclick="startMode('write')">Sesión de escritura →</button>
          <button class="secondary" onclick="goHome()">Volver a módulos</button>
        </div>
      </div>`;
  } else {
    st.write=true;
    persist();
    document.getElementById('gameContent').innerHTML=`
      <div class="center">
        <h2>⭐ ¡Sesión completada!</h2>
        <p>Terminaste la práctica de las palabras que necesitaban más repaso.</p>
        <div class="statgrid">
          <div class="stat"><b>${list.length}</b><span class="small">palabras repasadas</span></div>
          <div class="stat"><b>${getReviewWords().length}</b><span class="small">pendientes para repasar</span></div>
          <div class="stat"><b>22</b><span class="small">palabras en el módulo</span></div>
        </div>
        <div class="btnrow">
          <button class="primary" onclick="startMode('hangman')">Practicar Hangman otra vez</button>
          <button class="secondary" onclick="goHome()">Volver a módulos</button>
        </div>
      </div>`;
  }

  setSteps();
  document.getElementById('bar').style.width='100%';
}
renderHome();
</script>
