<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Master</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

button {
  font-family: inherit;
}

.app {
  max-width: 900px;
  margin: auto;
  min-height: 100vh;
  padding: 20px;
}

header {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

header h1 {
  margin: 0 0 10px;
  text-align: center;
}

.top-info {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}

.progress {
  height: 10px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 12px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width .3s;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
  text-align: center;
}

.hidden {
  display: none !important;
}

h2 {
  margin-top: 0;
}

.word {
  font-size: clamp(28px, 8vw, 48px);
  font-weight: bold;
  margin: 20px 0 10px;
}

.translation {
  font-size: 20px;
  color: #475569;
  margin-bottom: 15px;
}

.definition {
  max-width: 650px;
  margin: 15px auto;
  padding: 15px;
  background: #f8fafc;
  border-radius: 12px;
  line-height: 1.5;
}

button.main-btn {
  border: 0;
  border-radius: 12px;
  padding: 13px 22px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

button.main-btn:hover {
  background: #1d4ed8;
}

.audio-btn {
  border: 0;
  background: #dbeafe;
  color: #1d4ed8;
  border-radius: 50%;
  width: 58px;
  height: 58px;
  font-size: 25px;
  cursor: pointer;
}

.options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  max-width: 650px;
  margin: 25px auto;
}

.option {
  border: 2px solid #cbd5e1;
  background: white;
  border-radius: 14px;
  padding: 16px;
  font-size: 19px;
  cursor: pointer;
  transition: .2s;
}

.option:hover {
  background: #eff6ff;
  border-color: #60a5fa;
}

.option.correct {
  background: #dcfce7;
  border-color: #22c55e;
}

.option.wrong {
  background: #fee2e2;
  border-color: #ef4444;
}

.feedback {
  min-height: 30px;
  font-weight: bold;
  margin-top: 10px;
}

.sentence {
  font-size: clamp(22px, 5vw, 32px);
  margin: 30px auto 10px;
  line-height: 1.5;
}

.blank {
  font-weight: bold;
  letter-spacing: 2px;
}

.hangman-word {
  width: 100%;
  text-align: center;
  font-size: clamp(20px, 7vw, 42px);
  letter-spacing: clamp(2px, 1.5vw, 8px);
  font-weight: bold;
  margin: 25px 0;
  white-space: nowrap;
  overflow: hidden;
  line-height: 1.2;
}

.keyboard {
  max-width: 700px;
  margin: auto;
}

.key-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 6px 0;
}

.letter-btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 8px;
  background: #e2e8f0;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
}

.letter-btn:hover {
  background: #cbd5e1;
}

.letter-btn.used {
  background: #cbd5e1;
  color: #94a3b8;
  opacity: .55;
  cursor: not-allowed;
}

.hangman-score {
  margin-top: 15px;
  padding: 12px;
  background: #f8fafc;
  border-radius: 12px;
  font-weight: bold;
}

.result {
  font-size: 22px;
  font-weight: bold;
  margin: 20px 0;
}

.module-btn {
  width: 100%;
  padding: 20px;
  border: 0;
  border-radius: 18px;
  background: #2563eb;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.module-btn:hover {
  background: #1d4ed8;
}

.step-title {
  color: #2563eb;
  font-size: 15px;
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 1px;
}

@media (max-width: 600px) {

  .app {
    padding: 12px;
  }

  .card {
    padding: 18px 12px;
  }

  .options {
    grid-template-columns: 1fr;
  }

  .letter-btn {
    width: 31px;
    height: 38px;
    font-size: 14px;
  }

  .key-row {
    gap: 3px;
  }

  .hangman-word {
    font-size: clamp(18px, 6.5vw, 34px);
    letter-spacing: 2px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>📚 Spelling Master</h1>

  <div class="top-info">
    <span id="stepLabel">Ready</span>
    <span id="scoreLabel">⭐ 0</span>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</header>

<!-- HOME -->
<div id="homeScreen" class="card">
  <h2>📘 Module 1</h2>
  <p>Practice these 8 spelling words.</p>

  <button class="module-btn" onclick="startModule()">
    Start 8 Words
  </button>
</div>

<!-- MAIN -->
<div id="gameScreen" class="card hidden">

  <div id="stepTitle" class="step-title"></div>

  <div id="content"></div>

</div>

</div>

<script>

/* =========================================================
   WORDS
========================================================= */

const words = [

  {
    word: "abbreviation",
    spanish: "abreviatura",
    definition: "A shortened form of a word or phrase.",
    sentence: "Dr. is an ________.",
    spellingOptions: [
      "abreviation",
      "abbriviation",
      "abbreviation",
      "abbreviaton"
    ]
  },

  {
    word: "abroad",
    spanish: "en el extranjero",
    definition: "In or to a foreign country.",
    sentence: "We went ________.",
    spellingOptions: [
      "abrode",
      "abroad",
      "abroude",
      "abrodd"
    ]
  },

  {
    word: "access",
    spanish: "acceso",
    definition: "The ability or opportunity to enter, use, or reach something.",
    sentence: "I have ________.",
    spellingOptions: [
      "acces",
      "aksess",
      "access",
      "acsess"
    ]
  },

  {
    word: "accord",
    spanish: "acuerdo",
    definition: "An agreement between people or groups.",
    sentence: "They reached an ________.",
    spellingOptions: [
      "acord",
      "accord",
      "akkord",
      "acorrd"
    ]
  },

  {
    word: "adequate",
    spanish: "adecuado / suficiente",
    definition: "Good enough or sufficient for a purpose.",
    sentence: "This is ________.",
    spellingOptions: [
      "adequete",
      "adequate",
      "adecuate",
      "adekuate"
    ]
  },

  {
    word: "advancements",
    spanish: "avances",
    definition: "Improvements or developments that make something better.",
    sentence: "________ help us.",
    spellingOptions: [
      "advansments",
      "advancements",
      "advancments",
      "advansements"
    ]
  },

  {
    word: "aeronautics",
    spanish: "aeronáutica",
    definition: "The science and technology of aircraft and flight.",
    sentence: "I study ________.",
    spellingOptions: [
      "aeronautics",
      "aeronotics",
      "aeronautiks",
      "aeronaughtics"
    ]
  },

  {
    word: "affectionate",
    spanish: "cariñoso",
    definition: "Showing love, care, or fondness.",
    sentence: "My dog is ________.",
    spellingOptions: [
      "afectionate",
      "affectionate",
      "affectionet",
      "affectonate"
    ]
  }

];


/* =========================================================
   GAME VARIABLES
========================================================= */

let step = "";
let currentIndex = 0;
let score = 0;

let failedWords = [];

let hangmanWord = "";
let guessedLetters = [];
let attempts = 6;
let hangmanPoints = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const homeScreen = document.getElementById("homeScreen");
const gameScreen = document.getElementById("gameScreen");
const content = document.getElementById("content");
const stepTitle = document.getElementById("stepTitle");

const stepLabel = document.getElementById("stepLabel");
const scoreLabel = document.getElementById("scoreLabel");
const progressBar = document.getElementById("progressBar");


/* =========================================================
   SPEECH
========================================================= */

function speakWord(word) {

  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(word);

  utterance.lang = "en-US";
  utterance.rate = 0.75;

  speechSynthesis.speak(utterance);
}


/* =========================================================
   START
========================================================= */

function startModule() {

  homeScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  score = 0;
  failedWords = [];
  currentIndex = 0;

  updateScore();

  startLearn();
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

  /*
    Each stage has 8 words.
    There are 5 main stages.
  */

  const stageNumber = {
    learn: 0,
    listen: 1,
    spelling: 2,
    sentence: 3,
    hangman: 4
  }[step];

  const total = 40;
  const completed = stageNumber * 8 + currentIndex;

  progressBar.style.width =
    ((completed / total) * 100) + "%";
}


/* =========================================================
   SCORE
========================================================= */

function updateScore() {
  scoreLabel.textContent = "⭐ " + score;
}


/* =========================================================
   LEARN
========================================================= */

function startLearn() {

  step = "learn";
  currentIndex = 0;

  stepLabel.textContent = "Learn • 1 of 8";
  stepTitle.textContent = "📘 Learn";

  showLearn();
}


function showLearn() {

  const w = words[currentIndex];

  stepLabel.textContent =
    `Learn • ${currentIndex + 1} of ${words.length}`;

  content.innerHTML = `

    <div class="word">${w.word}</div>

    <div class="translation">
      ${w.spanish}
    </div>

    <div class="definition">
      ${w.definition}
    </div>

    <button class="audio-btn"
      onclick="speakWord('${w.word}')">
      🔊
    </button>

    <br>

    <button class="main-btn" onclick="nextLearn()">
      Continue
    </button>
  `;

  setTimeout(() => speakWord(w.word), 300);

  updateProgress();
}


function nextLearn() {

  currentIndex++;

  if (currentIndex < words.length) {

    showLearn();

  } else {

    startListen();

  }
}


/* =========================================================
   LISTEN & CHOOSE
========================================================= */

function startListen() {

  step = "listen";
  currentIndex = 0;

  showListen();
}


function showListen() {

  const w = words[currentIndex];

  stepLabel.textContent =
    `Listen & Choose • ${currentIndex + 1} of ${words.length}`;

  stepTitle.textContent = "👂 Listen & Choose";

  /*
    Create 4 choices.
    Correct word + 3 other words.
  */

  let choices = [
    w.word,
    ...words
      .filter(x => x.word !== w.word)
      .sort(() => Math.random() - .5)
      .slice(0, 3)
      .map(x => x.word)
  ];

  choices.sort(() => Math.random() - .5);

  content.innerHTML = `

    <h2>Which word did you hear?</h2>

    <button class="audio-btn"
      onclick="speakWord('${w.word}')">
      🔊
    </button>

    <div class="options">

      ${choices.map(choice => `
        <button
          class="option"
          onclick="checkListen(this, '${choice}', '${w.word}')">
          ${choice}
        </button>
      `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>
  `;

  setTimeout(() => speakWord(w.word), 300);

  updateProgress();
}


function checkListen(button, selected, correct) {

  if (selected === correct) {

    button.classList.add("correct");

    score += 10;
    updateScore();

    document.getElementById("feedback").textContent =
      "✅ Correct!";

    setTimeout(() => {

      currentIndex++;

      if (currentIndex < words.length) {
        showListen();
      } else {
        startSpelling();
      }

    }, 700);

  } else {

    button.classList.add("wrong");

    document.getElementById("feedback").textContent =
      "❌ Try again.";
  }
}


/* =========================================================
   SPELLING
========================================================= */

function startSpelling() {

  step = "spelling";
  currentIndex = 0;

  showSpelling();
}


function showSpelling() {

  const w = words[currentIndex];

  stepLabel.textContent =
    `Spelling • ${currentIndex + 1} of ${words.length}`;

  stepTitle.textContent = "✏️ Spelling";

  content.innerHTML = `

    <h2>Choose the correct spelling</h2>

    <button class="audio-btn"
      onclick="speakWord('${w.word}')">
      🔊
    </button>

    <div class="options">

      ${w.spellingOptions.map(choice => `
        <button
          class="option"
          onclick="checkSpelling(this, '${choice}', '${w.word}')">
          ${choice}
        </button>
      `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>
  `;

  /*
    Automatic pronunciation.
  */

  setTimeout(() => speakWord(w.word), 300);

  updateProgress();
}


function checkSpelling(button, selected, correct) {

  if (selected === correct) {

    button.classList.add("correct");

    score += 10;
    updateScore();

    document.getElementById("feedback").textContent =
      "✅ Correct spelling!";

    setTimeout(() => {

      currentIndex++;

      if (currentIndex < words.length) {

        showSpelling();

      } else {

        startSentence();

      }

    }, 700);

  } else {

    button.classList.add("wrong");

    document.getElementById("feedback").textContent =
      "❌ That's not correct. Try again.";

  }
}


/* =========================================================
   SENTENCE
========================================================= */

function startSentence() {

  step = "sentence";
  currentIndex = 0;

  showSentence();
}


function showSentence() {

  const w = words[currentIndex];

  stepLabel.textContent =
    `Sentence • ${currentIndex + 1} of ${words.length}`;

  stepTitle.textContent = "📝 Sentence";

  /*
    Correct word + 3 random words.
  */

  let choices = [
    w.word,
    ...words
      .filter(x => x.word !== w.word)
      .sort(() => Math.random() - .5)
      .slice(0, 3)
      .map(x => x.word)
  ];

  choices.sort(() => Math.random() - .5);

  content.innerHTML = `

    <div class="sentence">
      ${w.sentence}
    </div>

    <div class="options">

      ${choices.map(choice => `
        <button
          class="option"
          onclick="checkSentence(this, '${choice}', '${w.word}')">
          ${choice}
        </button>
      `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>
  `;

  updateProgress();
}


function checkSentence(button, selected, correct) {

  if (selected === correct) {

    button.classList.add("correct");

    score += 10;
    updateScore();

    document.getElementById("feedback").textContent =
      "✅ Correct!";

    setTimeout(() => {

      currentIndex++;

      if (currentIndex < words.length) {

        showSentence();

      } else {

        startHangman();

      }

    }, 700);

  } else {

    button.classList.add("wrong");

    document.getElementById("feedback").textContent =
      "❌ Try again.";
  }
}


/* =========================================================
   HANGMAN
========================================================= */

function startHangman() {

  step = "hangman";
  currentIndex = 0;

  showHangman();
}


function showHangman() {

  const w = words[currentIndex];

  hangmanWord = w.word.toLowerCase();

  guessedLetters = [];
  attempts = 6;
  hangmanPoints = 0;

  stepLabel.textContent =
    `Hangman • ${currentIndex + 1} of ${words.length}`;

  stepTitle.textContent = "🎮 Hangman";

  renderHangman();

  setTimeout(() => speakWord(w.word), 300);

  updateProgress();
}


function renderHangman() {

  const display = hangmanWord
    .split("")
    .map(letter => {

      if (letter === " ") return "&nbsp;";

      return guessedLetters.includes(letter)
        ? letter
        : "_";

    })
    .join(" ");

  const qwertyRows = [
    ["q","w","e","r","t","y","u","i","o","p"],
    ["a","s","d","f","g","h","j","k","l"],
    ["z","x","c","v","b","n","m"]
  ];

  content.innerHTML = `

    <div class="hangman-word">
      ${display}
    </div>

    <div class="hangman-score">
      ❤️ Attempts: ${attempts}
      &nbsp; | &nbsp;
      ⭐ Points: ${hangmanPoints}
    </div>

    <div class="keyboard">

      ${qwertyRows.map(row => `

        <div class="key-row">

          ${row.map(letter => `

            <button
              class="letter-btn ${
                guessedLetters.includes(letter)
                  ? "used"
                  : ""
              }"
              ${
                guessedLetters.includes(letter)
                  ? "disabled"
                  : ""
              }
              onclick="guessLetter('${letter}')">

              ${letter.toUpperCase()}

            </button>

          `).join("")}

        </div>

      `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>
  `;
}


function guessLetter(letter) {

  if (guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if (hangmanWord.includes(letter)) {

    hangmanPoints += 10;

  } else {

    attempts--;

  }

  renderHangman();

  checkHangmanEnd();
}


function checkHangmanEnd() {

  const completed = hangmanWord
    .split("")
    .every(letter =>
      guessedLetters.includes(letter)
    );

  if (completed) {

    score += 50;
    score += hangmanPoints;

    updateScore();

    content.innerHTML += `

      <div class="result">
        🎉 Word Complete!
        <br>
        +${50 + hangmanPoints} points
      </div>

    `;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex < words.length) {

        showHangman();

      } else {

        startFinalReview();

      }

    }, 1200);

  }

  else if (attempts <= 0) {

    const failedWord = words[currentIndex];

    if (!failedWords.includes(failedWord)) {
      failedWords.push(failedWord);
    }

    content.innerHTML += `

      <div class="result">
        ❌ The word was:
        <br><strong>${failedWord.word}</strong>
      </div>

    `;

    setTimeout(() => {

      currentIndex++;

      if (currentIndex < words.length) {

        showHangman();

      } else {

        startFinalReview();

      }

    }, 1400);

  }
}


/* =========================================================
   FINAL REVIEW
========================================================= */

function startFinalReview() {

  if (failedWords.length === 0) {

    finishModule();

    return;
  }

  currentIndex = 0;

  startReviewSpelling();
}


/* =========================================================
   REVIEW SPELLING
========================================================= */

function startReviewSpelling() {

  step = "reviewSpelling";

  showReviewSpelling();
}


function showReviewSpelling() {

  const w = failedWords[currentIndex];

  stepLabel.textContent =
    `Review Spelling • ${currentIndex + 1} of ${failedWords.length}`;

  stepTitle.textContent = "🔄 Review Spelling";

  content.innerHTML = `

    <h2>Let's try this word again.</h2>

    <button class="audio-btn"
      onclick="speakWord('${w.word}')">
      🔊
    </button>

    <div class="options">

      ${w.spellingOptions.map(choice => `

        <button
          class="option"
          onclick="checkReviewSpelling(
            this,
            '${choice}',
            '${w.word}'
          )">

          ${choice}

        </button>

      `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>
  `;

  setTimeout(() => speakWord(w.word), 300);
}


function checkReviewSpelling(button, selected, correct) {

  if (selected === correct) {

    button.classList.add("correct");

    score += 10;
    updateScore();

    document.getElementById("feedback").textContent =
      "✅ Correct!";

    setTimeout(() => {

      currentIndex++;

      if (currentIndex < failedWords.length) {

        showReviewSpelling();

      } else {

        currentIndex = 0;
        startReviewSentence();

      }

    }, 700);

  } else {

    button.classList.add("wrong");

    document.getElementById("feedback").textContent =
      "❌ Try again.";
  }
}


/* =========================================================
   REVIEW SENTENCE
========================================================= */

function startReviewSentence() {

  step = "reviewSentence";

  showReviewSentence();
}


function showReviewSentence() {

  const w = failedWords[currentIndex];

  stepLabel.textContent =
    `Review Sentence • ${currentIndex + 1} of ${failedWords.length}`;

  stepTitle.textContent = "🔄 Review Sentence";

  let choices = [
    w.word,
    ...words
      .filter(x => x.word !== w.word)
      .sort(() => Math.random() - .5)
      .slice(0, 3)
      .map(x => x.word)
  ];

  choices.sort(() => Math.random() - .5);

  content.innerHTML = `

    <div class="sentence">
      ${w.sentence}
    </div>

    <div class="options">

      ${choices.map(choice => `

        <button
          class="option"
          onclick="checkReviewSentence(
            this,
            '${choice}',
            '${w.word}'
          )">

          ${choice}

        </button>

      `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>
  `;
}


function checkReviewSentence(button, selected, correct) {

  if (selected === correct) {

    button.classList.add("correct");

    score += 10;
    updateScore();

    document.getElementById("feedback").textContent =
      "✅ Correct!";

    setTimeout(() => {

      currentIndex++;

      if (currentIndex < failedWords.length) {

        showReviewSentence();

      } else {

        currentIndex = 0;
        startReviewHangman();

      }

    }, 700);

  } else {

    button.classList.add("wrong");

    document.getElementById("feedback").textContent =
      "❌ Try again.";
  }
}


/* =========================================================
   REVIEW HANGMAN
========================================================= */

function startReviewHangman() {

  step = "reviewHangman";

  showReviewHangman();
}


function showReviewHangman() {

  const w = failedWords[currentIndex];

  hangmanWord = w.word.toLowerCase();

  guessedLetters = [];
  attempts = 6;
  hangmanPoints = 0;

  stepLabel.textContent =
    `Review Hangman • ${currentIndex + 1} of ${failedWords.length}`;

  stepTitle.textContent = "🔄 Review Hangman";

  renderHangman();

  setTimeout(() => speakWord(w.word), 300);
}


function guessLetterReview(letter) {
  guessLetter(letter);
}


/* =========================================================
   FINISH
========================================================= */

function finishModule() {

  stepLabel.textContent = "Complete!";
  stepTitle.textContent = "🏆 Module Complete";

  progressBar.style.width = "100%";

  content.innerHTML = `

    <div class="result">
      🎉 Great job!
      <br><br>
      Final Score: ${score}
    </div>

    <button
      class="main-btn"
      onclick="location.reload()">

      Play Again

    </button>
  `;
}

</script>

</body>
</html>
