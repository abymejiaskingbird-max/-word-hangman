<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Master</title>

<style>
*{box-sizing:border-box}
:root{--blue:#3157d5;--light:#eef2ff;--ink:#172033}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:var(--ink)}
header{background:var(--blue);color:white;text-align:center;padding:12px 48px}
header h1{font-size:22px;margin:0}
header p{font-size:12px;margin:5px 0 0}
.container{max-width:850px;margin:auto;padding:12px}
.card,.stage{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 16px #0000000d;margin-bottom:12px}
.stage{display:none}
.stage.active{display:block}
.hidden{display:none!important}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--blue);color:white}
.secondary{background:#e7ecf7;color:var(--ink)}
.restart{background:#fff0d6;color:#9a5a00}
.topbar{position:absolute;top:7px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.topbar button{pointer-events:auto;padding:7px;width:36px;height:36px;font-size:18px}
.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.module-card{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;box-shadow:0 2px 8px #0000000b}
.module-card h3{font-size:15px;margin:0}
.module-card p{font-size:12px;color:#667085;margin:3px 0}
.module-card .start-module{font-size:12px;padding:8px 5px}
.progress{height:6px;background:#e7ebf3;border-radius:20px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--blue);transition:width .2s}
.stage-title{text-align:center;font-size:22px;font-weight:bold;margin:0 0 8px}
.subtitle{text-align:center;color:#667085;font-size:13px}
.word{font-size:clamp(25px,6vw,38px);font-weight:bold;text-align:center;overflow-wrap:anywhere;margin:16px 0}
.translation{text-align:center;font-size:19px;font-weight:bold;margin:8px 0}
.definition{text-align:center;color:#667085;line-height:1.45;font-size:14px}
.big-button{display:block;margin:10px auto;min-width:170px}
.stage-navigation{display:flex;justify-content:center;gap:10px;margin-top:10px}
.stage-pill{border-radius:20px;padding:7px 13px;font-size:12px;background:#e7ecf7}
.stage-pill.active{background:var(--blue);color:white}
.hangman-wrap{display:flex;justify-content:center;max-height:235px}
.hangman-svg{width:230px;height:230px;max-width:100%}
.final-word{text-align:center;font-size:28px;letter-spacing:3px;overflow-wrap:anywhere;margin:12px 0}
.keyboard{max-width:520px;width:100%;margin:10px auto}
.keyboard-row{display:flex;justify-content:center;gap:4px;margin:5px 0}
.key{flex:1;max-width:43px;height:42px;padding:0;background:#e8edf7;color:var(--ink);font-size:19px;text-transform:lowercase}
.feedback{text-align:center;font-weight:bold;font-size:15px;min-height:22px;margin:10px 0}
.correct{color:#16803c}
.incorrect{color:#c62828}
.module-info{font-size:12px;color:#667085;text-align:center;margin:4px 0}
.score{font-size:48px;color:var(--blue);font-weight:bold;text-align:center;margin:12px}
.home-note{text-align:center;color:#667085;font-size:12px}
@media(max-width:600px){
 header{height:54px;padding:8px 45px}
 header h1{font-size:18px}
 header p{font-size:10px;margin:3px 0 0}
 .container{padding:8px}
 #home>.card{padding:10px;box-shadow:none}
 #home h2{font-size:18px;margin:3px 0 8px}
 .module-grid{gap:7px}
 .module-card{padding:8px;min-height:105px}
 .module-card h3{font-size:12px}
 .module-card p{font-size:10px}
 .module-card .start-module{font-size:10px;padding:7px 3px}
 .card,.stage{border-radius:13px}
 #game{height:calc(100dvh - 62px);display:flex;flex-direction:column;gap:0}
 #moduleNavigation{padding:7px 9px;margin-bottom:6px;flex:none}
 .stage.active{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:10px;margin:0;overflow-y:auto}
 .stage-title{font-size:20px}
 .word{font-size:clamp(24px,7vw,34px);margin:10px 0}
 .translation{font-size:17px}
 .definition{font-size:12px}
 .big-button{min-width:0;font-size:14px;padding:10px 12px;margin:7px auto}
 .hangman-wrap{flex:0 1 auto;max-height:175px}
 .hangman-svg{height:175px;width:175px}
 .final-word{font-size:clamp(16px,5vw,27px);letter-spacing:2px;margin:7px 0}
 .keyboard{flex:none;margin:6px 0}
 .keyboard-row{gap:3px;margin:4px 0}
 .key{height:clamp(34px,6.5vh,43px);font-size:clamp(15px,5vw,21px);max-width:none}
 .feedback{font-size:13px;margin:6px 0}
 .score{font-size:40px}
}
@media(max-width:350px){
 .module-card{padding:5px}
 .module-card h3{font-size:11px}
 .module-card .start-module{font-size:9px}
 .key{font-size:14px}
}
</style>
</head>

<body>
<header>
  <h1>📘 Spelling Master</h1>
  <p id="headerProgress">Choose a module to begin</p>
</header>

<div class="container">
<section id="home">
  <div class="card">
    <h2>📚 Modules</h2>
    <p class="home-note">88 words · 9 modules · Learn + Hangman</p>
    <div id="overallMastery"></div>
    <div id="moduleGrid" class="module-grid"></div>
  </div>
</section>

<section id="game" class="hidden">
  <div class="topbar">
    <button class="secondary" onclick="goHome()" aria-label="Home">🏠</button>
    <button class="restart" onclick="restartModule()" aria-label="Restart">🔄</button>
  </div>

  <div id="moduleNavigation" class="card">
    <div id="moduleProgressText" class="module-info"></div>
    <div class="progress"><div id="moduleProgressFill"></div></div>
    <div class="stage-navigation">
      <span id="learnPill" class="stage-pill active">1 · Learn</span>
      <span id="hangmanPill" class="stage-pill">6 · Hangman</span>
    </div>
  </div>

  <!-- STAGE 1: LEARN -->
  <div id="stage1" class="stage active">
    <div class="stage-title">📖 LEARN</div>
    <div id="learnWord" class="word"></div>
    <div id="learnTranslation" class="translation"></div>
    <p id="learnDefinition" class="definition"></p>

    <button class="primary big-button" onclick="speakCurrent()">
      🔊 Listen to the word
    </button>
    <button class="primary big-button" onclick="startHangman()">
      Next: Hangman →
    </button>
  </div>

  <!-- STAGE 6: HANGMAN -->
  <div id="stage6" class="stage">
    <div class="stage-title">🎯 HANGMAN</div>
    <p class="subtitle">Guess the letters to spell the word.</p>

    <div class="hangman-wrap">
      <svg class="hangman-svg" viewBox="0 0 300 300"
           role="img" aria-label="Hangman drawing">
        <g fill="none" stroke="currentColor" stroke-width="6"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M45 270 Q95 260 145 270"/>
          <path d="M75 265 L75 45"/>
          <path d="M75 45 Q135 38 200 48"/>
          <path d="M200 48 L200 82"/>
          <circle id="h1" cx="200" cy="108" r="27" visibility="hidden"/>
          <path id="h2" d="M200 135 Q194 170 200 205" visibility="hidden"/>
          <path id="h3" d="M198 153 Q170 165 150 185" visibility="hidden"/>
          <path id="h4" d="M200 153 Q228 165 248 185" visibility="hidden"/>
          <path id="h5" d="M199 203 Q177 230 165 250" visibility="hidden"/>
          <path id="h6" d="M201 203 Q223 230 235 250" visibility="hidden"/>
        </g>
      </svg>
    </div>

    <div id="hangmanWord" class="final-word"></div>

    <button class="secondary big-button" onclick="speakCurrent()">
      🔊 Listen to the word
    </button>

    <div id="hangmanFeedback" class="feedback" aria-live="polite"></div>

    <div class="keyboard">
      <div class="keyboard-row" id="mainRow1"></div>
      <div class="keyboard-row" id="mainRow2"></div>
      <div class="keyboard-row" id="mainRow3"></div>
    </div>

    <button id="nextWordButton" class="primary big-button hidden"
            onclick="nextWord()">
      Next word →
    </button>
  </div>

  <!-- RESULTS -->
  <div id="result" class="stage">
    <div id="resultTitle" class="stage-title">🎉 Module Complete!</div>
    <div id="resultScore" class="score">0%</div>
    <p id="resultBadge" class="subtitle"></p>
    <p id="resultAttempt" class="home-note"></p>
    <p id="resultBest" class="home-note"></p>
    <button class="primary big-button" onclick="restartModule()">🔄 Try Again</button>
    <button class="secondary big-button" onclick="goHome()">🏠 Home</button>
  </div>
</section>
</div>

<script>
"use strict";

/* WORDS, SPANISH TRANSLATIONS, AND DEFINITIONS */
const VOCAB = [
["abbreviation","Abreviatura","A short form of a word or phrase."],
["abroad","En el extranjero","In another country."],
["access","Acceso","The ability or permission to enter or use something."],
["accord","Acuerdo","An agreement between people or groups."],
["adequate","Suficiente","Enough for what is needed."],
["advancements","Avances","New improvements or progress."],
["aeronautics","Aeronáutica","The study of aircraft and flying."],
["affectionate","Cariñoso","Showing love and care."],
["affliction","Aflicción","An illness or problem that causes suffering."],
["aggregate","Total combinado","The total formed by adding parts together."],
["agony","Agonía","Very strong pain."],
["aide","Ayudante","A person who helps someone with work."],
["aisle","Pasillo","A passage between rows of seats or shelves."],
["alibi","Coartada","Proof that someone was elsewhere when a crime happened."],
["allegiance","Lealtad","Loyalty to a country or group."],
["ambient","Ambiental","Coming from the surrounding area."],
["amnesty","Amnistía","An official pardon for a group of people."],
["anatomy","Anatomía","The study of body parts."],
["animosity","Enemistad","Strong dislike or anger toward someone."],
["apathy","Apatía","A lack of interest or care."],
["approach","Manera de abordar algo","A way of doing or solving something."],
["archaic","Anticuado","Very old and no longer commonly used."],
["arrogant","Arrogante","Acting as if you are better than others."],
["assignment","Tarea","A task someone asks you to do."],
["audacity","Atrevimiento","Bold behavior that may be rude."],
["auspicious","Prometedor","Showing signs that something will go well."],
["baffle","Confundir","To confuse someone."],
["banish","Desterrar","To force someone to leave a place."],
["banquet","Banquete","A large, special meal for many people."],
["barricade","Barricada","A barrier that blocks the way."],
["bashful","Tímido","Shy and easily embarrassed."],
["battalion","Batallón","A large group of soldiers."],
["because","Porque","For the reason that."],
["belated","Tardío","Arriving or happening late."],
["beloved","Querido","Loved very much."],
["benevolent","Bondadoso","Kind and willing to help."],
["bibliography","Bibliografía","A list of books or sources used in a project."],
["bilingual","Bilingüe","Able to speak two languages."],
["bizarre","Extraño","Very strange or unusual."],
["blockade","Bloqueo","An action that stops people or goods from entering or leaving."],
["boarder","Huésped con alojamiento y comida","A person who pays for a room and meals in a home."],
["boisterous","Bullicioso","Noisy and full of energy."],
["border","Frontera","The line that separates two places or countries."],
["bracelet","Pulsera","Jewelry worn around the wrist."],
["breathe","Respirar","To take air into and out of your lungs."],
["bridge","Puente","A structure that lets you cross a river or road."],
["brilliant","Brillante","Very smart or excellent."],
["bruise","Moretón","A mark on the skin caused by a bump or hit."],
["bulletin","Boletín","A short notice with news or information."],
["bungalow","Casa de una planta","A small house with one floor."],
["calligraphy","Caligrafía","The art of making beautiful letters by hand."],
["callous","Insensible","Not caring about another person's pain."],
["camouflage","Camuflaje","Colors or patterns that help something blend in and hide."],
["candid","Sincero","Honest and direct."],
["carnivorous","Carnívoro","Eating meat."],
["casserole","Guiso al horno","A meal baked in a deep dish."],
["catastrophe","Catástrofe","A very serious disaster."],
["cauldron","Caldero","A large metal pot."],
["celestial","Celestial","Related to the sky or outer space."],
["characterize","Caracterizar","To describe the qualities that make someone or something distinct."],
["chimpanzee","Chimpancé","An intelligent ape that can use tools."],
["choreography","Coreografía","The planned steps in a dance."],
["circumstance","Circunstancia","A fact or condition that affects a situation."],
["clandestine","Clandestino","Done in secret."],
["clemency","Clemencia","Mercy shown by reducing a punishment."],
["clientele","Clientela","The regular customers of a business."],
["cohesive","Unido","United and working well together."],
["coincidence","Coincidencia","Things happening together by chance."],
["colleague","Compañero de trabajo","A person you work with."],
["colloquial","Coloquial","Used in casual, everyday conversation."],
["compensation","Compensación","Payment for work or a loss."],
["compulsory","Obligatorio","Required; something you must do."],
["condolence","Condolencia","An expression of sympathy after someone dies."],
["configuration","Configuración","The way parts are arranged."],
["constellation","Constelación","A group of stars that forms a pattern."],
["courageous","Valiente","Brave, even when afraid."],
["creation","Creación","Something that someone has made."],
["credentials","Credenciales","Documents that show a person's skills or qualifications."],
["criticism","Crítica","Comments about what is good or what needs improvement."],
["cuisine","Cocina de un lugar","The style of food from a place."],
["culminate","Culminar","To end with an important event."],
["customary","Habitual","Usual or done as a tradition."],
["dandelion","Diente de león","A plant with yellow flowers and seeds that blow away."],
["dangerous","Peligroso","Able to cause harm."],
["debatable","Discutible","Open to different opinions."],
["December","Diciembre","The last month of the year."],
["effective","Eficaz","Working well and giving the wanted result."],
["eligible","Elegible","Meeting the requirements to take part."]
];

const WORDS = VOCAB.map(item => item[0]);
const TRANSLATIONS = Object.fromEntries(VOCAB.map(item => [item[0],item[1]]));
const DEFINITIONS = Object.fromEntries(VOCAB.map(item => [item[0],item[2]]));

/* NINE MODULES: FIRST 8 WORDS, THEN GROUPS OF 10 */
const MODULES = [WORDS.slice(0,8)];
for(let i=8;i<WORDS.length;i+=10){
  MODULES.push(WORDS.slice(i,i+10));
}

/* GAME STATE */
let currentModule = 0;
let order = [];
let cursor = 0;
let currentWord = "";
let mistakes = 0;
let guessed = [];
let finishedWord = false;
let wordScores = [];
let attempt = 1;
let moduleScore = 0;
let speechGeneration = 0;

const KEY_ROWS = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["z","x","c","v","b","n","m"]
];

/* SAFE LOCAL STORAGE */
function getRecords(index){
  try{
    return JSON.parse(localStorage.getItem("spellingMaster_v4_module_"+index)||"[]");
  }catch(error){
    return [];
  }
}
function saveRecords(index,records){
  try{
    localStorage.setItem("spellingMaster_v4_module_"+index,JSON.stringify(records));
  }catch(error){
    console.warn("Scores could not be saved.",error);
  }
}

/* HOME SCREEN */
function renderHome(){
  stopSpeech();
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("game").classList.add("hidden");
  document.getElementById("headerProgress").textContent="Choose a module to begin";

  const grid=document.getElementById("moduleGrid");
  grid.innerHTML="";

  MODULES.forEach((words,index)=>{
    const records=getRecords(index);
    const best=records.length?Math.max(...records.map(r=>r.score)):null;
    const card=document.createElement("div");
    card.className="card module-card";

    const title=document.createElement("h3");
    title.textContent="📘 Module "+(index+1);

    const count=document.createElement("p");
    count.textContent=words.length+" words";

    const bestText=document.createElement("p");
    bestText.textContent="Best: "+(best===null?"—":best+"%");

    const progress=document.createElement("div");
    progress.className="progress";
    const fill=document.createElement("div");
    fill.style.width=(best||0)+"%";
    progress.appendChild(fill);

    const button=document.createElement("button");
    button.className="primary start-module";
    button.textContent="Start Module";
    button.onclick=()=>startModule(index);

    card.append(title,count,bestText,progress,button);
    grid.appendChild(card);
  });

  const completed=MODULES.filter((_,i)=>getRecords(i).length>0).length;
  const overall=document.getElementById("overallMastery");
  overall.innerHTML="";
  const summary=document.createElement("p");
  summary.className="home-note";
  summary.textContent="Modules attempted: "+completed+" / "+MODULES.length;
  overall.appendChild(summary);
}

/* START MODULE */
function startModule(index){
  currentModule=index;
  const records=getRecords(index);
  attempt=records.length+1;
  order=MODULES[index].map((_,i)=>i);
  cursor=0;
  wordScores=Array(MODULES[index].length).fill(null);
  moduleScore=0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("result").classList.remove("active");

  setupWord();
}

/* SET UP CURRENT WORD */
function setupWord(){
  stopSpeech();
  if(cursor>=order.length){
    finishModule();
    return;
  }

  currentWord=MODULES[currentModule][order[cursor]];
  document.getElementById("headerProgress").textContent=
    "Module "+(currentModule+1)+" · Word "+(cursor+1)+" of "+order.length;

  document.getElementById("learnWord").textContent=currentWord;
  document.getElementById("learnTranslation").textContent=TRANSLATIONS[currentWord]||"";
  document.getElementById("learnDefinition").textContent=DEFINITIONS[currentWord]||"";

  document.getElementById("nextWordButton").classList.add("hidden");
  showStage("stage1");
  speakCurrent();
}

/* SWITCH BETWEEN THE TWO STAGES */
function showStage(id){
  document.querySelectorAll(".stage").forEach(stage=>stage.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.getElementById("learnPill").classList.toggle("active",id==="stage1");
  document.getElementById("hangmanPill").classList.toggle("active",id==="stage6");

  if(id==="stage1"){
    document.getElementById("headerProgress").textContent=
      "Module "+(currentModule+1)+" · Word "+(cursor+1)+" of "+order.length+" · Learn";
  }else if(id==="stage6"){
    document.getElementById("headerProgress").textContent=
      "Module "+(currentModule+1)+" · Word "+(cursor+1)+" of "+order.length+" · Hangman";
  }
}

/* SPEECH */
function stopSpeech(){
  speechGeneration++;
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
}
function speakCurrent(){
  if(!("speechSynthesis" in window))return;
  stopSpeech();
  const token=speechGeneration;
  const utterance=new SpeechSynthesisUtterance(currentWord.toLowerCase());
  utterance.lang="en-US";
  utterance.rate=0.75;
  utterance.onend=()=>{if(token!==speechGeneration)return;};
  window.speechSynthesis.speak(utterance);
}

/* BEGIN HANGMAN */
function startHangman(){
  stopSpeech();
  mistakes=0;
  guessed=[];
  finishedWord=false;

  for(let i=1;i<=6;i++){
    document.getElementById("h"+i).setAttribute("visibility","hidden");
  }

  document.getElementById("hangmanFeedback").textContent="";
  document.getElementById("hangmanFeedback").className="feedback";
  document.getElementById("nextWordButton").classList.add("hidden");

  buildKeyboard();
  updateHangmanWord();
  showStage("stage6");
}

/* QWERTY KEYBOARD */
function buildKeyboard(){
  KEY_ROWS.forEach((row,index)=>{
    const container=document.getElementById("mainRow"+(index+1));
    container.innerHTML="";
    row.forEach(letter=>{
      const button=document.createElement("button");
      button.className="key";
      button.textContent=letter;
      button.dataset.letter=letter;
      button.setAttribute("aria-label","Letter "+letter);
      button.onclick=()=>guessLetter(letter,button);
      container.appendChild(button);
    });
  });
}

/* DISPLAY GUESSED LETTERS */
function updateHangmanWord(){
  const display=[...currentWord.toLowerCase()].map(letter=>{
    if(!/[a-z]/.test(letter))return letter;
    return guessed.includes(letter)?letter:"_";
  }).join(" ");

  document.getElementById("hangmanWord").textContent=display;
}

/* GUESS LETTER */
function guessLetter(letter,button){
  if(finishedWord||button.disabled)return;

  button.disabled=true;
  guessed.push(letter);

  const word=currentWord.toLowerCase();
  const feedback=document.getElementById("hangmanFeedback");

  if(!word.includes(letter)){
    mistakes++;
    const part=document.getElementById("h"+mistakes);
    if(part)part.setAttribute("visibility","visible");
  }

  updateHangmanWord();

  const uniqueLetters=[...new Set([...word].filter(ch=>/[a-z]/.test(ch)))];
  const won=uniqueLetters.every(ch=>guessed.includes(ch));

  if(won){
    finishWord(true);
    return;
  }

  if(mistakes>=6){
    finishWord(false);
  }else{
    feedback.textContent="Mistakes: "+mistakes+" / 6";
    feedback.className="feedback";
  }
}

/* FINISH CURRENT WORD */
function finishWord(success){
  if(finishedWord)return;
  finishedWord=true;

  document.querySelectorAll("#stage6 .key").forEach(button=>button.disabled=true);

  const score=success?Math.max(0,100-mistakes*10):0;
  wordScores[order[cursor]]=score;

  const feedback=document.getElementById("hangmanFeedback");
  if(success){
    feedback.textContent="✓ Correct! Score: "+score+"%";
    feedback.className="feedback correct";
  }else{
    document.getElementById("hangmanWord").textContent=
      [...currentWord.toLowerCase()].join(" ");
    feedback.textContent="✗ The word was "+currentWord+". Score: 0%";
    feedback.className="feedback incorrect";
  }

  document.getElementById("nextWordButton").classList.remove("hidden");
  updateProgress();
}

/* NEXT WORD OR FINISH MODULE */
function nextWord(){
  if(!finishedWord)return;
  stopSpeech();
  cursor++;
  if(cursor>=order.length){
    finishModule();
  }else{
    setupWord();
  }
}

/* PROGRESS */
function updateProgress(){
  const completed=wordScores.filter(score=>score!==null).length;
  const percentage=Math.round(completed/order.length*100);
  document.getElementById("moduleProgressText").textContent=
    "Module "+(currentModule+1)+" · "+completed+" / "+order.length+" words completed";
  document.getElementById("moduleProgressFill").style.width=percentage+"%";
}

/* RESULTS */
function finishModule(){
  stopSpeech();

  const completedScores=wordScores.filter(score=>score!==null);
  moduleScore=completedScores.length
    ?Math.round(completedScores.reduce((sum,score)=>sum+score,0)/order.length)
    :0;

  const records=getRecords(currentModule);
  const previousBest=records.length?Math.max(...records.map(r=>r.score)):0;

  records.push({
    attempt:attempt,
    score:moduleScore,
    date:new Date().toISOString()
  });
  saveRecords(currentModule,records);

  document.getElementById("resultTitle").textContent=
    moduleScore===100?"🏆 Perfect Score!":"🎉 Module Complete!";
  document.getElementById("resultScore").textContent=moduleScore+"%";

  let badge="📚 Keep Practicing";
  if(moduleScore===100)badge="🏆 Perfect — no mistakes!";
  else if(moduleScore>=90)badge="🌟 Excellent!";
  else if(moduleScore>=80)badge="👍 Great job!";
  else if(moduleScore>=70)badge="💪 Good effort!";

  document.getElementById("resultBadge").textContent=badge;
  document.getElementById("resultAttempt").textContent="Attempt: "+attempt;
  document.getElementById("resultBest").textContent=
    "Previous best: "+(previousBest||0)+"% · New best: "+Math.max(previousBest,moduleScore)+"%";

  showStage("result");
}

/* RESTART AND HOME */
function restartModule(){
  if(!confirm("Restart this module? Your current attempt will be abandoned."))return;
  startModule(currentModule);
}

function goHome(){
  if(!document.getElementById("game").classList.contains("hidden")){
    if(!confirm("Return to Home? Your current attempt will be abandoned."))return;
  }
  stopSpeech();
  document.querySelectorAll(".stage").forEach(stage=>stage.classList.remove("active"));
  renderHome();
}

/* KEYBOARD SUPPORT */
document.addEventListener("keydown",event=>{
  if(event.ctrlKey||event.metaKey||event.altKey)return;
  if(!document.getElementById("stage6").classList.contains("active"))return;
  if(!/^[a-z]$/i.test(event.key))return;

  const button=document.querySelector(
    '#stage6 [data-letter="'+event.key.toLowerCase()+'"]'
  );
  if(button&&!button.disabled){
    event.preventDefault();
    guessLetter(event.key.toLowerCase(),button);
  }
});

/* START APP */
renderHome();
</script>
</body>
