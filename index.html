<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Master - Module 1</title>

<style>
* {

}

body {

  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

.container {

  margin: auto;
  padding: 20px;
}

h1 {

  margin-bottom: 8px;
}

h2 {

}

.card {

  border-radius: 20px;

}

.word {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
}

.translation {
  text-align: center;

  color: #526071;
  margin-bottom: 15px;
}

.definition {
  background: #f1f5f9;
  border-radius: 12px;
  padding: 15px;

  margin-bottom: 20px;
}

  border-radius: 14px;
  padding: 15px;
  margin: 7px 0;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button:hover {
  opacity: .92;
}

.option {
  background: #eef2ff;
  color: #172033;
  border: 2px solid transparent;
}

.option.correct {
  background: #dcfce7;
  border-color: #16a34a;
}

.option.wrong {
  background: #fee2e2;
  border-color: #dc2626;
}

.listen-btn {
  background: #7c3aed;
}

.progress {
  height: 12px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-bar {
  height: 100%;
  background: #2563eb;
  width: 0%;
  transition: width .3s;
}

.score {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
}

.feedback {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 15px 0;
}

.success {
  color: #16a34a;
}

.danger {
  color: #dc2626;
}

.hangman-word {
  text-align: center;
  font-size: 30px;
  letter-spacing: 8px;
  font-weight: bold;
  margin: 25px 0;
}

.letters {

  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.letter-btn {

}

}

.small {
  color: #64748b;
  font-size: 14px;
}

.final-score {

  font-size: 25px;
  font-weight: bold;
  margin: 20px 0;

.stat {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  background: #f8fafc;
  border-radius: 10px;

@media (max-width: 500px) {

    padding: 12px;
  }

    font-size: 27px;
  }

    grid-template-columns: repeat(6, 1fr);

    font-size: 16px;
  }

</style>
</head>

<body>

<div class="container">

<div id="game">

<div class="score">
⭐ Score: <span id="score">0</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="card">

<div id="stageTitle"></div>

<div id="content"></div>

</div>

</div>

<div id="final" class="hidden">

<div class="card">

<h1>🏆 Module 1 Complete!</h1>

<div class="final-score">
<span id="finalScore">0</span> points
</div>

<div class="stat">
<span>Spelling Correct</span>
<strong id="spellingCorrect">0</strong>
</div>

<div class="stat">
<span>Sentence Correct</span>
<strong id="sentenceCorrect">0</strong>
</div>

<div class="stat">
<span>Hangman Points</span>
<strong id="hangmanPoints">0</strong>
</div>

<div class="stat">
<span>Total Questions</span>
<strong id="totalQuestions">0</strong>
</div>

<div class="stat">
<span>Accuracy</span>
<strong id="accuracy">0%</strong>
</div>

<div id="finalMessage" class="feedback"></div>

<button onclick="location.reload()">
🔄 Practice Again
</button>

</div>

</div>

</div>

<script>

const currentModule = [

{
word:"abbreviation",
translation:"abreviatura",
definition:"A shortened form of a word or phrase.",
sentence:"Dr. is an _______ for Doctor."
},

{
word:"abroad",
translation:"en el extranjero",
definition:"In or to a foreign country.",
sentence:"My aunt lives _______."
},

{
word:"access",
translation:"acceso",
definition:"The ability or opportunity to enter, use, or reach something.",
sentence:"I need _______ to the computer."
},

{
word:"accord",
translation:"acuerdo",
definition:"An agreement or harmony between people or groups.",
sentence:"They made an _______."
},

{
word:"adequate",
translation:"adecuado / suficiente",
definition:"Good enough or sufficient for a particular purpose.",
sentence:"We have _______ food."
},

{
word:"advancements",
translation:"avances",
definition:"Improvements or developments that make something better.",
sentence:"New _______ help people."
},

{
word:"aeronautics",
translation:"aeronáutica",
definition:"The science and technology of aircraft and flight.",
sentence:"He studies _______ and planes."
},

{
word:"affectionate",
translation:"cariñoso",
definition:"Showing love, care, or fondness.",
sentence:"The _______ dog likes to hug."
}

];

let stage = "learn";
let currentIndex = 0;
let score = 0;

let spellingCorrect = 0;
let sentenceCorrect = 0;

let spellingAnswered = 0;
let sentenceAnswered = 0;

let hangmanScore = 0;

let failedWords = [];

let hangmanWord = "";
let guessedLetters = [];
let attemptsLeft = 6;
let hangmanCurrent = null;


/* =========================
   START
========================= */

showLearn();


/* =========================
   SPEECH
========================= */

function speakWord(word){

if(!("speechSynthesis" in window)) return;

window.speechSynthesis.cancel();

const utterance = new SpeechSynthesisUtterance(word);

utterance.lang = "en-US";
utterance.rate = 0.7;
utterance.pitch = 1;

window.speechSynthesis.speak(utterance);

}


/* =========================
   LEARN
========================= */

function showLearn(){

const w = currentModule[currentIndex];

document.getElementById("stageTitle").innerHTML =

`<h2>📖 Learn</h2>
<div class="small">
Word ${currentIndex + 1} of ${currentModule.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="word">${w.word}</div>

<div class="translation">
🇪🇸 ${w.translation}
</div>

<div class="definition">
<strong>Definition:</strong><br>
${w.definition}
</div>

<button class="listen-btn"
onclick="speakWord('${w.word}')">
🔊 Listen
</button>

<button onclick="nextLearn()">
Continue →
</button>

`;

updateProgress(currentIndex,currentModule.length);

speakWord(w.word);

}


function nextLearn(){

currentIndex++;

if(currentIndex < currentModule.length){

showLearn();

}else{

startListen();

}

}


/* =========================
   LISTEN & CHOOSE
========================= */

function startListen(){

stage = "listen";
currentIndex = 0;

showListen();

}


function showListen(){

const correct = currentModule[currentIndex];

let choices = [correct];

let pool =
currentModule.filter(w => w.word !== correct.word);

choices.push(...shuffle(pool).slice(0,3));

choices = shuffle(choices);

document.getElementById("stageTitle").innerHTML =

`<h2>🔊 Listen & Choose</h2>
<div class="small">
Word ${currentIndex + 1} of ${currentModule.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="translation">
👂 Listen to the word.
</div>

<button class="listen-btn"
onclick="speakWord('${correct.word}')">
🔊 Repeat Word
</button>

<div id="listenOptions"></div>

`;

const box =
document.getElementById("listenOptions");

choices.forEach(choice => {

const btn = document.createElement("button");

btn.className = "option";
btn.textContent = choice.word;

btn.onclick = () => {

const all = box.querySelectorAll("button");

all.forEach(b => b.disabled = true);

if(choice.word === correct.word){

btn.classList.add("correct");

score += 10;

}else{

btn.classList.add("wrong");

all.forEach(b => {

if(b.textContent === correct.word){

b.classList.add("correct");

}

});

if(!failedWords.includes(correct)){

failedWords.push(correct);

}

}

updateScore();

setTimeout(() => {

currentIndex++;

if(currentIndex < currentModule.length){

showListen();

}else{

startSpelling();

}

},700);

};

box.appendChild(btn);

});

updateProgress(currentIndex,currentModule.length);

speakWord(correct.word);

}


/* =========================
   SPELLING
========================= */

function startSpelling(){

stage = "spelling";
currentIndex = 0;

showSpelling();

}


function showSpelling(){

const correct = currentModule[currentIndex];

let choices =
makeMisspellings(correct.word);

choices =
shuffle([correct.word,...choices]);

document.getElementById("stageTitle").innerHTML =

`<h2>✏️ Spelling Practice</h2>
<div class="small">
Word ${currentIndex + 1} of ${currentModule.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="translation">
🇪🇸 ${correct.translation}
</div>

<div class="definition">
<strong>Definition:</strong><br>
${correct.definition}
</div>

<h3 style="text-align:center">
Which spelling is correct?
</h3>

<div id="spellingOptions"></div>

`;

const box =
document.getElementById("spellingOptions");

choices.forEach(choice => {

const btn = document.createElement("button");

btn.className = "option";
btn.textContent = choice;

btn.onclick = () => {

const all = box.querySelectorAll("button");

all.forEach(b => b.disabled = true);

spellingAnswered++;

if(choice === correct.word){

btn.classList.add("correct");

score += 20;
spellingCorrect++;

}else{

btn.classList.add("wrong");

all.forEach(b => {

if(b.textContent === correct.word){

b.classList.add("correct");

}

});

if(!failedWords.includes(correct)){

failedWords.push(correct);

}

}

updateScore();

setTimeout(() => {

currentIndex++;

if(currentIndex < currentModule.length){

showSpelling();

}else{

startSentence();

}

},700);

};

box.appendChild(btn);

});

updateProgress(currentIndex,currentModule.length);

}


/* =========================
   MISSPELLINGS
========================= */

function makeMisspellings(word){

let results = [];

if(word.length > 5){

let pos =
Math.floor(word.length / 2);

results.push(
word.slice(0,pos) +
word.slice(pos+1)
);

}

let duplicatePos =
Math.min(2,word.length - 1);

results.push(

word.slice(0,duplicatePos) +
word[duplicatePos] +
word.slice(duplicatePos)

);

if(word.length > 4){

let pos =
Math.min(2,word.length - 2);

let arr = word.split("");

let temp = arr[pos];

arr[pos] = arr[pos+1];
arr[pos+1] = temp;

results.push(arr.join(""));

}

while(results.length < 3){

let arr = word.split("");

let pos =
Math.floor(Math.random()*arr.length);

let letters =
"abcdefghijklmnopqrstuvwxyz";

let newLetter =
letters[Math.floor(Math.random()*letters.length)];

if(newLetter === arr[pos]){
newLetter = "x";
}

arr[pos] = newLetter;

let candidate = arr.join("");

if(candidate !== word &&
!results.includes(candidate)){

results.push(candidate);

}

}

return [...new Set(results)].slice(0,3);

}


/* =========================
   SENTENCE
========================= */

function startSentence(){

stage = "sentence";
currentIndex = 0;

showSentence();

}


function showSentence(){

const correct = currentModule[currentIndex];

let choices = [correct];

let pool =
currentModule.filter(w => w.word !== correct.word);

choices.push(...shuffle(pool).slice(0,3));

choices = shuffle(choices);

document.getElementById("stageTitle").innerHTML =

`<h2>📝 Sentence Practice</h2>
<div class="small">
Word ${currentIndex + 1} of ${currentModule.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="definition">
${correct.sentence}
</div>

<h3 style="text-align:center">
Which word completes the sentence?
</h3>

<div id="sentenceOptions"></div>

`;

const box =
document.getElementById("sentenceOptions");

choices.forEach(choice => {

const btn = document.createElement("button");

btn.className = "option";
btn.textContent = choice.word;

btn.onclick = () => {

const all = box.querySelectorAll("button");

all.forEach(b => b.disabled = true);

sentenceAnswered++;

if(choice.word === correct.word){

btn.classList.add("correct");

score += 20;
sentenceCorrect++;

}else{

btn.classList.add("wrong");

all.forEach(b => {

if(b.textContent === correct.word){

b.classList.add("correct");

}

});

if(!failedWords.includes(correct)){

failedWords.push(correct);

}

}

updateScore();

setTimeout(() => {

currentIndex++;

if(currentIndex < currentModule.length){

showSentence();

}else{

startHangman();

}

},700);

};

box.appendChild(btn);

});

updateProgress(currentIndex,currentModule.length);

}


/* =========================
   HANGMAN
========================= */

function startHangman(){

stage = "hangman";
currentIndex = 0;

showHangman();

}


function showHangman(){

hangmanCurrent =
currentModule[currentIndex];

hangmanWord =
hangmanCurrent.word.toLowerCase();

guessedLetters = [];
attemptsLeft = 6;

renderHangman();

}


function renderHangman(){

const w = hangmanCurrent;

let display = "";

for(const letter of hangmanWord){

if(guessedLetters.includes(letter)){

display +=
letter.toUpperCase() + " ";

}else{

display += "_ ";

}

}

document.getElementById("stageTitle").innerHTML =

`<h2>🎮 Hangman</h2>
<div class="small">
Word ${currentIndex + 1} of ${currentModule.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="translation">
🇪🇸 ${w.translation}
</div>

<div class="definition">
<strong>Definition:</strong><br>
${w.definition}
</div>

<div style="text-align:center">
❤️ Attempts left: ${attemptsLeft}
</div>

<div class="hangman-word">
${display}
</div>

<div class="letters" id="letters"></div>

`;

const box =
document.getElementById("letters");

const alphabet =
"abcdefghijklmnopqrstuvwxyz";

for(const letter of alphabet){

const btn =
document.createElement("button");

btn.className = "letter-btn";

btn.textContent =
letter.toUpperCase();

btn.onclick = () =>
guessLetter(letter);

box.appendChild(btn);

}

updateProgress(currentIndex,currentModule.length);

}


function guessLetter(letter){

if(guessedLetters.includes(letter))
return;

guessedLetters.push(letter);

if(hangmanWord.includes(letter)){

score += 10;
hangmanScore += 10;

}else{

attemptsLeft--;

}

updateScore();

const complete =
[...new Set(hangmanWord)]
.every(letter =>
guessedLetters.includes(letter)
);

if(complete){

score += 50;
hangmanScore += 50;

updateScore();

document.getElementById("content").innerHTML = `

<div class="feedback success">
🎉 Correct!
</div>

<div class="word">
${hangmanCurrent.word}
</div>

<div class="feedback">
+50 completion bonus!
</div>

<button onclick="nextHangman()">
Continue →
</button>

`;

return;

}

if(attemptsLeft <= 0){

if(!failedWords.includes(hangmanCurrent)){

failedWords.push(hangmanCurrent);

}

document.getElementById("content").innerHTML = `

<div class="feedback danger">
Not quite!
</div>

<div class="word">
${hangmanCurrent.word}
</div>

<div class="definition">
The correct spelling is:
<strong>${hangmanCurrent.word}</strong>
</div>

<button onclick="nextHangman()">
Continue →
</button>

`;

return;

}

renderHangman();

}


function nextHangman(){

currentIndex++;

if(currentIndex < currentModule.length){

showHangman();

}else{

startReview();

}

}


/* =========================
   REVIEW
========================= */

function startReview(){

const reviewWords =
[...new Map(
failedWords.map(w => [w.word,w])
).values()];

if(reviewWords.length === 0){

showFinal();
return;

}

showReviewIntro(reviewWords);

}


function showReviewIntro(reviewWords){

document.getElementById("stageTitle").innerHTML =
`<h2>🔥 Final Review</h2>`;

document.getElementById("content").innerHTML = `

<div class="feedback">
You missed ${reviewWords.length}
${reviewWords.length === 1 ? "word" : "words"}.
</div>

<div class="definition">
Let's practice the words that need more work.
</div>

<button onclick="startReviewSpelling()">
Start Review →
</button>

`;

window.reviewWords = reviewWords;
window.reviewIndex = 0;

}


function startReviewSpelling(){

reviewIndex = 0;

reviewSpelling();

}


function reviewSpelling(){

if(reviewIndex >= reviewWords.length){

reviewIndex = 0;
reviewSentence();

return;

}

const correct =
reviewWords[reviewIndex];

let choices =
makeMisspellings(correct.word);

choices =
shuffle([correct.word,...choices]);

document.getElementById("stageTitle").innerHTML =
`<h2>🔥 Review Spelling</h2>
<div class="small">
${reviewIndex + 1} of ${reviewWords.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="translation">
🇪🇸 ${correct.translation}
</div>

<div class="definition">
${correct.definition}
</div>

<h3 style="text-align:center">
Which spelling is correct?
</h3>

<div id="reviewOptions"></div>

`;

const box =
document.getElementById("reviewOptions");

choices.forEach(choice => {

const btn =
document.createElement("button");

btn.className = "option";
btn.textContent = choice;

btn.onclick = () => {

const all =
box.querySelectorAll("button");

all.forEach(b => b.disabled = true);

if(choice === correct.word){

btn.classList.add("correct");
score += 20;

}else{

btn.classList.add("wrong");

all.forEach(b => {

if(b.textContent === correct.word){

b.classList.add("correct");

}

});

}

updateScore();

setTimeout(() => {

reviewIndex++;
reviewSpelling();

},700);

};

box.appendChild(btn);

});

}


function reviewSentence(){

if(reviewIndex >= reviewWords.length){

reviewIndex = 0;
reviewHangman();

return;

}

const correct =
reviewWords[reviewIndex];

let choices = [correct];

let pool =
currentModule.filter(w =>
w.word !== correct.word
);

choices.push(...shuffle(pool).slice(0,3));

choices = shuffle(choices);

document.getElementById("stageTitle").innerHTML =
`<h2>🔥 Review Sentence</h2>
<div class="small">
${reviewIndex + 1} of ${reviewWords.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="definition">
${correct.sentence}
</div>

<h3 style="text-align:center">
Choose the correct word.
</h3>

<div id="reviewSentenceOptions"></div>

`;

const box =
document.getElementById("reviewSentenceOptions");

choices.forEach(choice => {

const btn =
document.createElement("button");

btn.className = "option";
btn.textContent = choice.word;

btn.onclick = () => {

const all =
box.querySelectorAll("button");

all.forEach(b => b.disabled = true);

if(choice.word === correct.word){

btn.classList.add("correct");
score += 20;

}else{

btn.classList.add("wrong");

all.forEach(b => {

if(b.textContent === correct.word){

b.classList.add("correct");

}

});

}

updateScore();

setTimeout(() => {

reviewIndex++;
reviewSentence();

},700);

};

box.appendChild(btn);

});

}


function reviewHangman(){

if(reviewIndex >= reviewWords.length){

showFinal();
return;

}

hangmanCurrent =
reviewWords[reviewIndex];

hangmanWord =
hangmanCurrent.word.toLowerCase();

guessedLetters = [];
attemptsLeft = 6;

renderReviewHangman();

}


function renderReviewHangman(){

let display = "";

for(const letter of hangmanWord){

if(guessedLetters.includes(letter)){

display +=
letter.toUpperCase() + " ";

}else{

display += "_ ";

}

}

document.getElementById("stageTitle").innerHTML =
`<h2>🔥 Review Hangman</h2>
<div class="small">
${reviewIndex + 1} of ${reviewWords.length}
</div>`;

document.getElementById("content").innerHTML = `

<div class="translation">
🇪🇸 ${hangmanCurrent.translation}
</div>

<div class="definition">
${hangmanCurrent.definition}
</div>

<div style="text-align:center">
❤️ Attempts left: ${attemptsLeft}
</div>

<div class="hangman-word">
${display}
</div>

<div class="letters" id="reviewLetters"></div>

`;

const box =
document.getElementById("reviewLetters");

const alphabet =
"abcdefghijklmnopqrstuvwxyz";

for(const letter of alphabet){

const btn =
document.createElement("button");

btn.className = "letter-btn";

btn.textContent =
letter.toUpperCase();

btn.onclick = () =>
reviewGuess(letter);

box.appendChild(btn);

}

}


function reviewGuess(letter){

if(guessedLetters.includes(letter))
return;

guessedLetters.push(letter);

if(hangmanWord.includes(letter)){

score += 10;

}else{

attemptsLeft--;

}

updateScore();

const complete =
[...new Set(hangmanWord)]
.every(letter =>
guessedLetters.includes(letter)
);

if(complete){

score += 50;

updateScore();

document.getElementById("content").innerHTML = `

<div class="feedback success">
🎉 You got it!
</div>

<div class="word">
${hangmanCurrent.word}
</div>

<button onclick="nextReviewHangman()">
Continue →
</button>

`;

return;

}

if(attemptsLeft <= 0){

document.getElementById("content").innerHTML = `

<div class="feedback danger">
Keep practicing!
</div>

<div class="word">
${hangmanCurrent.word}
</div>

<button onclick="nextReviewHangman()">
Continue →
</button>

`;

return;

}

renderReviewHangman();

}


function nextReviewHangman(){

reviewIndex++;

reviewHangman();

}


/* =========================
   FINAL
========================= */

function showFinal(){

document.getElementById("game")
.classList.add("hidden");

document.getElementById("final")
.classList.remove("hidden");

document.getElementById("finalScore")
.textContent = score;

document.getElementById("spellingCorrect")
.textContent =
`${spellingCorrect} / ${currentModule.length}`;

document.getElementById("sentenceCorrect")
.textContent =
`${sentenceCorrect} / ${currentModule.length}`;

document.getElementById("hangmanPoints")
.textContent =
hangmanScore;

const totalQuestions =
spellingAnswered + sentenceAnswered;

document.getElementById("totalQuestions")
.textContent = totalQuestions;

let accuracy = 0;

if(totalQuestions > 0){

accuracy = Math.round(
((spellingCorrect + sentenceCorrect) /
totalQuestions) * 100
);

}

document.getElementById("accuracy")
.textContent =
accuracy + "%";

if(accuracy >= 90){

document.getElementById("finalMessage")
.textContent =
"🌟 Excellent! You really know these words!";

}else if(accuracy >= 80){

document.getElementById("finalMessage")
.textContent =
"👏 Great job! Keep practicing the tricky words.";

}else if(accuracy >= 70){

document.getElementById("finalMessage")
.textContent =
"💪 Good effort! A little more practice will help.";

}else{

document.getElementById("finalMessage")
.textContent =
"📚 Keep practicing. You can master these words!";

}

}
