<header><h1>📚 Vocabulario · Aprende y practica</h1></header>
<main>
<section id="home" class="panel">

  <div class="progress"><div id="bar"></div></div>
  <div id="gameContent"></div>
</section>
<div class="footer">El progreso y la puntuación se guardan en este dispositivo.</div>
</main>

function renderHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('game').classList.add('hidden');let h='';MODULES.forEach((arr,i)=>{const s=moduleState(i),labels=['Learn','Hangman','Escribir'];h+=`<button class="module" onclick="openModule(${i})"><strong>📘 Módulo ${i+1}</strong><span class="status">${isModuleComplete(s)?'✅ Completado':`${labels[s.stage]||'Learn'} · ${doneCount(s,s.stage||0)}/22`}</span><span class="score">Puntuación: ${scoreFor(s)}%</span></button>`});document.getElementById('modules').innerHTML=h;persist()}

function saveRemedial(){const s=moduleState(moduleIndex);s.remedialQueue=[...remedialQueue];s.remedialWord=remedialWord;s.remedialPhase=remedialPhase;s.remedialReturn=remedialReturn;persist()}

function restartModule(){if(!confirm('¿Comenzar de nuevo este módulo? Se borrarán su progreso y puntuación.'))return;saved.modules[moduleIndex]={stage:0,stageIndex:0,stageIndices:[0,0,0],stageDone:[Array(22).fill(false),Array(22).fill(false),Array(22).fill(false)],score:100,hangWrongTotal:0,writeWrongTotal:0,untracedWords:[],completed:false,repeatWords:[],firstPassErrors:0,remedialQueue:[],remedialWord:'',remedialPhase:'',remedialReturn:'free'};remedialQueue=[];remedialWord='';remedialPhase='';remedialReturn='free';mode='learn';index=0;list=MODULES[moduleIndex];persist();renderCurrent()}
function updateTraceProgress(){const status=document.getElementById('traceStatus'),btn=document.getElementById('learnNext');if(status)status.textContent=`Trazos individuales: ${Math.min(traceStrokeCount,5)}/5`;if(btn)btn.disabled=traceStrokeCount<5}
function clearTrace(){if(traceState)traceState.reset();document.querySelectorAll('#traceGuide .traceletter').forEach(el=>el.classList.remove('traced'));traceLength=0;traceMinX=Infinity;traceMaxX=-Infinity;traceVisited=new Set();traceReady=false;traceStrokeCount=0;updateTraceProgress();}
function speak(w=current()){if(!('speechSynthesis'in window)){alert('Este navegador no tiene audio disponible.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.75;speechSynthesis.speak(u)}
function renderLearn(){const w=currentWord,d=VOCAB[w];document.getElementById('gameContent').innerHTML=`<div class="center"><p class="wordcount">${remedialPhase?'REPASO · ':''}LEARN</p><div class="word">${esc(w)}</div>${cardInfo(w)}<div class="tracebox" id="traceBox"><div class="traceguide" id="traceGuide">${[...w].map((ch,i)=>ch===' '?'<span class="tracespace">&nbsp;</span>':`<span class="traceletter" data-letter="${i}">${esc(ch)}</span>`).join('')}</div><canvas id="traceCanvas" aria-label="Área para trazar la palabra"></canvas></div><p id="traceStatus" class="tracestatus" aria-live="polite">Trazos individuales: 0/5</p><div class="traceactions"><button class="secondary" onclick="clearTrace()">Borrar trazo</button></div><div class="btnrow"><button class="secondary" onclick="speak()">🔊 Escuchar otra vez</button><button class="primary" id="learnNext" onclick="nextLearn()" disabled>Siguiente →</button></div></div>`;startTrace();setTimeout(()=>speak(w),180)}
function startTrace(){const canvas=document.getElementById('traceCanvas');if(!canvas)return;traceStrokeCount=0;updateTraceProgress();const dpr=Math.max(1,window.devicePixelRatio||1),rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);const ctx=canvas.getContext('2d'),trail=document.createElement('canvas');trail.width=canvas.width;trail.height=canvas.height;const trailCtx=trail.getContext('2d');trailCtx.setTransform(dpr,0,0,dpr,0,0);trailCtx.lineWidth=4;trailCtx.lineCap='round';trailCtx.lineJoin='round';trailCtx.strokeStyle='#5479d7';const letters=[...document.querySelectorAll('#traceGuide .traceletter')].map(el=>{const r=el.getBoundingClientRect(),w=r.width,h=r.height,mw=Math.max(1,Math.ceil(w*dpr)),mh=Math.max(1,Math.ceil(h*dpr)),glyph=document.createElement('canvas');glyph.width=mw;glyph.height=mh;const gctx=glyph.getContext('2d'),style=getComputedStyle(el);gctx.setTransform(dpr,0,0,dpr,0,0);gctx.fillStyle='#fff';gctx.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;gctx.textAlign='center';gctx.textBaseline='middle';gctx.fillText(el.textContent,mw/(2*dpr),mh/(2*dpr));const pixels=gctx.getImageData(0,0,mw,mh).data,outline=[];for(let py=1;py<mh-1;py++)for(let px=1;px<mw-1;px++){const at=(py*mw+px)*4;if(pixels[at+3]<40)continue;if(pixels[at-1]<24||pixels[at+7]<24||pixels[at-mw*4+3]<24||pixels[at+mw*4+3]<24)outline.push({x:px,y:py})}return{el,x:r.left-rect.left,y:r.top-rect.top,w,h,outline,visited:false}});const contourMask=document.createElement('canvas');contourMask.width=canvas.width;contourMask.height=canvas.height;const maskCtx=contourMask.getContext('2d'),maskData=maskCtx.createImageData(canvas.width,canvas.height),radius=7*dpr;for(const q of letters)for(const o of q.outline){const cx=Math.round(q.x*dpr)+o.x,cy=Math.round(q.y*dpr)+o.y,reach=Math.ceil(radius);for(let yy=-reach;yy<=reach;yy++)for(let xx=-reach;xx<=reach;xx++){if(xx*xx+yy*yy>radius*radius)continue;const gx=cx+xx,gy=cy+yy;if(gx<0||gy<0||gx>=canvas.width||gy>=canvas.height)continue;maskData.data[(gy*canvas.width+gx)*4+3]=255}}maskCtx.putImageData(maskData,0,0);let drawing=false,active=null;function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function findLetter(p){return letters.findIndex(q=>p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h)}function showTrace(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(trail,0,0);ctx.globalCompositeOperation='destination-in';ctx.drawImage(contourMask,0,0);ctx.globalCompositeOperation='source-over'}function drawSegment(a,b){trailCtx.beginPath();trailCtx.moveTo(a.x,a.y);trailCtx.lineTo(b.x,b.y);trailCtx.stroke();showTrace()}function finishGesture(end){if(!active)return;const q=letters[active.index],sameLetter=findLetter(end)===active.index,minDistance=Math.max(16,Math.min(q.w,q.h)*.7);if(sameLetter&&active.travel>=minDistance){traceStrokeCount++;q.visited=true;q.el.classList.add('traced');traceVisited.add(active.index);updateTraceProgress()}active=null;drawing=false;if(letters.length&&letters.every(x=>x.visited))traceReady=true}traceState={reset(){letters.forEach(q=>{q.visited=false;q.el.classList.remove('traced')});trailCtx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);ctx.clearRect(0,0,canvas.width,canvas.height);traceVisited=new Set();traceReady=false;traceStrokeCount=0;updateTraceProgress();active=null;drawing=false}};canvas.onpointerdown=e=>{e.preventDefault();const p=point(e),idx=findLetter(p);if(idx<0)return;drawing=true;active={index:idx,last:p,travel:0};drawSegment(p,{x:p.x+.1,y:p.y+.1});if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing||!active)return;e.preventDefault();const p=point(e),q=letters[active.index],a=active.last,mid={x:(a.x+p.x)/2,y:(a.y+p.y)/2},dist=Math.hypot(p.x-a.x,p.y-a.y);if(mid.x>=q.x&&mid.x<=q.x+q.w&&mid.y>=q.y&&mid.y<=q.y+q.h)active.travel+=dist;drawSegment(a,p);active function nextLearn(){if(traceStrokeCount<5)return;const s=moduleState(moduleIndex);traceReady=false;if(remedialPhase){remedialPhase='hangman';saveRemedial();renderCurrent();return}markStageWord(0)}
function renderHangman(){const w=currentWord;document.getElementById('gameContent').innerHTML=`<div class="center hangman-screen"><p class="wordcount">${remedialPhase?'REPASO · ':''}HANGMAN</p>${cardInfo(w)}<div class="btnrow"><button class="secondary" onclick="speak()">🔊 Repetir palabra</button></div><p class="hangword" id="hangWord">${w.split('').map(c=>c===' '?' ':'_').join(' ')}</p><svg class="hang-stage" viewBox="0 0 150 140" role="img" aria-label="Muñeco de Hangman"><g><line x1="18" y1="130" x2="112" y2="130"/><line x1="42" y1="130" x2="42" y2="12"/><line x1="42" y1="12" x2="105" y2="12"/><line x1="105" y1="12" x2="105" y2="28"/></g><circle id="hangPart1" class="hang-part" cx="105" cy="42" r="14"/><line id="hangPart2" class="hang-part" x1="105" y1="56" x2="105" y2="91"/><line id="hangPart3" class="hang-part" x1="105" y1="65" x2="84" y2="82"/><line id="hangPart4" class="hang-part" x1="105" y1="65" x2="126" y2="82"/><g id="hangPart5" class="hang-part"><line x1="105" y1="91" x2="87" y2="116"/><line x1="105" y1="91" x2="123" y2="116"/></g></svg><div id="hangFeedback" class="feedback" aria-live="polite"></div><div class="keyboard" id="keyboard">${['qwertyuiop','asdfghjkl','zxcvbnm'].map(row=>`<div class="keyboardrow">${[...row].map(c=>`<button class="key" id="key-${c}" onclick="guess('${c}')">${c}</button>`).join('')}</div>`).join('')}</div><button class="primary hidden" id="hangNext" onclick="nextHang()">Siguiente →</button></div>`;setTimeout(()=>speak(w),180)}
function guess(c){if(answered||usedLetters.has(c))return;usedLetters.add(c);document.getElementById('key-'+c)?.classList.add('used');const w=currentWord,st=moduleState(moduleIndex),feedback=document.getElementById('hangFeedback');if(w.toLowerCase().includes(c)){feedback.textContent='';feedback.className='feedback good'}else{hangErrors++;st.hangWrongTotal=(st.hangWrongTotal||0)+1;st.firstPassErrors=(st.firstPassErrors||0)+1;feedback.textContent='Esa letra no está. Sigue intentando.';feedback.className='feedback bad';document.getElementById('hangPart'+hangErrors)?.classList.add('show');setScore()}const shown=w.split('').map(ch=>ch===' '?' ':usedLetters.has(ch.toLowerCase())?ch:'_').join(' ');document.getElementById('hangWord').textContent=shown;if(!shown.includes('_')){answered=true;feedback.textContent='';feedback.className='feedback good';autoNextTimer=setTimeout(()=>{autoNextTimer=null;nextHang()},1400)}else if(hangErrors>=5){answered=true;document.getElementById('hangWord').textContent=w;feedback.textContent='No la sabe. La repetirá.';feedback.className='feedback bad';if(!st.repeatWords.includes(w))st.repeatWords.push(w);autoNextTimer=setTimeout(()=>{autoNextTimer=null;nextHang()},1400);persist()}persist()}
function nextHang(){if(remedialPhase){remedialPhase='write';saveRemedial();renderCurrent();return}markStageWord(1)}
function renderWrite(){const w=currentWord;document.getElementById('gameContent').innerHTML=`<div class="center"><p class="wordcount">${remedialPhase?'REPASO · ':''}ESCRIBIR</p>${cardInfo(w)}<button class="secondary" onclick="speak()">🔊 Repetir palabra</button><div style="margin-top:12px"><input id="writeAnswer" class="writeinput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escribe la palabra en inglés" aria-label="Escribe la palabra en inglés" onkeydown="if(event.key==='Enter'){event.preventDefault();checkWrite()}"><div class="btnrow"><button class="primary" type="button" onclick="checkWrite()">Comprobar</button></div></div><div id="writeFeedback" class="feedback" aria-live="polite"></div><div id="writeHints" class="notice hidden" aria-live="polite"></div><button class="primary hidden" id="writeNext" onclick="nextWrite()">Siguiente →</button></div>`;document.getElementById('writeAnswer').focus({preventScroll:true});setTimeout(()=>speak(w),180)}
function showWriteNext(){const btn=document.getElementById('writeNext');btn.classList.remove('hidden');document.getElementById('writeAnswer').blur();setTimeout(()=>btn.scrollIntoView({block:'nearest'}),80)}
function checkWrite(e){if(e&&e.preventDefault)e.preventDefault();if(answered)return;const w=currentWord,v=document.getElementById('writeAnswer').value.trim(),feedback=document.getElementById('writeFeedback'),hintBox=document.getElementById('writeHints'),st=moduleState(moduleIndex);if(!v){feedback.textContent='Escribe la palabra antes de comprobar.';feedback.className='feedback bad';document.getElementById('writeAnswer').focus({preventScroll:true});return}if(v.toLocaleLowerCase()===w.toLocaleLowerCase()){answered=true;feedback.textContent='¡Correcto!';feedback.className='feedback good';hintBox.classList.add('hidden');document.getElementById('writeAnswer').blur();autoNextTimer=setTimeout(()=>{autoNextTimer=null;nextWrite()},800)}else{writeAttempts++;st.writeWrongTotal=(st.writeWrongTotal||0)+1;st.firstPassErrors=(st.firstPassErrors||0)+1;setScore();feedback.textContent=`No es correcto. Intento ${writeAttempts} de 2.`;feedback.className='feedback bad';const target=[...w.toLocaleLowerCase()],typed=[...v.toLocaleLowerCase()],dp=Array.from({length:target.length+1},()=>Array(typed.length+1).fill(0));for(let i=0;i<=target.length;i++)dp[i][0]=i;for(let j=0;j<=typed.length;j++)dp[0][j]=j;for(let i=1;i<=target.length;i++)for(let j=1;j<=typed.length;j++)dp[i][j]=Math.min(dp[i-1][j-1]+(target[i-1]===typed[j-1]?0:1),dp[i-1][j]+1,dp[i][j-1]+1);const edits=[];let i=target.length,j=typed.length;while(i||j){if(i&&j&&target[i-1]===typed[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--}else if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){edits.push({type:'replace',wrong:typed[j-1],right:w[i-1]});i--;j--}else if(i&&dp[i][j]===dp[i-1][j]+1){edits.push({type:'missing',right:w[i-1]});i--}else{edits.push({type:'extra',wrong:typed[j-1]});j--}}const hints=[];edits.reverse().forEach(edit=>{const hint=edit.type==='missing'?`Falta la letra “${esc(edit.right)}”.`:edit.type==='extra'?`La letra “${esc(edit.wrong)}” sobra.`:`La letra “${esc(edit.wrong)}” no va; escribe “${esc(edit.right)}”.`;if(!hints.includes(hint))hints.push(hint)});hintBox.innerHTML='<b>Revisa las letras:</b><br>'+hints.join('<br>');hintBox.classList.remove('hidden');if(writeAttempts>=2){answered=true;feedback.textContent=`La palabra era “${w}”. La repetirás en las tres partes.`;if(!st.repeatWords.includes(w))st.repeatWords.push(w);showWriteNext()}else{document.getElementById('writeAnswer').focus({preventScroll:true})}persist()}}
function nextWrite(){if(remedialPhase){finishRemedial();return}markStageWord(2)}
function markStageWord(si){const s=moduleState(moduleIndex);s.stageDone[si][index]=true;let next=s.stageDone[si].findIndex(done=>!done);s.stageIndices[si]=next<0?22:next;s.stage=si;index=s.stageIndices[si];persist();if(allStagesDone(s)){if((s.repeatWords||[]).length){beginRemediation();return}completeModule();return}if(s.stageIndices[si]>=22){for(let step=1;step<=3;step++){const candidate=(si+step)%3;if(doneCount(s,candidate)<22){s.stage=candidate;mode=['learn','hangman','write'][candidate];index=s.stageIndices[candidate]||0;persist();break}}}renderCurrent()}
function advanceStage(){const s=moduleState(moduleIndex);if(s.stage<2){s.stage++;s.stageIndex=0;mode=['learn','hangman','write'][s.stage];index=0;renderCurrent();return}completeModule()}

function completeModule(){const s=moduleState(moduleIndex);if(!allStagesDone(s)||(s.repeatWords||[]).length||remedialPhase||(remedialQueue||[]).length)return;s.completed=true;s.stage=2;s.stageIndex=22;s.stageIndices=[22,22,22];persist();document.getElementById('gameContent').innerHTML=`<div class="center donebox"><h2>🎉 ¡Módulo completado!</h2><p>Terminaste las 22 palabras en las tres partes.</p><p class="scorebox">Puntuación final: ${scoreFor(s)}%</p><p class="muted small">Los errores se mantuvieron aunque repetiste la práctica.</p><div class="btnrow"><button class="primary" onclick="goHome()">Volver a módulos</button></div></div>`;setScore();document.getElementById('bar').style.width='100%'}
renderHome();
