<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Master</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

.container {
  max-width: 720px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

h2 {
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 25px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

.word {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
}

.translation {
  text-align: center;
  font-size: 19px;
  color: #526071;
  margin-bottom: 15px;
}

.definition {
  background: #f1f5f9;
  border-radius: 12px;
  padding: 15px;
  line-height: 1.5;
  margin-bottom: 20px;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  margin: 7px 0;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button:hover {
  opacity: .92;
}

.secondary {
  background: #64748b;
}

.success {
  background: #16a34a !important;
}

.danger {
  background: #dc2626 !important;
}

.option {
  background: #eef2ff;
  color: #172033;
  border: 2px solid transparent;
}

.option.correct {
  background: #dcfce7;
  border-color: #16a34a;
}

.option.wrong {
  background: #fee2e2;
  border-color: #dc2626;
}

.progress {
  height: 12px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-bar {
  height: 100%;
  background: #2563eb;
  width: 0%;
  transition: width .3s;
}

.score {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.module-btn {
  background: #1d4ed8;
  min-height: 75px;
}

.hidden {
  display: none;
}

.feedback {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 15px 0;
}

.listen-btn {
  background: #7c3aed;
}

.hangman-word {
  text-align: center;
  font-size: 30px;
  letter-spacing: 8px;
  font-weight: bold;
  margin: 25px 0;
}

.letters {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.letter-btn {
  padding: 11px 4px;
  margin: 0;
  font-size: 15px;
  background: #475569;
}

.letter-btn.used {
  opacity: .35;
}

.final-score {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  margin: 20px 0;
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  background: #f8fafc;
  border-radius: 10px;
  margin: 7px 0;
}

.small {
  color: #64748b;
  font-size: 14px;
}

@media (max-width: 500px) {
  .container {
    padding: 12px;
  }

  .word {
    font-size: 27px;
  }

  .letters {
    grid-template-columns: repeat(6, 1fr);
  }

  button {
    font-size: 16px;
  }
}
</style>
</head>

</div>

}

========================================================= */

let score = 0;

let sentenceCorrect = 0;

let spellingAnswered = 0;
let sentenceAnswered = 0;

let attemptsLeft = 6;

/* =========================================================

========================================================= */

const moduleButtons = document.getElementById("moduleButtons");

modules.forEach((module, index) => {

  const button = document.createElement("button");

  button.className = "module-btn";

  button.innerHTML =
    `Module ${index + 1}<br>
     <span class="small">${module.length} words</span>`;

  button.onclick = () => startModule(index);

  moduleButtons.appendChild(button);

});


/* =========================================================
   START MODULE
========================================================= */

function startModule(index){

  currentModuleNumber = index;

  currentModule = modules[index];

  currentIndex = 0;

  score = 0;

  spellingCorrect = 0;
  sentenceCorrect = 0;

  spellingAnswered = 0;
  sentenceAnswered = 0;

  hangmanScore = 0;

  failedWords = [];

  reviewWords = [];

  document.getElementById("home").classList.add("hidden");
  document.getElementById("final").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  updateScore();

  startLearn();

}


/* =========================================================
   STAGE 1 — LEARN
========================================================= */

function startLearn(){

  stage = "learn";

  currentIndex = 0;

  showLearn();

}


function showLearn(){

  const w = currentModule[currentIndex];

  document.getElementById("stageTitle").innerHTML =
    `<h2>📖 Learn</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="word">${w.word}</div>

    <div class="translation">
      🇪🇸 ${w.translation}
    </div>

    <div class="definition">
      <strong>Definition:</strong><br>
      ${w.definition}
    </div>

    <button class="listen-btn" onclick="speakWord('${w.word}')">
      🔊 Listen
    </button>

    <button onclick="nextLearn()">
      Continue →
    </button>
  `;

  updateProgress(currentIndex, currentModule.length);

}


function nextLearn(){

  currentIndex++;

  if(currentIndex < currentModule.length){

    showLearn();

  } else {

    startListen();

  }

}


/* =========================================================
   SPEECH
========================================================= */

function speakWord(word){

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(word);

    utterance.lang = "en-US";
    utterance.rate = 0.75;

    window.speechSynthesis.speak(utterance);

  }

}


/* =========================================================
   STAGE 2 — LISTEN & CHOOSE
========================================================= */

function startListen(){

  stage = "listen";

  currentIndex = 0;

  showListen();

}


function showListen(){

  const correct = currentModule[currentIndex];

  let choices = [correct];

  let pool = currentModule.filter(w => w.word !== correct.word);

  pool = shuffle(pool);

  choices.push(...pool.slice(0,3));

  choices = shuffle(choices);

  document.getElementById("stageTitle").innerHTML =
    `<h2>🔊 Listen & Choose</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="translation">
      Listen carefully.
    </div>

    <button class="listen-btn" onclick="speakWord('${correct.word}')">
      🔊 Play Word
    </button>

    <div id="listenOptions"></div>

  `;

  const box = document.getElementById("listenOptions");

  choices.forEach(choice => {

    const btn = document.createElement("button");

    btn.className = "option";

    btn.textContent = choice.word;

    btn.onclick = () => {

      const all = box.querySelectorAll("button");

      all.forEach(b => b.disabled = true);

      if(choice.word === correct.word){

        btn.classList.add("correct");

        score += 10;

      } else {

        btn.classList.add("wrong");

        all.forEach(b => {

          if(b.textContent === correct.word){
            b.classList.add("correct");
          }

        });

        if(!failedWords.includes(correct)){
          failedWords.push(correct);
        }

      }

      updateScore();

      setTimeout(() => {

        currentIndex++;

        if(currentIndex < currentModule.length){

          showListen();

        } else {

          startSpelling();

        }

      },700);

    };

    box.appendChild(btn);

  });

  updateProgress(currentIndex, currentModule.length);

}

========================================================= */

  stage = "spelling";

  currentIndex = 0;

  showSpelling();

/* =========================================================
   CREATE MISSPELLINGS
========================================================= */

function makeMisspellings(word){

  const results = [];

  // Remove a letter
  if(word.length > 5){

    const pos = Math.floor(word.length / 2);

    results.push(
      word.slice(0,pos) + word.slice(pos+1)
    );

  }

  // Duplicate a letter
  const duplicatePos = Math.min(2, word.length - 1);

  results.push(
    word.slice(0,duplicatePos) +
    word[duplicatePos] +
    word.slice(duplicatePos)
  );

  // Swap two letters
  if(word.length > 4){

    const pos = Math.min(2, word.length - 2);

    let arr = word.split("");

    let temp = arr[pos];

    arr[pos] = arr[pos+1];

    arr[pos+1] = temp;

    results.push(arr.join(""));

  }

  // Guarantee 3 unique wrong answers
  while(results.length < 3){

    let arr = word.split("");

    let pos = Math.floor(Math.random() * arr.length);

    const letters = "abcdefghijklmnopqrstuvwxyz";

    let newLetter =
      letters[Math.floor(Math.random() * letters.length)];

    if(newLetter === arr[pos]){
      newLetter = "x";
    }

    arr[pos] = newLetter;

    const candidate = arr.join("");

    if(candidate !== word && !results.includes(candidate)){
      results.push(candidate);
    }

  }

  return [...new Set(results)].slice(0,3);

}

  attemptsLeft = 6;

  renderHangman();

}


function renderHangman(){

  const w = hangmanCurrent;

  let display = "";

  for(const letter of hangmanWord){

    if(letter === " "){
      display += "  ";
    }
    else if(guessedLetters.includes(letter)){
      display += letter.toUpperCase() + " ";
    }
    else{
      display += "_ ";
    }

  }

  document.getElementById("stageTitle").innerHTML =
    `<h2>🎮 Hangman</h2>
     <div class="small">
     Word ${currentIndex + 1} of ${currentModule.length}
     </div>`;

  document.getElementById("content").innerHTML = `

    <div class="translation">
      🇪🇸 ${w.translation}
    </div>

    <div class="definition">
      <strong>Definition:</strong><br>
      ${w.definition}
    </div>

    <div style="text-align:center">
      ❤️ Attempts left: ${attemptsLeft}
    </div>

    <div class="hangman-word">
      ${display}
    </div>

    <div class="letters" id="letters"></div>

  `;

  const lettersBox = document.getElementById("letters");

  const alphabet = "abcdefghijklmnopqrstuvwxyz";

  for(const letter of alphabet){

    const btn = document.createElement("button");

    btn.className = "letter-btn";

    btn.textContent = letter.toUpperCase();

    if(guessedLetters.includes(letter)){
      btn.disabled = true;
      btn.classList.add("used");
    }

    btn.onclick = () => guessLetter(letter);

    lettersBox.appendChild(btn);

  }

  updateProgress(currentIndex, currentModule.length);

}


function guessLetter(letter){

  if(guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if(hangmanWord.includes(letter)){

    score += 10;
    hangmanScore += 10;

  } else {

    attemptsLeft--;

  }

  updateScore();

  const complete =
    [...new Set(hangmanWord.replace(/ /g,""))]
    .every(letter => guessedLetters.includes(letter));

  if(complete){

    score += 50;
    hangmanScore += 50;

    updateScore();

    document.getElementById("content").innerHTML = `

      <div class="feedback">
        🎉 Correct!
      </div>

      <div class="word">
        ${wSafe(hangmanWord)}
      </div>

      <div class="feedback success">
        +50 completion bonus!
      </div>

      <button onclick="nextHangman()">
        Continue →
      </button>

    `;

    return;
  }

  if(attemptsLeft <= 0){

    if(!failedWords.includes(hangmanCurrent)){
      failedWords.push(hangmanCurrent);
    }

    document.getElementById("content").innerHTML = `

      <div class="feedback danger">
        Not quite!
      </div>

      <div class="word">
        ${hangmanCurrent.word}
      </div>

      <div class="definition">
        The correct spelling is:
        <strong>${hangmanCurrent.word}</strong>
      </div>

      <button onclick="nextHangman()">
        Continue →
      </button>

    `;

    return;
  }

  renderHangman();

}

    totalQuestions;

  let accuracy = 0;

  if(totalQuestions > 0){

    accuracy = Math.round(
      ((spellingCorrect + sentenceCorrect) /
      (totalQuestions)) * 100
    );

  }

  document.getElementById("accuracy").textContent =
    accuracy + "%";

  let message = "";

  if(accuracy >= 90){

    message = "🌟 Excellent! You really know these words!";

  }
  else if(accuracy >= 80){

    message = "👏 Great job! Keep practicing the tricky words.";

  }
  else if(accuracy >= 70){

    message = "💪 Good effort! A little more practice will help.";

  }
  else{

    message = "📚 Keep practicing. You can master these words!";

  }

  document.getElementById("finalMessage").textContent =
    message;

}


/* =========================================================
   HELPERS
========================================================= */

function shuffle(array){

  return array
    .map(value => ({value, sort:Math.random()}))
    .sort((a,b) => a.sort-b.sort)
    .map(({value}) => value);

}


function updateScore(){

  document.getElementById("score").textContent = score;

}


function updateProgress(index,total){

  const percent =
    ((index) / total) * 100;

  document.getElementById("progressBar").style.width =
    percent + "%";

}


function wSafe(word){

  return word.charAt(0).toUpperCase() +
         word.slice(1);

}


function goHome(){

  document.getElementById("final").classList.add("hidden");

  document.getElementById("game").classList.add("hidden");

  document.getElementById("home").classList.remove("hidden");

}
